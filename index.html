    pulse.appendChild(circle);
    pulse.appendChild(text);
    g.appendChild(pulse);
    this.nodeLayer.appendChild(g);
    const rec = { g, pulse, circle, text, _state: 'default' };
    this.nodeEls.set(id, rec);

    // Click-to-inspect (only fires when not dragging)
    g.addEventListener('click', (e) => {
      if (this._didDrag) return;
      InspectTooltip.show(e.clientX, e.clientY, 'Graph Node', {
        id,
        label,
        state: rec._state,
      });
      e.stopPropagation();
    });

    // Drag initiation
    g.addEventListener('pointerdown', (e) => this._startDrag(e, id));

    return rec;
  }

  _makeEdge(){
    const NS = 'http://www.w3.org/2000/svg';
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', 0); line.setAttribute('y1', 0);
    line.setAttribute('x2', 1); line.setAttribute('y2', 0);
    line.classList.add('gedge');
    line.style.opacity = 0;
    this.edgeLayer.appendChild(line);
    return line;
  }

  _makeArrow(){
    const NS = 'http://www.w3.org/2000/svg';
    const tri = document.createElementNS(NS, 'path');
    tri.setAttribute('d', 'M-9,-4.5 L0,0 L-9,4.5 Z'); // tip at local origin, pointing +x
    tri.classList.add('gedge-arrow');
    tri.style.opacity = 0;
    this.arrowLayer.appendChild(tri);
    return tri;
  }

  _makeWeight(){
    const NS = 'http://www.w3.org/2000/svg';
    const text = document.createElementNS(NS, 'text');
    text.classList.add('gedge-weight');
    text.style.opacity = 0;
    this.weightLayer.appendChild(text);
    return text;
  }

  renderStep(step, { duration, easing }){
    this._lastStep = step; // cache for drag re-render
    const nodes = step.nodes || [];
    const edges = step.edges || [];
    const comparing = step.comparing;
    const frontier = new Set(step.frontier || []);
    const visited = new Set(step.visited || []);

    const presentNodeIds = new Set(nodes.map(n => n.id));
    // Apply drag overrides on top of step positions
    const posById = new Map(nodes.map(n => {
      const ov = this._posOverrides.get(n.id);
      return [n.id, ov ? { ...n, ...ov } : n];
    }));

    this.nodeEls.forEach((rec, id) => {
      if (presentNodeIds.has(id)) return;
      Motion.fadeTo(rec.g, 0, { duration, easing });
      Pulse.stop(rec.pulse);
      this.nodeEls.delete(id);
      this._posOverrides.delete(id);
      setTimeout(() => rec.g.remove(), duration + 30);
    });

    nodes.forEach(n => {
      const pos = posById.get(n.id);
      const isNew = !this.nodeEls.has(n.id);
      const rec = isNew ? this._makeNode(n.id, n.value) : this.nodeEls.get(n.id);
      if (isNew) rec.g.style.transform = Motion.stringify({ x: pos.x, y: pos.y });
      // Don't animate a node that's currently being dragged — it tracks the pointer directly.
      if (!this._drag || this._drag.id !== n.id)
        Motion.moveTo(rec.g, { x: pos.x, y: pos.y }, { duration, easing });
      Motion.fadeTo(rec.g, 1, { duration, easing });

      const isComparing = comparing === n.id;
      rec.circle.classList.toggle('is-comparing', isComparing);
      rec.circle.classList.toggle('is-frontier', !isComparing && frontier.has(n.id));
      rec.circle.classList.toggle('is-visited', !isComparing && visited.has(n.id));
      if (isComparing) Pulse.start(rec.pulse); else Pulse.stop(rec.pulse);
      rec._state = isComparing ? 'comparing' : frontier.has(n.id) ? 'frontier' : visited.has(n.id) ? 'visited' : 'default';
    });

    const presentEdgeIds = new Set(edges.map(e => e.id));
    this.edgeEls.forEach((line, id) => {
      if (presentEdgeIds.has(id)) return;
      Motion.fadeTo(line, 0, { duration, easing });
      this.edgeEls.delete(id);
      setTimeout(() => line.remove(), duration + 30);
    });
    this.arrowEls.forEach((tri, id) => {
      if (presentEdgeIds.has(id)) return;
      Motion.fadeTo(tri, 0, { duration, easing });
      this.arrowEls.delete(id);
      setTimeout(() => tri.remove(), duration + 30);
    });
    this.weightEls.forEach((text, id) => {
      if (presentEdgeIds.has(id)) return;
      Motion.fadeTo(text, 0, { duration, easing });
      this.weightEls.delete(id);
      setTimeout(() => text.remove(), duration + 30);
    });

    edges.forEach(e => {
      const a = posById.get(e.from), b = posById.get(e.to);
      if (!a || !b) return;
      const target = this._edgeTransform(a, b);

      const isNewEdge = !this.edgeEls.has(e.id);
      const line = isNewEdge ? this._makeEdge() : this.edgeEls.get(e.id);
      if (isNewEdge){
        line.style.transform = Motion.stringify({ ...target, scaleX: 0.001 });
        this.edgeEls.set(e.id, line);
      }
      Motion.moveTo(line, target, { duration, easing });
      Motion.fadeTo(line, 1, { duration, easing });

      if (this.directed){
        const rad = target.angle * Math.PI / 180;
        const tip = { x: target.x + target.scaleX * Math.cos(rad), y: target.y + target.scaleX * Math.sin(rad), angle: target.angle };
        const isNewArrow = !this.arrowEls.has(e.id);
        const tri = isNewArrow ? this._makeArrow() : this.arrowEls.get(e.id);
        if (isNewArrow){
          tri.style.transform = Motion.stringify(tip);
          this.arrowEls.set(e.id, tri);
        }
        Motion.moveTo(tri, tip, { duration, easing });
        Motion.fadeTo(tri, 1, { duration, easing });
      }

      if (e.w != null){
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const isNewW = !this.weightEls.has(e.id);
        const text = isNewW ? this._makeWeight() : this.weightEls.get(e.id);
        text.textContent = e.w;
        if (isNewW){
          text.style.transform = Motion.stringify(mid);
          this.weightEls.set(e.id, text);
        }
        Motion.moveTo(text, mid, { duration, easing });
        Motion.fadeTo(text, 1, { duration, easing });
      }
    });
  }
}

function computeCircleLayout(ids, { width = 640, height = 420, radius = 160 } = {}){
  const cx = width / 2, cy = height / 2;
  const n = ids.length;
  const positions = new Map();
  ids.forEach((id, i) => {
    const angle = -Math.PI / 2 + (i / n) * 2 * Math.PI; // start at the top, sweep clockwise
    positions.set(id, { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) });
  });
  return positions;
}

// Longest-path-from-any-source layering for a DAG — simple relaxation
// (correct and guaranteed to converge for a small acyclic graph, no
// separate topo-sort pass needed first).
function computeDagLayers(nodeIds, adj){
  const layer = {};
  nodeIds.forEach(id => { layer[id] = 0; });
  let changed = true;
  while (changed){
    changed = false;
    nodeIds.forEach(id => {
      (adj[id] || []).forEach(nb => {
        if (layer[nb] < layer[id] + 1){ layer[nb] = layer[id] + 1; changed = true; }
      });
    });
  }
  return layer;
}

function computeLayeredLayout(nodeIds, layer, { hGap = 120, vGap = 90, marginX = 60, marginY = 60 } = {}){
  const byLayer = {};
  nodeIds.forEach(id => { (byLayer[layer[id]] = byLayer[layer[id]] || []).push(id); });
  const positions = new Map();
  Object.keys(byLayer).forEach(l => {
    byLayer[l].forEach((id, i) => {
      positions.set(id, { x: marginX + Number(l) * hGap, y: marginY + i * vGap });
    });
  });
  return positions;
}

/* ============================================================
   RENDERER: adjacency-list panel (plain HTML). Fixed per-node

/* ============================================================
   RENDERER: Dijkstra side panel (plain HTML) — a fixed distance
   table (one row per node, updated live) above a priority-queue
   list. The PQ list is small and reorders every step, so it's
   simply re-rendered wholesale each time rather than FLIP-animated
   — a deliberate scope cut: it's a secondary readout, not the
   lesson's main teaching visualization.
   ============================================================ */
class DijkstraPanelRenderer{
  constructor({ nodeIds } = {}){
    this.nodeIds = nodeIds;
    this.rowEls = new Map();
  }

  mount(container){
    const wrap = document.createElement('div');
    wrap.className = 'dijkstra-panel';

    const tableTitle = document.createElement('div');
    tableTitle.className = 'dijkstra-panel__title';
    tableTitle.textContent = 'Distances from A';
    const table = document.createElement('div');
    table.className = 'dijkstra-table';
    this.nodeIds.forEach(id => {
      const row = document.createElement('div');
      row.className = 'dijkstra-row';
      const name = document.createElement('span');
      name.className = 'dijkstra-row__id';
      name.textContent = id;
      const val = document.createElement('span');
      val.className = 'dijkstra-row__dist';
      val.textContent = '∞';
      row.appendChild(name);
      row.appendChild(val);
      table.appendChild(row);
      this.rowEls.set(id, { row, val });
    });

    const pqTitle = document.createElement('div');
    pqTitle.className = 'dijkstra-panel__title';
    pqTitle.textContent = 'Priority Queue (smallest first)';
    const pq = document.createElement('div');
    pq.className = 'dijkstra-pq';

    wrap.appendChild(tableTitle);
    wrap.appendChild(table);
    wrap.appendChild(pqTitle);
    wrap.appendChild(pq);
    container.appendChild(wrap);
    this.pqEl = pq;
  }

  renderStep(step){
    const distances = step.distances || {};
    const settled = new Set(step.settled || []);
    this.nodeIds.forEach(id => {
      const { row, val } = this.rowEls.get(id);
      const d = distances[id];
      val.textContent = d === Infinity || d == null ? '∞' : d;
      row.classList.toggle('is-settled', settled.has(id));
      row.classList.toggle('is-active', step.activeNode === id);
    });

    this.pqEl.innerHTML = '';
    (step.pq || []).forEach((entry, i) => {
      const div = document.createElement('div');
      div.className = 'dijkstra-pq__item' + (i === 0 ? ' is-active' : '');
      div.textContent = `${entry.id} (${entry.dist})`;
      this.pqEl.appendChild(div);
    });
  }
}

/* ============================================================
   DEMO: graph representations — adjacency list built up live next
   to the node-link diagram.
   ============================================================ */
function graphRepSteps(){
  const nodeIds = ['A', 'B', 'C', 'D', 'E'];
  const adj = { A: ['B', 'C'], B: ['A', 'C', 'D'], C: ['A', 'B', 'E'], D: ['B', 'E'], E: ['C', 'D'] };
  const edgeList = [
    { id: 'A-B', from: 'A', to: 'B' }, { id: 'A-C', from: 'A', to: 'C' }, { id: 'B-C', from: 'B', to: 'C' },
    { id: 'B-D', from: 'B', to: 'D' }, { id: 'C-E', from: 'C', to: 'E' }, { id: 'D-E', from: 'D', to: 'E' },
  ];
  const positions = computeCircleLayout(nodeIds, { width: 340, height: 320, radius: 110 });
  const nodes = nodeIds.map(id => ({ id, value: id, x: positions.get(id).x, y: positions.get(id).y }));

  const steps = [];
  const rows = {};
  const snap = (leftExtra, caption) => ({
    left: Object.assign({ nodes, edges: edgeList, comparing: null, frontier: [], visited: [], caption: '' }, leftExtra),
    right: { rows: Object.assign({}, rows) },
    caption,
  });

  steps.push(snap({}, `The same graph can be stored two ways: an adjacency LIST (each node's neighbors) or an adjacency MATRIX (a full grid of yes/no). Watch the list get built.`));

  nodeIds.forEach(id => {
    steps.push(snap({ comparing: id }, `Node ${id} connects to: ${adj[id].join(', ')}.`));
    rows[id] = { text: `${id}: ${adj[id].join(', ')}`, active: true };
    steps.push(snap({ comparing: id, visited: Object.keys(rows) }, `Add that row to the adjacency list.`));
    rows[id] = { text: rows[id].text, active: false };
  });

  steps.push(snap({ visited: nodeIds.slice() }, `${nodeIds.length} nodes, ${edgeList.length} edges: the adjacency list uses O(V + E) space. A matrix would use O(V²) regardless of how few edges exist — worth it only when the graph is dense.`));

  return steps;
}

/* ============================================================
   DEMO: BFS & DFS — same graph, same starting node, a queue vs. a
   stack. CallStackRenderer is reused verbatim for both panels (a
   vertical "next thing highlighted at top" list is exactly what a
   stack already looks like, and relabeling it as a queue changes
   nothing about the rendering — only which end of the underlying
   array gets pushed/popped).
   ============================================================ */
function bfsDfsSteps(){
  const nodeIds = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
  const adj = { A: ['B', 'C'], B: ['A', 'D', 'E'], C: ['A', 'F'], D: ['B'], E: ['B', 'G'], F: ['C', 'G'], G: ['E', 'F'] };
  const edgeList = [
    { id: 'A-B', from: 'A', to: 'B' }, { id: 'A-C', from: 'A', to: 'C' }, { id: 'B-D', from: 'B', to: 'D' },
    { id: 'B-E', from: 'B', to: 'E' }, { id: 'C-F', from: 'C', to: 'F' }, { id: 'E-G', from: 'E', to: 'G' }, { id: 'F-G', from: 'F', to: 'G' },
  ];
  const positions = computeCircleLayout(nodeIds, { width: 340, height: 320, radius: 110 });
  const nodes = nodeIds.map(id => ({ id, value: id, x: positions.get(id).x, y: positions.get(id).y }));

  const steps = [];
  const snap = (leftExtra, frames, caption) => ({
    left: Object.assign({ nodes, edges: edgeList, comparing: null, frontier: [], visited: [], caption: '' }, leftExtra),
    right: { frames },
    caption,
  });

  // NOTE: `visited` marks DISCOVERY (when a node is pushed/enqueued), used
  // for the green "done" coloring. That happens to equal PROCESS order for
  // a FIFO queue (nothing can jump the line), but NOT for a LIFO stack —
  // a later push can be popped before an earlier one. The summary caption
  // needs the actual pop order, so it's tracked separately as `order`.
  let visited = ['A'], queue = ['A'];
  const bfsOrder = [];
  steps.push(snap({ frontier: queue.slice() }, queue.slice().reverse(), `Breadth-first search explores level by level — a QUEUE naturally does this, since the oldest-discovered node always goes first.`));
  while (queue.length){
    const cur = queue.shift();
    bfsOrder.push(cur);
    steps.push(snap({ comparing: cur, frontier: queue.slice(), visited: visited.slice() }, queue.slice().reverse(), `Dequeue ${cur} (front of the queue) — visit it now.`));
    const unlocked = [];
    adj[cur].forEach(nb => { if (!visited.includes(nb)){ visited.push(nb); queue.push(nb); unlocked.push(nb); } });
    steps.push(snap({ comparing: cur, frontier: queue.slice(), visited: visited.slice() }, queue.slice().reverse(),
      unlocked.length ? `${cur}'s unvisited neighbors (${unlocked.join(', ')}) join the BACK of the queue.` : `${cur} has no unvisited neighbors.`));
  }
  steps.push(snap({ visited: visited.slice() }, [], `BFS visit order: ${bfsOrder.join(', ')}.`));

  steps.push(snap({}, [], `Same graph, same start — swap the queue for a STACK, and the exploration order changes completely.`));

  visited = ['A'];
  let stack = ['A'];
  const dfsOrder = [];
  steps.push(snap({ frontier: stack.slice() }, stack.slice(), `Depth-first search dives as deep as possible before backing up — a STACK does this naturally, since the most recently discovered node goes first.`));
  while (stack.length){
    const cur = stack.pop();
    dfsOrder.push(cur);
    steps.push(snap({ comparing: cur, frontier: stack.slice(), visited: visited.slice() }, stack.slice(), `Pop ${cur} (top of the stack) — visit it now.`));
    const unlocked = [];
    adj[cur].forEach(nb => { if (!visited.includes(nb)){ visited.push(nb); stack.push(nb); unlocked.push(nb); } });
    steps.push(snap({ comparing: cur, frontier: stack.slice(), visited: visited.slice() }, stack.slice(),
      unlocked.length ? `${cur}'s unvisited neighbors (${unlocked.join(', ')}) go ON TOP of the stack.` : `${cur} has no unvisited neighbors — back up.`));
  }
  steps.push(snap({ visited: visited.slice() }, [], `DFS visit order: ${dfsOrder.join(', ')}. Same graph, same start, completely different order — that's the queue vs. stack difference in action.`));

  return steps;
}

/* ============================================================
   DEMO: Dijkstra's shortest path — a weighted, undirected graph.
   The priority queue uses lazy deletion (stale, already-improved
   entries get silently skipped on pop) exactly like the standard
   heapq-based implementation in the code panel.
   ============================================================ */
function dijkstraSteps(){
  const nodeIds = ['A', 'B', 'C', 'D', 'E', 'F'];
  const edgeDefs = [
    ['A', 'B', 4], ['A', 'C', 1], ['B', 'C', 2],
    ['B', 'D', 5], ['C', 'D', 8], ['C', 'E', 10],
    ['D', 'E', 2], ['D', 'F', 6], ['E', 'F', 3],
  ];
  const edgeList = edgeDefs.map(([from, to, w]) => ({ id: `${from}-${to}`, from, to, w }));
  const adj = {}; nodeIds.forEach(id => { adj[id] = []; });
  edgeDefs.forEach(([from, to, w]) => { adj[from].push({ to, w }); adj[to].push({ to: from, w }); });

  const positions = computeCircleLayout(nodeIds, { width: 340, height: 320, radius: 110 });
  const nodes = nodeIds.map(id => ({ id, value: id, x: positions.get(id).x, y: positions.get(id).y }));

  const dist = {}; nodeIds.forEach(id => { dist[id] = Infinity; });
  dist.A = 0;
  const settled = [];
  let pq = [{ id: 'A', dist: 0 }];

  const steps = [];
  const snap = (leftExtra, caption) => ({
    left: Object.assign({ nodes, edges: edgeList, comparing: null, frontier: pq.map(e => e.id), visited: settled.slice(), caption: '' }, leftExtra),
    right: { distances: Object.assign({}, dist), pq: pq.slice().sort((a, b) => a.dist - b.dist), settled: settled.slice(), activeNode: leftExtra.comparing || null },
    caption,
  });

  steps.push(snap({}, `Dijkstra always processes the unsettled node with the smallest known distance next — that's exactly what a priority queue gives you for free.`));

  while (pq.length){
    pq.sort((a, b) => a.dist - b.dist);
    const { id: cur, dist: curDist } = pq.shift();
    if (settled.includes(cur)) continue; // stale entry — a better one already settled this node
    settled.push(cur);
    steps.push(snap({ comparing: cur }, `Pop ${cur} (distance ${curDist}) — the smallest in the queue. Its distance is now final.`));

    adj[cur].forEach(({ to, w }) => {
      if (settled.includes(to)) return;
      const newDist = curDist + w;
      if (newDist < dist[to]){
        const old = dist[to];
        dist[to] = newDist;
        pq.push({ id: to, dist: newDist });
        steps.push(snap({ comparing: cur }, old === Infinity
          ? `${cur} → ${to}: ${curDist} + ${w} = ${newDist}. First path found to ${to}.`
          : `${cur} → ${to}: ${curDist} + ${w} = ${newDist}, better than ${old} — update it.`));
      }
    });
  }

  steps.push(snap({}, `All nodes settled. Shortest distances from A: ${nodeIds.map(id => `${id}=${dist[id]}`).join(', ')}.`));
  return steps;
}

/* ============================================================
   DEMO: topological sort (Kahn's algorithm) — a directed course-
   prerequisite DAG, laid out left-to-right by dependency depth so
   the "order" the algorithm produces is visually obvious before
   it even runs.
   ============================================================ */
function topoSortSteps(){
  const nodeIds = ['A', 'B', 'C', 'D', 'E', 'F'];
  const labels = { A: 'Intro', B: 'DataStruct', C: 'Algorithms', D: 'Databases', E: 'OS', F: 'Capstone' };
  const edgeDefs = [['A', 'B'], ['A', 'E'], ['B', 'C'], ['B', 'D'], ['C', 'F'], ['D', 'F'], ['E', 'F']];
  const edgeList = edgeDefs.map(([from, to]) => ({ id: `${from}-${to}`, from, to }));

  const adj = {}; const indeg = {};
  nodeIds.forEach(id => { adj[id] = []; indeg[id] = 0; });
  edgeDefs.forEach(([from, to]) => { adj[from].push(to); indeg[to]++; });

  const layer = computeDagLayers(nodeIds, adj);
  const positions = computeLayeredLayout(nodeIds, layer, { hGap: 80, vGap: 70, marginX: 45, marginY: 50 });
  // Node circles show just the short id — full course names ("DataStruct",
  // "Algorithms"...) would overflow a 20px-radius circle and collide with
  // neighboring nodes at this panel width. Captions carry the full names.
  const nodes = nodeIds.map(id => ({ id, value: id, x: positions.get(id).x, y: positions.get(id).y }));

  const curIndeg = Object.assign({}, indeg);
  let queue = nodeIds.filter(id => curIndeg[id] === 0);
  const order = [];

  const steps = [];
  const snap = (leftExtra, frames, caption) => ({
    left: Object.assign({ nodes, edges: edgeList, comparing: null, frontier: queue.slice(), visited: order.slice(), caption: '' }, leftExtra),
    right: { frames },
    caption,
  });

  steps.push(snap({ frontier: queue.slice() }, queue.slice().reverse(), `Topological sort orders tasks so every prerequisite comes before what depends on it. Start with everything that has zero prerequisites.`));

  while (queue.length){
    const cur = queue.shift();
    order.push(cur);
    steps.push(snap({ comparing: cur, frontier: queue.slice() }, queue.slice().reverse(), `Process ${labels[cur]} (${cur}) — no unprocessed prerequisites left, so it's safe to place next.`));
    const unlocked = [];
    adj[cur].forEach(nb => {
      curIndeg[nb]--;
      if (curIndeg[nb] === 0){ queue.push(nb); unlocked.push(nb); }
    });
    if (unlocked.length){
      steps.push(snap({ comparing: cur, frontier: queue.slice() }, queue.slice().reverse(),
        `${labels[cur]} done — ${unlocked.map(id => labels[id]).join(', ')} now ${unlocked.length > 1 ? 'have' : 'has'} zero remaining prerequisites.`));
    }
  }

  steps.push(snap({ visited: order.slice() }, [], `Valid order: ${order.map(id => labels[id]).join(' → ')}. If a cycle existed, some nodes would never reach zero in-degree — that's exactly how this detects impossible dependencies.`));
  return steps;
}

/* ============================================================
   RENDERER: DP grid. Every cell exists from mount() (grid size is
   fixed and known upfront), starting ghosted at near-zero scale —
   "filling with a wave" is just each cell popping from that tiny
   scale to 1 via EASE.spring as the algorithm reaches it, so
   playing through steps in order reads as a ripple sweeping the
   table. Three nested elements per cell separate concerns exactly
   like the tree renderer's node/pulse split: the outer group is
   positioned once and never touched again; the middle group does
   the one-shot reveal pop (Motion); the innermost does the ongoing
   breathing pulse (Pulse) while a cell is the active computation —
   two different transform animations on two different elements,
   so they never fight each other.
   ============================================================ */
class GridRenderer{
  constructor({ rows, cols, cellSize = 44, gap = 6, marginX = 54, marginY = 40, rowLabels = [], colLabels = [] } = {}){
    this.rows = rows;
    this.cols = cols;
    this.cellSize = cellSize;
    this.gap = gap;
    this.marginX = marginX;
    this.marginY = marginY;
    this.rowLabels = rowLabels;
    this.colLabels = colLabels;
    this.width = marginX + cols * (cellSize + gap) + 10;
    this.height = marginY + rows * (cellSize + gap) + 10;
    this.cellEls = new Map();
  }

  _x(c){ return this.marginX + c * (this.cellSize + this.gap); }
  _y(r){ return this.marginY + r * (this.cellSize + this.gap); }

  mount(container){
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${this.width} ${this.height}`);
    svg.classList.add('viz-svg');

    const headerLayer = document.createElementNS(NS, 'g');
    this.cellLayer = document.createElementNS(NS, 'g');
    svg.appendChild(headerLayer);
    svg.appendChild(this.cellLayer);
    container.appendChild(svg);
    this.svg = svg;

    this.colLabels.forEach((label, c) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', this._x(c) + this.cellSize / 2);
      t.setAttribute('y', this.marginY - 12);
      t.setAttribute('text-anchor', 'middle');
      t.classList.add('grid-header');
      t.textContent = label;
      headerLayer.appendChild(t);
    });
    this.rowLabels.forEach((label, r) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', this.marginX - 12);
      t.setAttribute('y', this._y(r) + this.cellSize / 2);
      t.setAttribute('text-anchor', 'end');
      t.setAttribute('dy', '0.32em');
      t.classList.add('grid-header');
      t.textContent = label;
      headerLayer.appendChild(t);
    });

    for (let r = 0; r < this.rows; r++){
      for (let c = 0; c < this.cols; c++){
        const g = document.createElementNS(NS, 'g');
        g.classList.add('grid-cell-outer');
        g.style.transform = `translate(${this._x(c)}px, ${this._y(r)}px)`;

        const pop = document.createElementNS(NS, 'g');
        pop.classList.add('grid-cell-pop');
        pop.style.transform = Motion.stringify({ scaleX: 0.01, scaleY: 0.01 });

        const pulse = document.createElementNS(NS, 'g');
        pulse.classList.add('grid-cell-pulse');

        const rect = document.createElementNS(NS, 'rect');
        rect.setAttribute('width', this.cellSize);
        rect.setAttribute('height', this.cellSize);
        rect.setAttribute('rx', 6);
        rect.classList.add('grid-cell', 'grid-cell--empty');

        const text = document.createElementNS(NS, 'text');
        text.setAttribute('x', this.cellSize / 2);
        text.setAttribute('y', this.cellSize / 2);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dy', '0.32em');
        text.classList.add('grid-cell-value');

        pulse.appendChild(rect);
        pulse.appendChild(text);
        pop.appendChild(pulse);
        g.appendChild(pop);
        this.cellLayer.appendChild(g);

        this.cellEls.set(`${r}-${c}`, { g, pop, pulse, rect, text, filled: false });
      }
    }
  }

  renderStep(step, { duration, easing }){
    const cells = step.cells || [];
    const computing = step.computing;
    const deps = step.deps || [];
    const depKeys = new Set(deps.map(d => `${d.r}-${d.c}`));
    const computingKey = computing ? `${computing.r}-${computing.c}` : null;

    for (let r = 0; r < this.rows; r++){
      for (let c = 0; c < this.cols; c++){
        const key = `${r}-${c}`;
        const rec = this.cellEls.get(key);
        const value = cells[r] ? cells[r][c] : null;
        const isComputing = key === computingKey;
        const isDep = !isComputing && depKeys.has(key);

        if (value != null && !rec.filled){
          rec.text.textContent = value;
          rec.rect.classList.remove('grid-cell--empty');
          rec.filled = true;
          Motion.moveTo(rec.pop, { scaleX: 1, scaleY: 1 }, { duration, easing: EASE.spring });
        }

        rec.rect.classList.toggle('is-computing', isComputing);
        rec.rect.classList.toggle('is-dep', isDep);
        if (isComputing) Pulse.start(rec.pulse); else Pulse.stop(rec.pulse);
      }
    }
  }
}

/* ============================================================
   DEMO: Fibonacci — memoization vs. tabulation, on one 2-row grid
   (row 0 = memo cache, row 1 = tabulated array) so both end up
   visible side by side. Paired with CallStackRenderer via
   SplitRenderer for the memo act (real recursion, real frames);
   the tabulation act just never pushes more than one frame, since
   there's no recursion to show — an honest reflection of the
   algorithm, not a simplification for the renderer's sake.
   ============================================================ */
function fibDPSteps(){
  const n = 8;
  const cells = [new Array(n + 1).fill(null), new Array(n + 1).fill(null)];
  const steps = [];
  const snap = (computing, deps, frames, caption) => ({
    left: { cells: cells.map(row => row.slice()), computing, deps: deps || [], caption: '' },
    right: { frames: frames || [] },
    caption,
  });

  steps.push(snap(null, [], [], `Two ways to compute Fibonacci with dynamic programming: top-down with a memo cache, or bottom-up by filling a table. Same math, opposite direction.`));

  const callStack = [];
  function fibMemo(k){
    callStack.push(`fib(${k})`);
    steps.push(snap({ r: 0, c: k }, [], callStack.slice(), `Call fib(${k}).`));
    if (k <= 1){
      cells[0][k] = k;
      steps.push(snap({ r: 0, c: k }, [], callStack.slice(), `Base case — fib(${k}) = ${k}.`));
      callStack.pop();
      return k;
    }
    if (cells[0][k] != null){
      steps.push(snap({ r: 0, c: k }, [], callStack.slice(), `fib(${k}) is already in the memo — return ${cells[0][k]} instantly, no recursion.`));
      callStack.pop();
      return cells[0][k];
    }
    const a = fibMemo(k - 1);
    const b = fibMemo(k - 2);
    cells[0][k] = a + b;
    steps.push(snap({ r: 0, c: k }, [{ r: 0, c: k - 1 }, { r: 0, c: k - 2 }], callStack.slice(), `fib(${k}) = fib(${k - 1}) + fib(${k - 2}) = ${a} + ${b} = ${cells[0][k]}.`));
    callStack.pop();
    return cells[0][k];
  }
  fibMemo(n);

  steps.push(snap(null, [], [], `${n + 1} memo slots, but far fewer than ${n + 1} actual recursive calls — repeated subproblems (fib(6) is needed by both fib(8) and fib(7)) were served from cache instead of recomputed.`));
  steps.push(snap(null, [], [], `Now the other direction: fill the table bottom-up, smallest first — no recursion, no cache lookups, every value is guaranteed ready exactly when it's needed.`));

  cells[1][0] = 0;
  steps.push(snap({ r: 1, c: 0 }, [], [], `dp[0] = 0 (base case).`));
  cells[1][1] = 1;
  steps.push(snap({ r: 1, c: 1 }, [], [], `dp[1] = 1 (base case).`));
  for (let i = 2; i <= n; i++){
    cells[1][i] = cells[1][i - 1] + cells[1][i - 2];
    steps.push(snap({ r: 1, c: i }, [{ r: 1, c: i - 1 }, { r: 1, c: i - 2 }], [], `dp[${i}] = dp[${i - 1}] + dp[${i - 2}] = ${cells[1][i - 1]} + ${cells[1][i - 2]} = ${cells[1][i]}.`));
  }

  steps.push(snap(null, [], [], `Same answers, same O(n) work once memoized — but tabulation needed exactly n steps, no call stack, and no risk of stack overflow on a huge input.`));
  return steps;
}

/* ============================================================
   DEMO: 0/1 Knapsack — a straightforward 2D DP grid, no split
   panel needed (the two competing choices at each cell are
   explained in the caption rather than a second visualization).
   ============================================================ */
function knapsackSteps(){
  const items = [{ name: 'Item 1', w: 2, v: 3 }, { name: 'Item 2', w: 3, v: 4 }, { name: 'Item 3', w: 4, v: 5 }, { name: 'Item 4', w: 5, v: 6 }];
  const n = items.length, W = 7;
  const cells = Array.from({ length: n + 1 }, () => new Array(W + 1).fill(null));
  for (let w = 0; w <= W; w++) cells[0][w] = 0;

  const steps = [];
  const snap = (computing, deps, caption) => ({ cells: cells.map(row => row.slice()), computing, deps: deps || [], caption });

  steps.push(snap(null, [], `Row 0 means "using none of the items" — capacity doesn't matter yet, so every cell is 0.`));

  for (let i = 1; i <= n; i++){
    const { name, w: weight, v: value } = items[i - 1];
    for (let cap = 0; cap <= W; cap++){
      const skip = cells[i - 1][cap];
      const deps = [{ r: i - 1, c: cap }];
      let take = -Infinity;
      if (weight <= cap){
        take = value + cells[i - 1][cap - weight];
        deps.push({ r: i - 1, c: cap - weight });
      }
      const best = Math.max(skip, take);
      cells[i][cap] = best;
      const caption = weight > cap
        ? `Capacity ${cap} can't fit ${name} (weight ${weight}) — carry over the value from the row above: ${skip}.`
        : take > skip
          ? `Take ${name}: ${value} + dp[row above][${cap - weight}] (${cells[i - 1][cap - weight]}) = ${take}, beats skipping it (${skip}).`
          : `Skip ${name}: ${skip} is at least as good as taking it (would give ${take}).`;
      steps.push(snap({ r: i, c: cap }, deps, caption));
    }
  }

  steps.push(snap({ r: n, c: W }, [], `Best value with capacity ${W}: ${cells[n][W]}.`));
  return steps;
}

/* ============================================================
   DEMO: Longest Common Subsequence — diagonal dependency on a
   match, up/left on a mismatch. The classic DP grid shape.
   ============================================================ */
function lcsSteps(){
  const A = 'ABCD', B = 'ACBD';
  const n = A.length, m = B.length;
  const cells = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(null));
  for (let j = 0; j <= m; j++) cells[0][j] = 0;
  for (let i = 0; i <= n; i++) cells[i][0] = 0;

  const steps = [];
  const snap = (computing, deps, caption) => ({ cells: cells.map(row => row.slice()), computing, deps: deps || [], caption });

  steps.push(snap(null, [], `dp[i][j] = length of the longest common subsequence between the first i characters of "${A}" and the first j characters of "${B}". Row 0 and column 0 are empty prefixes — always 0.`));

  for (let i = 1; i <= n; i++){
    for (let j = 1; j <= m; j++){
      const match = A[i - 1] === B[j - 1];
      if (match){
        cells[i][j] = cells[i - 1][j - 1] + 1;
        steps.push(snap({ r: i, c: j }, [{ r: i - 1, c: j - 1 }], `'${A[i - 1]}' matches '${B[j - 1]}' — extend the diagonal: dp[${i - 1}][${j - 1}] + 1 = ${cells[i][j]}.`));
      } else {
        const fromUp = cells[i - 1][j], fromLeft = cells[i][j - 1];
        cells[i][j] = Math.max(fromUp, fromLeft);
        steps.push(snap({ r: i, c: j }, [{ r: i - 1, c: j }, { r: i, c: j - 1 }], `'${A[i - 1]}' ≠ '${B[j - 1]}' — take the better of the cell above (${fromUp}) and the cell to the left (${fromLeft}): ${cells[i][j]}.`));
      }
    }
  }

  steps.push(snap({ r: n, c: m }, [], `LCS length: ${cells[n][m]}. Every diagonal move in this table is a matched character — tracing the path backward from here spells out the actual subsequence.`));
  return steps;
}

/* ============================================================
   REVEAL — one-shot section-transition helper for lesson swaps.
   Distinct from Motion: Motion drives the *visualization* (FLIP,
   interrupt-safe, structure-agnostic). Reveal drives static app
   chrome appearing/disappearing once per route change — a simpler
   enter/exit, still transform+opacity only, still named easings.
   ============================================================ */
const Reveal = {
  hide(elements, { duration = 100 } = {}){
    if (Motion.reduced || !elements.length) return Promise.resolve();
    const anims = elements.map(el => el.animate(
      [{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-8px)', opacity: 0 }],
      { duration, easing: EASE.quart, fill: 'forwards' }
    ));
    return Promise.all(anims.map(a => a.finished.catch(() => {})));
  },
  // Staggered entrance: exit ~100ms + up to 4 blocks * 40ms stagger + ~160ms
  // each keeps the whole swap comfortably under 400ms end to end.
  show(elements, { duration = 160, stagger = 40 } = {}){
    if (!elements.length) return Promise.resolve();
    if (Motion.reduced){
      elements.forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });
      return Promise.resolve();
    }
    const anims = elements.map((el, i) => el.animate(
      [{ transform: 'translateY(10px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }],
      { duration, delay: i * stagger, easing: EASE.expo, fill: 'both' }
    ));
    return Promise.all(anims.map(a => a.finished.catch(() => {})));
  },
};

    n = len(arr)
    for i in range(n - 1):
        swapped = False
        for j in range(n - 1 - i):
            if arr[j] > arr[j + 1]:

        for (int j = 0; j < n - 1 - i; j++) {
            if (arr[j] > arr[j + 1]) {
                int tmp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = tmp;
                swapped = true;

const PY_AVL = `def get_height(node):
    return node.height if node else 0

def get_balance(node):
    return get_height(node.left) - get_height(node.right) if node else 0

def rotate_right(y):
    x = y.left
    t2 = x.right
    x.right = y
    y.left = t2
    y.height = 1 + max(get_height(y.left), get_height(y.right))
    x.height = 1 + max(get_height(x.left), get_height(x.right))
    return x  # new subtree root

def rotate_left(x):
    y = x.right
    t2 = y.left
    y.left = x
    x.right = t2
    x.height = 1 + max(get_height(x.left), get_height(x.right))
    y.height = 1 + max(get_height(y.left), get_height(y.right))
    return y  # new subtree root

def rebalance(node):
    balance = get_balance(node)
    if balance > 1 and get_balance(node.left) >= 0:
        return rotate_right(node)                # Left-Left
    if balance > 1:
        node.left = rotate_left(node.left)
        return rotate_right(node)                 # Left-Right
    if balance < -1 and get_balance(node.right) <= 0:
        return rotate_left(node)                   # Right-Right
    if balance < -1:
        node.right = rotate_right(node.right)
        return rotate_left(node)                    # Right-Left
    return node`;

static Node rotateRight(Node y) {
    Node x = y.left, t2 = x.right;
    x.right = y; y.left = t2;
    y.height = 1 + Math.max(height(y.left), height(y.right));
    x.height = 1 + Math.max(height(x.left), height(x.right));
    return x; // new subtree root
}

    y.height = 1 + Math.max(height(y.left), height(y.right));
    return y; // new subtree root
}

static Node rebalance(Node node) {
    int balance = balanceOf(node);
    if (balance > 1 && balanceOf(node.left) >= 0) return rotateRight(node);       // Left-Left
    if (balance > 1) { node.left = rotateLeft(node.left); return rotateRight(node); } // Left-Right
    if (balance < -1 && balanceOf(node.right) <= 0) return rotateLeft(node);      // Right-Right
    if (balance < -1) { node.right = rotateRight(node.right); return rotateLeft(node); } // Right-Left

const PY_TRIE = `class TrieNode:
    def __init__(self):
        self.children = {}
        self.is_end = False

class Trie:
    def __init__(self):
        self.root = TrieNode()

    def insert(self, word):
        node = self.root
        for ch in word:
            node = node.children.setdefault(ch, TrieNode())
        node.is_end = True

    def search(self, word):
        node = self._walk(word)
        return node is not None and node.is_end

    def starts_with(self, prefix):
        return self._walk(prefix) is not None

    def _walk(self, s):
        node = self.root
        for ch in s:
            if ch not in node.children:
                return None
            node = node.children[ch]
        return node`;

const PY_HEAPSORT = `def heapify(arr, size, i):
    largest = i
    l, r = 2 * i + 1, 2 * i + 2
    if l < size and arr[l] > arr[largest]:
        largest = l
    if r < size and arr[r] > arr[largest]:
        largest = r
    if largest != i:
        arr[i], arr[largest] = arr[largest], arr[i]
        heapify(arr, size, largest)   # the swapped child might now violate the heap below it

def heap_sort(arr):
    n = len(arr)
    for i in range(n // 2 - 1, -1, -1):
        heapify(arr, n, i)              # build the max-heap
    for end in range(n - 1, 0, -1):

        heapify(arr, end, 0)             # restore the heap on the shrunken range

def bfs(graph, start):
    visited = {start}
    queue = deque([start])
    order = []
    while queue:
        node = queue.popleft()      # dequeue from the FRONT
        order.append(node)
        for neighbor in graph[node]:
            if neighbor not in visited:
                visited.add(neighbor)
                queue.append(neighbor)  # enqueue at the BACK
    return order

    visited = {start}
    stack = [start]
    order = []
    while stack:
        node = stack.pop()           # pop from the TOP
        order.append(node)
        for neighbor in graph[node]:
            if neighbor not in visited:
                visited.add(neighbor)
                stack.append(neighbor)  # push onto the TOP
    return order`;

const PY_DIJKSTRA = `import heapq

def dijkstra(graph, start):
    dist = {node: float('inf') for node in graph}
    dist[start] = 0
    pq = [(0, start)]              # (distance, node) — heapq orders by the first element
    settled = set()

    while pq:
        d, node = heapq.heappop(pq)
        if node in settled:
            continue                 # a stale, already-improved-upon entry
        settled.add(node)
        for neighbor, weight in graph[node]:
            new_dist = d + weight
            if new_dist < dist[neighbor]:
                dist[neighbor] = new_dist
                heapq.heappush(pq, (new_dist, neighbor))
    return dist`;

const JAVA_DIJKSTRA = `record Edge(String to, int weight) {}

static Map<String, Integer> dijkstra(Map<String, List<Edge>> graph, String start) {
    Map<String, Integer> dist = new HashMap<>();
    for (String node : graph.keySet()) dist.put(node, Integer.MAX_VALUE);
    dist.put(start, 0);

    PriorityQueue<Edge> pq = new PriorityQueue<>(Comparator.comparingInt(Edge::weight));
    pq.add(new Edge(start, 0));
    Set<String> settled = new HashSet<>();

    while (!pq.isEmpty()) {
        Edge top = pq.poll();
        if (!settled.add(top.to())) continue; // stale entry
        for (Edge e : graph.get(top.to())) {
            int newDist = dist.get(top.to()) + e.weight();
            if (newDist < dist.get(e.to())) {
                dist.put(e.to(), newDist);
                pq.add(new Edge(e.to(), newDist));
            }
        }
    }
    return dist;
}`;

const CPP_DIJKSTRA = `unordered_map<string,int> dijkstra(unordered_map<string, vector<pair<string,int>>>& graph, string start) {
    unordered_map<string,int> dist;
    for (auto& [node, _] : graph) dist[node] = INT_MAX;
    dist[start] = 0;
    priority_queue<pair<int,string>, vector<pair<int,string>>, greater<>> pq;
    pq.push({0, start});
    unordered_set<string> settled;

    while (!pq.empty()) {
        auto [d, node] = pq.top(); pq.pop();
        if (settled.count(node)) continue;    // stale entry
        settled.insert(node);
        for (auto& [neighbor, weight] : graph[node]) {
            if (d + weight < dist[neighbor]) {
                dist[neighbor] = d + weight;
                pq.push({dist[neighbor], neighbor});
            }
        }
    }
    return dist;
}`;

const PY_TOPOSORT = `from collections import deque

def topological_sort(graph, in_degree):
    queue = deque(node for node in graph if in_degree[node] == 0)
    order = []
    while queue:
        node = queue.popleft()
        order.append(node)
        for neighbor in graph[node]:
            in_degree[neighbor] -= 1
            if in_degree[neighbor] == 0:
                queue.append(neighbor)
    if len(order) != len(graph):
        raise ValueError("graph has a cycle — no valid order exists")
    return order`;

const JAVA_TOPOSORT = `static List<String> topologicalSort(Map<String, List<String>> graph, Map<String, Integer> inDegree) {
    Deque<String> queue = new ArrayDeque<>();
    for (String node : graph.keySet()) if (inDegree.get(node) == 0) queue.add(node);

    List<String> order = new ArrayList<>();
    while (!queue.isEmpty()) {
        String node = queue.poll();
        order.add(node);
        for (String nb : graph.get(node)) {
            inDegree.put(nb, inDegree.get(nb) - 1);
            if (inDegree.get(nb) == 0) queue.add(nb);
        }
    }
    if (order.size() != graph.size()) throw new IllegalStateException("graph has a cycle");
    return order;
}`;

        }
    }

}`;

    if n <= 1:

    if n in memo:
        return memo[n]                       # already solved — no recursion
    memo[n] = fib_memo(n - 1, memo) + fib_memo(n - 2, memo)
    return memo[n]

def fib_tab(n):
    if n <= 1:
        return n
    dp = [0, 1]
    for i in range(2, n + 1):
        dp.append(dp[i - 1] + dp[i - 2])      # each value built from the last two
    return dp[n]`;

const JAVA_FIBDP = `static Map<Integer, Long> memo = new HashMap<>();

static long fibMemo(int n) {
    if (n <= 1) return n;
    if (memo.containsKey(n)) return memo.get(n); // already solved — no recursion
    long result = fibMemo(n - 1) + fibMemo(n - 2);
    memo.put(n, result);
    return result;
}

static long fibTab(int n) {
    if (n <= 1) return n;
    long[] dp = new long[n + 1];
    dp[0] = 0; dp[1] = 1;
    for (int i = 2; i <= n; i++) {
        dp[i] = dp[i - 1] + dp[i - 2];                // each value built from the last two
    }
    return dp[n];
}`;

const CPP_FIBDP = `unordered_map<int, long long> memo;

long long fibMemo(int n) {
    if (n <= 1) return n;
    if (memo.count(n)) return memo[n];         // already solved — no recursion
    return memo[n] = fibMemo(n - 1) + fibMemo(n - 2);
}

long long fibTab(int n) {
    if (n <= 1) return n;
    vector<long long> dp(n + 1);
    dp[0] = 0; dp[1] = 1;
    for (int i = 2; i <= n; i++) {
        dp[i] = dp[i - 1] + dp[i - 2];          // each value built from the last two
    }
    return dp[n];
}`;

  blurb: 'Plain recursive Fibonacci recomputes the same subproblems over and over — exponentially many times. Dynamic programming fixes that two ways: cache each answer the first time it’s computed (memoization), or just build the table from the bottom up so nothing ever needs recomputing (tabulation).',
  complexity: { best: 'O(n)', avg: 'O(n)', worst: 'O(n)', space: 'O(n)' },
  notes: {
    use: 'Use memoization when the recursive structure is natural and you don’t necessarily need every subproblem solved — it only computes what’s actually reached. Use tabulation when you need everything anyway, want to avoid recursion’s call-stack overhead, or want to shrink space further (Fibonacci’s tabulation only ever needs the last two values, so it can run in O(1) space).',

const PY_KNAPSACK = `def knapsack(items, capacity):
    n = len(items)
    dp = [[0] * (capacity + 1) for _ in range(n + 1)]
    for i in range(1, n + 1):
        weight, value = items[i - 1]
        for cap in range(capacity + 1):
            dp[i][cap] = dp[i - 1][cap]                # skip item i
            if weight <= cap:
                dp[i][cap] = max(dp[i][cap], value + dp[i - 1][cap - weight])  # take item i
    return dp[n][capacity]`;

const JAVA_KNAPSACK = `static int knapsack(int[][] items, int capacity) {
    int n = items.length;
    int[][] dp = new int[n + 1][capacity + 1];
    for (int i = 1; i <= n; i++) {
        int weight = items[i - 1][0], value = items[i - 1][1];
        for (int cap = 0; cap <= capacity; cap++) {
            dp[i][cap] = dp[i - 1][cap];                 // skip item i
            if (weight <= cap) {
                dp[i][cap] = Math.max(dp[i][cap], value + dp[i - 1][cap - weight]); // take item i
            }
        }
    }
    return dp[n][capacity];
}`;

const CPP_KNAPSACK = `int knapsack(vector<pair<int,int>>& items, int capacity) {
    int n = items.size();
    vector<vector<int>> dp(n + 1, vector<int>(capacity + 1, 0));
    for (int i = 1; i <= n; i++) {
        auto [weight, value] = items[i - 1];
        for (int cap = 0; cap <= capacity; cap++) {
            dp[i][cap] = dp[i - 1][cap];                 // skip item i
            if (weight <= cap) {
                dp[i][cap] = max(dp[i][cap], value + dp[i - 1][cap - weight]); // take item i
            }
        }
    }
    return dp[n][capacity];
}`;

/* ============================================================
   SYNTAX HIGHLIGHTER — tiny regex tokenizer, no dependencies.
   Named capture groups keep the classification readable; each
   language gets its own comment/preprocessor pattern since a
   Python "#comment" and a C++ "#include" both start with '#'.
   ============================================================ */
const KEYWORDS = {
  python: new Set(['def','return','if','elif','else','for','while','in','not','and','or','class','import','from','as','pass','break','continue','None','True','False','lambda','yield','with','try','except','finally','raise','is','global','nonlocal','del','assert','self']),
  java: new Set(['public','private','protected','class','static','void','int','double','float','boolean','char','long','short','byte','new','return','if','else','for','while','do','switch','case','break','continue','import','package','extends','implements','interface','this','super','null','true','false','try','catch','finally','throw','throws','final','abstract']),
  cpp: new Set(['int','double','float','bool','char','long','short','void','class','struct','public','private','protected','static','const','return','if','else','for','while','do','switch','case','break','continue','new','delete','nullptr','true','false','namespace','using','template','typename','auto','virtual','override']),
};

function escapeHtml(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function tokenPattern(lang){
  if (lang === 'python'){
    return /(?<comment>#.*$)|(?<string>"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(?<number>\b\d+\.?\d*\b)|(?<word>[A-Za-z_]\w*)|(?<ws>\s+)|(?<punct>[^\sA-Za-z_\d])/gm;
  }
  if (lang === 'cpp'){
    return /(?<comment>\/\/.*$|\/\*[\s\S]*?\*\/)|(?<preproc>^\s*#\s*\w+.*$)|(?<string>"(?:\\.|[^"\\])*")|(?<number>\b\d+\.?\d*[fFuUlL]*\b)|(?<word>[A-Za-z_]\w*)|(?<ws>\s+)|(?<punct>[^\sA-Za-z_\d])/gm;
  }
  return /(?<comment>\/\/.*$|\/\*[\s\S]*?\*\/)|(?<string>"(?:\\.|[^"\\])*")|(?<number>\b\d+\.?\d*[fFdDlL]*\b)|(?<word>[A-Za-z_]\w*)|(?<ws>\s+)|(?<punct>[^\sA-Za-z_\d])/gm;
}

function highlight(src, lang){
  const kw = KEYWORDS[lang] || new Set();
  const re = tokenPattern(lang);
  let out = '', m;
  while ((m = re.exec(src))){
    const g = m.groups;
    if (g.comment) out += `<span class="tok-comment">${escapeHtml(g.comment)}</span>`;
    else if (g.preproc) out += `<span class="tok-preproc">${escapeHtml(g.preproc)}</span>`;
    else if (g.string) out += `<span class="tok-string">${escapeHtml(g.string)}</span>`;
    else if (g.number) out += `<span class="tok-number">${g.number}</span>`;
    else if (g.word) out += kw.has(g.word) ? `<span class="tok-keyword">${g.word}</span>` : g.word;
    else out += escapeHtml(m[0]);
    if (m.index === re.lastIndex) re.lastIndex++; // guard against zero-length matches
  }
  return out;
}

const PROGRESS_KEY = 'dsa-atlas:completed';

function getCompleted(){
  try { return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY)) || []); }
  catch (e) { return new Set(); }
}
function isComplete(id){ return getCompleted().has(id); }
function toggleComplete(id){
  const set = getCompleted();
  if (set.has(id)) set.delete(id); else set.add(id);
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(Array.from(set)));
}

  const total = Object.keys(LESSONS).length;

  const fill = document.getElementById('progress-ring-fill');
  fill.style.strokeDasharray = String(RING_CIRC);
  fill.style.strokeDashoffset = String(RING_CIRC * (1 - frac));
  document.getElementById('progress-ring-label').textContent = `${done} / ${total}`;
}

function wireTransport(engine, root){
  const btnPlay = root.querySelector('.js-play');
  const btnBack = root.querySelector('.js-back');
  const btnFwd = root.querySelector('.js-fwd');
  const scrub = root.querySelector('.js-scrub');
  const speedSel = root.querySelector('.js-speed');
  const counter = root.querySelector('.js-counter');
  // aria-live region is a sibling of the transport's parent (.content__canvas)
  const srCaption = root.closest('.content__canvas')
    ? root.closest('.content__canvas').querySelector('.viz-caption-sr')
    : null;

  scrub.max = String(engine.length - 1);
  scrub.value = '0';
  counter.textContent = `1 / ${engine.length}`;

  btnPlay.addEventListener('click', () => { if (engine.playing) engine.pause(); else engine.play(); });
  btnBack.addEventListener('click', () => { engine.pause(); engine.stepBack(); });
  btnFwd.addEventListener('click', () => { engine.pause(); engine.stepForward(); });

  scrub.addEventListener('pointerdown', () => engine.pause());
  scrub.addEventListener('input', (e) => engine.seek(Number(e.target.value)));

  speedSel.addEventListener('change', (e) => engine.setSpeed(Number(e.target.value)));

  engine.on('play', () => { btnPlay.innerHTML = '&#10074;&#10074;'; btnPlay.setAttribute('aria-label', 'Pause (space)'); });
  engine.on('pause', () => { btnPlay.innerHTML = '&#9654;'; btnPlay.setAttribute('aria-label', 'Play (space)'); });
  engine.on('change', ({ index, step }) => {
    scrub.value = String(index);
    counter.textContent = `${index + 1} / ${engine.length}`;
    if (srCaption && step && step.caption) srCaption.textContent = step.caption;
  });
}

    vizMount.innerHTML = '';
    // Replace the transport node to wipe accumulated event listeners from prior rebuilds.
    const fresh = liveTransportEl.cloneNode(true);
    liveTransportEl.replaceWith(fresh);
    liveTransportEl = fresh;
    const engine = lesson.controls.buildEngine(vizMount, captionEl, items);
    currentEngine = engine;
    wireTransport(engine, liveTransportEl);
    return engine;
  }

  field.value = defaultItems.map(x => x.value).join(', ');

  field.addEventListener('change', () => {
    const vals = currentValues();
    if (vals.length < 2){ field.classList.add('is-invalid'); return; }
    field.classList.remove('is-invalid');
    rebuildFrom(vals.map((v, i) => ({ id: 'u' + i, value: v })));
  });

  btnRand.addEventListener('click', () => {
    const items = generateValues(count);
    field.value = items.map(x => x.value).join(', ');
    field.classList.remove('is-invalid');
    rebuildFrom(items);
  });

  btnReset.addEventListener('click', () => {
    field.value = defaultItems.map(x => x.value).join(', ');
    field.classList.remove('is-invalid');
    rebuildFrom(defaultItems);
  });

  if (btnRace && lesson.controls.race){
    btnRace.addEventListener('click', () => {
      const vals = currentValues();
      if (vals.length < 2) return;
      RaceMode.open(vals);
    });
  }
}

async function transitionToLesson(lesson){
  activeLesson = lesson;
  updateActiveNav(lesson.id);

  document.getElementById('lesson-part-label').textContent = `Part ${partNumber(lesson.part)} · ${lesson.part.title}`;
  document.getElementById('lesson-title').textContent = lesson.title;
  document.getElementById('lesson-blurb').textContent = lesson.blurb || '';

  const completeBtn = document.getElementById('mark-complete');
  completeBtn.style.display = lesson.build ? '' : 'none';
  updateCompleteButton(lesson.id);

  const contentEl = document.getElementById('lesson-content');
  const outgoing = Array.from(contentEl.children);
  if (outgoing.length) await Reveal.hide(outgoing);

  if (currentEngine){ currentEngine.pause(); currentEngine = null; }

  if (lesson.build){
    contentEl.innerHTML = buildRealLessonMarkup(lesson);
    const vizMount = contentEl.querySelector('.viz-mount');
    const captionEl = contentEl.querySelector('.caption');
    const transportEl = contentEl.querySelector('.transport');
    const canvasEl = contentEl.querySelector('.content__canvas');

    currentEngine = lesson.build(vizMount, captionEl);
    wireTransport(currentEngine, transportEl);
    wireControls(lesson, canvasEl, captionEl, transportEl);

    if (lesson.complexity){
      contentEl.querySelector('.js-best').textContent = lesson.complexity.best;
      contentEl.querySelector('.js-avg').textContent = lesson.complexity.avg;
      contentEl.querySelector('.js-worst').textContent = lesson.complexity.worst;
      contentEl.querySelector('.js-space').textContent = lesson.complexity.space;
    }

    setCodeLang(lesson, currentLang);
    contentEl.querySelectorAll('.code-tab').forEach(btn => {
      btn.addEventListener('click', () => setCodeLang(lesson, btn.dataset.lang));
    });
  } else {
    contentEl.innerHTML = buildStubMarkup(lesson);
  }

  await Reveal.show(Array.from(contentEl.children));
}

function renderRoute(){
  const raw = location.hash.replace(/^#\/?/, '');
  const segs = raw.split('/');
  const lessonId = segs[1] || segs[0];
  const lesson = LESSONS[lessonId];
  if (!lesson){
    if (location.hash !== '#/' + DEFAULT_ROUTE) location.hash = '#/' + DEFAULT_ROUTE;
    return;
  }
  if (lesson.id === currentRouteKey) return;
  currentRouteKey = lesson.id;
  transitionToLesson(lesson);
}

/* ============================================================
   COMMAND PALETTE (Cmd/Ctrl+K)
   ============================================================ */
const PALETTE_INDEX = Object.values(LESSONS).map(l => ({
  id: l.id, title: l.title, partTitle: l.part.title, href: `#/${l.part.id}/${l.id}`,
}));
let paletteFiltered = PALETTE_INDEX;
let paletteSelected = 0;

function openPalette(){
  document.getElementById('palette').classList.add('is-open');
  const input = document.getElementById('palette-input');
  input.value = '';
  filterPalette('');
  requestAnimationFrame(() => input.focus());
}
function closePalette(){
  document.getElementById('palette').classList.remove('is-open');
}
function filterPalette(q){
  const query = q.trim().toLowerCase();
  paletteFiltered = !query
    ? PALETTE_INDEX
    : PALETTE_INDEX.filter(item => item.title.toLowerCase().includes(query) || item.partTitle.toLowerCase().includes(query));
  paletteSelected = 0;
  renderPaletteResults();
}
function renderPaletteResults(){
  const resultsEl = document.getElementById('palette-results');
  resultsEl.innerHTML = '';
  if (!paletteFiltered.length){
    resultsEl.innerHTML = '<li class="palette__empty">No matching lessons.</li>';
    return;
  }
  paletteFiltered.forEach((item, i) => {
    const li = document.createElement('li');
    li.className = 'palette__item' + (i === paletteSelected ? ' is-selected' : '');
    li.innerHTML = `<span class="palette__item-part">${escapeHtml(item.partTitle)}</span><span>${escapeHtml(item.title)}</span>`;
    li.addEventListener('click', () => { location.hash = item.href; closePalette(); });
    resultsEl.appendChild(li);
  });
}

/* ---- Theme toggle ------------------------------------------ */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
  localStorage.setItem('dsa-atlas-theme', theme);
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;
  const isLight = theme === 'light';
  btn.setAttribute('aria-label', isLight ? 'Switch to dark theme' : 'Switch to light theme');
  btn.title = isLight ? 'Dark theme' : 'Light theme';
  btn.querySelector('.theme-icon-sun').style.display = isLight ? 'none' : '';
  btn.querySelector('.theme-icon-rays').style.display = isLight ? 'none' : '';
  btn.querySelector('.theme-icon-moon').style.display = isLight ? '' : 'none';
  // Swap color-scheme meta
  const meta = document.querySelector('meta[name="color-scheme"]');
  if (meta) meta.setAttribute('content', theme);
}

/* ---- Sound toggle ------------------------------------------ */
function applySoundState(on){
  TickSound.enabled = on;
  localStorage.setItem('dsa-atlas-sound', on ? '1' : '0');
  const btn = document.getElementById('sound-toggle');
  if (!btn) return;
  btn.classList.toggle('is-on', on);
  btn.setAttribute('aria-pressed', String(on));
  btn.setAttribute('aria-label', on ? 'Disable step sounds' : 'Enable step sounds');
  btn.title = on ? 'Step sounds (on)' : 'Step sounds (off)';
  btn.querySelector('.sound-icon-off').style.display = on ? 'none' : '';
  btn.querySelector('.sound-icon-on').style.display  = on ? '' : 'none';
}

/* ---- Lesson list for J/K navigation ----------------------- */
function allLessonIds(){
  return PARTS.flatMap(p => p.lessons);
}

function navigateLesson(delta){
  if (!activeLesson) return;
  const ids = allLessonIds();
  const i = ids.indexOf(activeLesson.id);
  if (i === -1) return;
  const next = ids[i + delta];
  if (next) location.hash = '#/' + LESSONS[next].part.id + '/' + next;
}

/* ---- bootstrap ---- */
document.addEventListener('DOMContentLoaded', () => {
  InspectTooltip.init();
  RaceMode.init();

  // Restore preferences
  const savedTheme = localStorage.getItem('dsa-atlas-theme') || 'dark';
  applyTheme(savedTheme);
  const savedSound = localStorage.getItem('dsa-atlas-sound') === '1';
  applySoundState(savedSound);

  const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || '');
  document.getElementById('open-palette').textContent = isMac ? '⌘K' : 'Ctrl+K';

  renderNav();
  updateProgressRing();

  document.getElementById('hamburger').addEventListener('click', openDrawer);
  document.getElementById('scrim').addEventListener('click', closeDrawer);

  document.getElementById('mark-complete').addEventListener('click', () => {
    if (!activeLesson) return;
    toggleComplete(activeLesson.id);
    updateCompleteButton(activeLesson.id);
    updateNavCompleteMarks();
    updateProgressRing();
  });

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(current === 'light' ? 'dark' : 'light');
  });

  document.getElementById('sound-toggle').addEventListener('click', () => {
    applySoundState(!TickSound.enabled);
    // First enable click always resumes AudioContext (browser policy)
    if (TickSound.enabled) TickSound.tick('step');
  });

  document.getElementById('open-palette').addEventListener('click', openPalette);
  document.getElementById('palette-backdrop').addEventListener('click', closePalette);
  document.getElementById('palette-input').addEventListener('input', (e) => filterPalette(e.target.value));
  document.getElementById('palette-input').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); paletteSelected = Math.min(paletteSelected + 1, paletteFiltered.length - 1); renderPaletteResults(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); paletteSelected = Math.max(paletteSelected - 1, 0); renderPaletteResults(); }
    else if (e.key === 'Enter'){ const item = paletteFiltered[paletteSelected]; if (item){ location.hash = item.href; closePalette(); } }
    else if (e.key === 'Escape'){ closePalette(); }
  });

  window.addEventListener('keydown', (e) => {
    // Skip if focus is on an interactive element (input, textarea, select)
    const tag = document.activeElement && document.activeElement.tagName;
    const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      openPalette();
      return;
    }

    if (e.key === 'Escape'){
      if (document.getElementById('race-overlay').classList.contains('is-open')){ RaceMode.close(); return; }
      if (document.getElementById('palette').classList.contains('is-open')){ closePalette(); return; }
      closeDrawer();
      return;
    }

    // Palette absorbs all keys while open
    if (document.getElementById('palette').classList.contains('is-open')) return;
    // Race overlay absorbs all keys while open (its own transport handles them)
    if (document.getElementById('race-overlay').classList.contains('is-open')) return;

    if (inInput) return;

    if (e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      if (currentEngine){ if (currentEngine.playing) currentEngine.pause(); else currentEngine.play(); }
      return;
    }
    if (e.key === 'ArrowRight'){
      e.preventDefault();
      if (currentEngine){ currentEngine.pause(); currentEngine.stepForward(); }
      return;
    }
    if (e.key === 'ArrowLeft'){
      e.preventDefault();
      if (currentEngine){ currentEngine.pause(); currentEngine.stepBack(); }
      return;
    }
    if (e.key === 'j' || e.key === 'J'){ navigateLesson(1); return; }
    if (e.key === 'k' || e.key === 'K'){ navigateLesson(-1); return; }
  });

  if (!location.hash) location.hash = '#/' + DEFAULT_ROUTE;
  renderRoute();
  window.addEventListener('hashchange', renderRoute);
});
</script>
