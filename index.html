    if (!node) return;
    secondPass(node.left);
    secondPass(node.right);
    const s = slot.get(node.id);
    if (node.left && node.right) s.x = (slot.get(node.left.id).x + slot.get(node.right.id).x) / 2;
    else if (node.left) s.x = slot.get(node.left.id).x;
    else if (node.right) s.x = slot.get(node.right.id).x;
  })(root);

  const positions = new Map();
  slot.forEach((s, id) => positions.set(id, { x: marginX + s.x * hGap, y: marginY + s.y * vGap }));
  return positions;
}

function snapshotTree(root, extra){
  const positions = computeTidyLayout(root);
  const nodes = [];
  const parents = new Map();

  (function walk(node, parentId){
    if (!node) return;
    const pos = positions.get(node.id);
    nodes.push({ id: node.id, value: node.value, x: pos.x, y: pos.y });
    parents.set(node.id, parentId);
    walk(node.left, node.id);
    walk(node.right, node.id);
  })(root, null);

  return Object.assign({
    nodes, parents, comparing: null, path: [], newNode: null, caption: '',
  }, extra);
}

function insertWithSteps(root, value, steps){
  if (!root){
    const node = makeTreeNode(value);
    steps.push(snapshotTree(node, {
      newNode: node.id, comparing: node.id, path: [node.id],
      caption: `Insert ${value} — empty tree, ${value} becomes the root.`,
    }));
    return node;
  }

  let cur = root;
  const path = [];
  while (true){
    path.push(cur.id);
    steps.push(snapshotTree(root, { comparing: cur.id, path: path.slice(), caption: `Compare ${value} to ${cur.value}.` }));

    if (value < cur.value){
      if (!cur.left){
        cur.left = makeTreeNode(value);
        path.push(cur.left.id);
        steps.push(snapshotTree(root, {
          newNode: cur.left.id, comparing: cur.left.id, path: path.slice(),
          caption: `${value} < ${cur.value} — insert as left child.`,
        }));
        return root;
      }
      cur = cur.left;
    } else {
      if (!cur.right){
        cur.right = makeTreeNode(value);
        path.push(cur.right.id);
        steps.push(snapshotTree(root, {
          newNode: cur.right.id, comparing: cur.right.id, path: path.slice(),
          caption: `${value} ≥ ${cur.value} — insert as right child.`,
        }));
        return root;
      }
      cur = cur.right;
    }
  }
}

// y is left-heavy; x = y.left rises to take y's place, y drops to
// become x's right child, and x's old right subtree (T2) is handed
// to y as its new left child. Every node whose position changes as
// a result keeps its DOM identity — the renderer just re-lays-out
// and FLIPs them, which is the whole point of this demo.
function rotateRight(root, y, steps){
  const x = y.left;
  const T2 = x.right;
  const parent = findParentOf(root, y.id);

  x.right = y;
  y.left = T2;

  let newRoot = root;
  if (!parent) newRoot = x;
  else if (parent.left === y) parent.left = x;
  else parent.right = x;

  steps.push(snapshotTree(newRoot, {
    comparing: x.id,
    path: [y.id, x.id],
    caption: `${y.value} is left-heavy — right-rotate: ${x.value} rises, ${y.value} becomes its right child.`,
  }));
  return newRoot;
}

// Mirror image of rotateRight: x is right-heavy, its right child y rises to
// take x's place, x drops to become y's left child, and y's old left
// subtree (T2) is handed to x as its new right child.
function rotateLeft(root, x, steps){
  const y = x.right;
  const T2 = y.left;
  const parent = findParentOf(root, x.id);

  y.left = x;
  x.right = T2;

  let newRoot = root;
  if (!parent) newRoot = y;
  else if (parent.left === x) parent.left = y;
  else parent.right = y;

  steps.push(snapshotTree(newRoot, {
    comparing: y.id,
    path: [x.id, y.id],
    caption: `${x.value} is right-heavy — left-rotate: ${y.value} rises, ${x.value} becomes its left child.`,
  }));
  return newRoot;
}

function buildTreeDemoSteps(){
  const values = [50, 30, 70, 20, 40, 10, 5, 60];
  const steps = [];
  let root = null;

  steps.push(snapshotTree(null, { caption: 'Empty tree. Watch the shape recalculate after every insert.' }));
  values.forEach(v => { root = insertWithSteps(root, v, steps); });

  const unbalanced = findByValue(root, 20); // left-left heavy: 20 -> 10 -> 5
  root = rotateRight(root, unbalanced, steps);
  steps.push(snapshotTree(root, { caption: 'Rotation complete — the subtree is balanced.' }));

  searchDemoSteps(root, 60, steps);
  searchDemoSteps(root, 45, steps);

  return steps;
}

// Instrumented search — same comparison logic as insertWithSteps, but reused
// afterward on the final (rotated) tree, including the "not found" case: an
// unsuccessful search always ends at a missing child, not at some node.
function searchDemoSteps(root, target, steps){
  let cur = root;
  const path = [];
  while (cur){
    path.push(cur.id);
    if (target === cur.value){
      steps.push(snapshotTree(root, { comparing: cur.id, path: path.slice(), sorted: [], caption: `Search ${target}: found it at this node.` }));
      return;
    }
    steps.push(snapshotTree(root, { comparing: cur.id, path: path.slice(), caption: `Search ${target}: ${target} ${target < cur.value ? '<' : '≥'} ${cur.value} — go ${target < cur.value ? 'left' : 'right'}.` }));
    cur = target < cur.value ? cur.left : cur.right;
  }
  steps.push(snapshotTree(root, { path: path.slice(), caption: `Search ${target}: ran out of tree — ${target} isn't here. An unsuccessful search always ends at a missing child, not a dead end in the middle.` }));
}

/* ============================================================
   RENDERER: linked list (extends the tree renderer)
   A linked list's forward links are literally the tree renderer's
   parent-edges — a singly linked list IS a degenerate tree (one
   child each), so the inherited node/edge FLIP logic needs zero
   changes. This adds three things on top: arrowheads (direction
   matters here in a way it didn't for tree edges), a second
   independent edge set for "prev" links (doubly linked), and
   floating pointer tags (head/slow/fast) that glide between nodes.
   ============================================================ */
class LinkedListRenderer extends TreeGraphRenderer{
  mount(container){
    super.mount(container);
    const NS = 'http://www.w3.org/2000/svg';

    this.backEdgeLayer = document.createElementNS(NS, 'g');
    this.svg.insertBefore(this.backEdgeLayer, this.nodeLayer);
    this.backEdgeEls = new Map();

    this.arrowLayer = document.createElementNS(NS, 'g');
    this.svg.insertBefore(this.arrowLayer, this.nodeLayer);
    this.fwdArrowEls = new Map();
    this.backArrowEls = new Map();

    this.pointerLayer = document.createElementNS(NS, 'g');
    this.svg.appendChild(this.pointerLayer);
    this.pointerEls = new Map();
  }

  _makeEdge(id){
    const rec = super._makeEdge(id);
    rec.line.classList.add('tedge--arrow-fwd');
    return rec;
  }

  // A separate, independently-transformed triangle per arrowhead — NOT an
  // SVG marker. Markers inherit their referencing element's full CSS
  // transform, including the edge line's non-uniform scaleX (used to
  // stretch it to length) — which stretches the arrowhead into a long
  // smear instead of a small fixed-size triangle. Positioning our own
  // element with translate+rotate only (never scaled) sidesteps that
  // entirely, consistent with the engine's transform+opacity vocabulary.
  _makeArrowhead(layer){
    const NS = 'http://www.w3.org/2000/svg';
    const tri = document.createElementNS(NS, 'path');
    tri.setAttribute('d', 'M-9,-4.5 L0,0 L-9,4.5 Z'); // tip at local origin, pointing +x
    tri.classList.add('ll-arrowhead');
    tri.style.opacity = 0;
    layer.appendChild(tri);
    return tri;
  }

  _arrowTip(fromPos, toPos){
    const t = this._edgeTransform(fromPos, toPos);
    const rad = t.angle * Math.PI / 180;
    return { x: t.x + t.scaleX * Math.cos(rad), y: t.y + t.scaleX * Math.sin(rad), angle: t.angle };
  }

  renderStep(step, opts){
    super.renderStep(step, opts);
    this._renderBackEdges(step, opts);
    this._renderForwardArrows(step, opts);
    this._renderPointers(step.pointers || [], step.nodes || [], opts);
  }

  _renderForwardArrows(step, { duration, easing }){
    const nodes = step.nodes || [];
    const posById = new Map(nodes.map(n => [n.id, n]));
    const parents = step.parents || new Map();

    const activeIds = new Set();
    parents.forEach((parentId, id) => { if (parentId && posById.has(parentId) && posById.has(id)) activeIds.add(id); });

    this.fwdArrowEls.forEach((tri, id) => {
      if (activeIds.has(id)) return;
      Motion.fadeTo(tri, 0, { duration, easing });
      this.fwdArrowEls.delete(id);
      setTimeout(() => tri.remove(), duration + 30);
    });

    activeIds.forEach(id => {
      const parentId = parents.get(id);
      const tip = this._arrowTip(posById.get(parentId), posById.get(id));
      const isNew = !this.fwdArrowEls.has(id);
      const tri = isNew ? this._makeArrowhead(this.arrowLayer) : this.fwdArrowEls.get(id);
      if (isNew){
        tri.style.fill = 'var(--cyan)';
        tri.style.transform = Motion.stringify(tip);
        this.fwdArrowEls.set(id, tri);
      }
      Motion.moveTo(tri, tip, { duration, easing });
      Motion.fadeTo(tri, 1, { duration, easing });
    });
  }

  _makeBackEdge(id){
    const NS = 'http://www.w3.org/2000/svg';
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', 0); line.setAttribute('y1', 0);
    line.setAttribute('x2', 1); line.setAttribute('y2', 0);
    line.classList.add('tedge', 'tedge--back');
    line.style.opacity = 0;
    this.backEdgeLayer.appendChild(line);
    const rec = { line };
    this.backEdgeEls.set(id, rec);
    return rec;
  }

  _renderBackEdges(step, { duration, easing }){
    const nodes = step.nodes || [];
    const posById = new Map(nodes.map(n => [n.id, n]));
    const prevOf = step.prevOf || new Map();
    const presentIds = new Set(prevOf.keys());

    this.backEdgeEls.forEach((rec, id) => {
      if (presentIds.has(id)) return;
      Motion.fadeTo(rec.line, 0, { duration, easing });
      this.backEdgeEls.delete(id);
      setTimeout(() => rec.line.remove(), duration + 30);
    });
    this.backArrowEls.forEach((tri, id) => {
      if (presentIds.has(id)) return;
      Motion.fadeTo(tri, 0, { duration, easing });
      this.backArrowEls.delete(id);
      setTimeout(() => tri.remove(), duration + 30);
    });

    prevOf.forEach((prevId, id) => {
      const childPos = posById.get(id), prevPos = posById.get(prevId);
      if (!childPos || !prevPos) return;
      // small vertical offset so the back-edge doesn't sit exactly on the forward edge
      const from = { x: childPos.x, y: childPos.y + 9 };
      const to = { x: prevPos.x, y: prevPos.y + 9 };

      const isNewEdge = !this.backEdgeEls.has(id);
      const edge = isNewEdge ? this._makeBackEdge(id) : this.backEdgeEls.get(id);
      const target = this._edgeTransform(from, to);
      if (isNewEdge) edge.line.style.transform = Motion.stringify({ ...target, scaleX: 0.001 });
      Motion.moveTo(edge.line, target, { duration, easing });
      Motion.fadeTo(edge.line, 1, { duration, easing });

      const isNewArrow = !this.backArrowEls.has(id);
      const tri = isNewArrow ? this._makeArrowhead(this.arrowLayer) : this.backArrowEls.get(id);
      const tip = this._arrowTip(from, to);
      if (isNewArrow){
        tri.style.fill = 'var(--amber)';
        tri.style.transform = Motion.stringify(tip);
        this.backArrowEls.set(id, tri);
      }
      Motion.moveTo(tri, tip, { duration, easing });
      Motion.fadeTo(tri, 1, { duration, easing });
    });
  }

  _renderPointers(pointers, nodes, { duration, easing }){
    const posById = new Map(nodes.map(n => [n.id, n]));
    const present = new Set(pointers.map(p => p.id));

    this.pointerEls.forEach((rec, id) => {
      if (present.has(id)) return;
      Motion.fadeTo(rec.g, 0, { duration, easing });
      this.pointerEls.delete(id);
      setTimeout(() => rec.g.remove(), duration + 30);
    });

    const byNode = new Map();
    pointers.forEach(p => {
      if (!byNode.has(p.atNodeId)) byNode.set(p.atNodeId, []);
      byNode.get(p.atNodeId).push(p);
    });

    pointers.forEach(p => {
      const pos = posById.get(p.atNodeId);
      if (!pos) return;
      const stack = byNode.get(p.atNodeId);
      const targetX = pos.x;
      const targetY = pos.y - this.nodeRadius - 20 - stack.indexOf(p) * 22;
      const isNewPointer = !this.pointerEls.has(p.id);

      if (isNewPointer){
        const NS = 'http://www.w3.org/2000/svg';
        const g = document.createElementNS(NS, 'g');
        g.classList.add('ptr-tag');
        g.style.opacity = 0;

        const w = 12 + p.label.length * 7;
        const rect = document.createElementNS(NS, 'rect');
        rect.classList.add('ptr-tag__bg');
        rect.setAttribute('x', -w / 2);
        rect.setAttribute('width', w);
        rect.setAttribute('height', 18);
        rect.setAttribute('rx', 3);
        if (p.color) rect.style.stroke = p.color;

        const text = document.createElementNS(NS, 'text');
        text.classList.add('ptr-tag__label');
        text.setAttribute('y', 13);
        text.textContent = p.label;

        g.appendChild(rect);
        g.appendChild(text);
        this.pointerLayer.appendChild(g);
        g.style.transform = Motion.stringify({ x: targetX, y: targetY });
        this.pointerEls.set(p.id, { g, rect, text });
      }

      const rec = this.pointerEls.get(p.id);
      Motion.moveTo(rec.g, { x: targetX, y: targetY }, { duration, easing });
      Motion.fadeTo(rec.g, 1, { duration, easing });
    });
  }
}

/* ============================================================
   RENDERER: hash table (extends the tree renderer)
   Each bucket is a static backdrop cell drawn once at mount — not
   a tree node, just a labeled position. A key hashed into an empty
   bucket has no parent (the inherited "no parent -> no edge" path
   already handles that, so it just sits at the bucket's position).
   A key that collides gets its PREVIOUS chain entry as its parent,
   so the inherited edge logic draws the chain link automatically.
   ============================================================ */
class HashTableRenderer extends TreeGraphRenderer{
  constructor({ bucketCount, hGap = 92, marginX = 56, marginY = 74, vGap = 58, ...rest }){
    super({ width: Math.max(560, marginX * 2 + (bucketCount - 1) * hGap + 60), height: 340, ...rest });
    this.bucketCount = bucketCount;
    this.hashHGap = hGap;
    this.hashMarginX = marginX;
    this.hashMarginY = marginY;
    this.hashVGap = vGap;
  }

  mount(container){
    super.mount(container);
    const NS = 'http://www.w3.org/2000/svg';
    const backdrop = document.createElementNS(NS, 'g');
    backdrop.classList.add('hash-buckets');
    for (let b = 0; b < this.bucketCount; b++){
      const x = this.hashMarginX + b * this.hashHGap;
      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', x - 22);
      rect.setAttribute('y', this.hashMarginY - 46);
      rect.setAttribute('width', 44);
      rect.setAttribute('height', 22);
      rect.setAttribute('rx', 4);
      rect.classList.add('hash-bucket-cell');
      const label = document.createElementNS(NS, 'text');
      label.setAttribute('x', x);
      label.setAttribute('y', this.hashMarginY - 30);
      label.classList.add('hash-bucket-label');
      label.textContent = b;
      backdrop.appendChild(rect);
      backdrop.appendChild(label);
    }
    this.svg.insertBefore(backdrop, this.edgeLayer);
  }
}

/* ============================================================
   RENDERER: split view — composes two child renderers side by
   side under ONE shared timeline. Each step carries a `.left` and
   `.right` sub-step, forwarded verbatim to the matching child. The
   children are ordinary renderers (ArrayBarsRenderer, etc.) that
   have no idea they're sharing a lesson — proof the engine
   composes rather than needing a special "comparison mode".
   ============================================================ */
class SplitRenderer{
  constructor({ left, right }){
    this.left = left;
    this.right = right;
  }

  mount(container){
    const wrap = document.createElement('div');
    wrap.className = 'split-viz';

    const leftCol = document.createElement('div');
    leftCol.className = 'split-viz__col';
    const leftLabel = document.createElement('div');
    leftLabel.className = 'split-viz__label';
    leftLabel.textContent = this.left.label;
    const leftMount = document.createElement('div');
    leftMount.className = 'viz-mount';
    leftCol.appendChild(leftLabel);
    leftCol.appendChild(leftMount);

    const rightCol = document.createElement('div');
    rightCol.className = 'split-viz__col';
    const rightLabel = document.createElement('div');
    rightLabel.className = 'split-viz__label';
    rightLabel.textContent = this.right.label;
    const rightMount = document.createElement('div');
    rightMount.className = 'viz-mount';
    rightCol.appendChild(rightLabel);
    rightCol.appendChild(rightMount);

    wrap.appendChild(leftCol);
    wrap.appendChild(rightCol);
    container.appendChild(wrap);

    this.left.renderer.mount(leftMount);
    this.right.renderer.mount(rightMount);
  }

  renderStep(step, opts){
    this.left.renderer.renderStep(step.left, opts);
    this.right.renderer.renderStep(step.right, opts);
  }
}

/* ============================================================
   RENDERER: merge-sort recursion tree. Nodes are variable-width
   "chip" rectangles holding a whole subarray (e.g. "[3, 8, 12]"),
   not single values — otherwise this is the same node/edge FLIP
   lifecycle as the tree and hash-table renderers: absent from the
   next step's `nodes` list means fade-and-remove (a merged node's
   two children vanish the instant it appears), new means fade-and-
   grow-in. Edge anchoring uses an approximate fixed offset instead
   of a true radius since chips aren't circular.
   ============================================================ */
class MergeTreeRenderer{
  constructor({ width = 640, height = 320 } = {}){
    this.width = width;
    this.height = height;
    this.nodeEls = new Map();
    this.edgeEls = new Map();
  }

  mount(container){
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${this.width} ${this.height}`);
    svg.classList.add('viz-svg');
    this.edgeLayer = document.createElementNS(NS, 'g');
    this.nodeLayer = document.createElementNS(NS, 'g');
    svg.appendChild(this.edgeLayer);
    svg.appendChild(this.nodeLayer);
    container.appendChild(svg);
    this.svg = svg;
  }

  _edgeTransform(parentPos, childPos){
    const dx = childPos.x - parentPos.x, dy = childPos.y - parentPos.y;
    const dist = Math.hypot(dx, dy) || 1;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const r = 16; // approximate chip half-extent for anchor purposes
    return {
      x: parentPos.x + (r / dist) * dx,
      y: parentPos.y + (r / dist) * dy,
      angle,
      scaleX: Math.max(dist - 2 * r, 0),
      scaleY: 1,
    };
  }

  _makeNode(id, label){
    const NS = 'http://www.w3.org/2000/svg';
    const g = document.createElementNS(NS, 'g');
    g.classList.add('mtnode');
    g.style.opacity = 0;

    const w = Math.max(30, 10 + label.length * 7.2);
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', -w / 2);
    rect.setAttribute('y', -13);
    rect.setAttribute('width', w);
    rect.setAttribute('height', 26);
    rect.setAttribute('rx', 5);
    rect.classList.add('mtnode-rect');

    const text = document.createElementNS(NS, 'text');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dy', '0.32em');
    text.classList.add('mtnode-label');
    text.textContent = label;

    g.appendChild(rect);
    g.appendChild(text);
    this.nodeLayer.appendChild(g);

    const rec = { g, rect, text };
    this.nodeEls.set(id, rec);
    return rec;
  }

  _makeEdge(id){
    const NS = 'http://www.w3.org/2000/svg';
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', 0); line.setAttribute('y1', 0);
    line.setAttribute('x2', 1); line.setAttribute('y2', 0);
    line.classList.add('tedge');
    line.style.opacity = 0;
    this.edgeLayer.appendChild(line);
    const rec = { line };
    this.edgeEls.set(id, rec);
    return rec;
  }

  renderStep(step, { duration, easing }){
    const nodes = step.nodes || [];
    const parents = step.parents || new Map();
    const comparing = step.comparing;
    const path = step.path || [];
    const newNode = step.newNode;

    const presentIds = new Set(nodes.map(n => n.id));
    const posById = new Map(nodes.map(n => [n.id, n]));

    this.nodeEls.forEach((rec, id) => {
      if (presentIds.has(id)) return;
      Motion.fadeTo(rec.g, 0, { duration, easing });
      this.nodeEls.delete(id);
      setTimeout(() => rec.g.remove(), duration + 30);
    });
    this.edgeEls.forEach((rec, id) => {
      if (presentIds.has(id)) return;
      Motion.fadeTo(rec.line, 0, { duration, easing });
      this.edgeEls.delete(id);
      setTimeout(() => rec.line.remove(), duration + 30);
    });

    nodes.forEach(n => {
      const parentId = parents.get(n.id);
      const isNew = !this.nodeEls.has(n.id);

      let entryPos = n;
      if (isNew && parentId && posById.has(parentId)) entryPos = posById.get(parentId);
      const rec = isNew ? this._makeNode(n.id, n.label) : this.nodeEls.get(n.id);

      if (!isNew && rec.text.textContent !== n.label){
        rec.text.textContent = n.label;
        const w = Math.max(30, 10 + n.label.length * 7.2);
        rec.rect.setAttribute('width', w);
        rec.rect.setAttribute('x', -w / 2);
      }

      if (isNew) rec.g.style.transform = Motion.stringify({ x: entryPos.x, y: entryPos.y });
      Motion.moveTo(rec.g, { x: n.x, y: n.y }, { duration, easing });
      Motion.fadeTo(rec.g, 1, { duration, easing });

      const isComparing = comparing === n.id;
      rec.rect.classList.toggle('is-comparing', isComparing);
      rec.rect.classList.toggle('is-path', !isComparing && path.indexOf(n.id) !== -1);
      rec.rect.classList.toggle('is-new', n.id === newNode);
    });

    nodes.forEach(n => {
      const parentId = parents.get(n.id);
      const isNewEdge = !this.edgeEls.has(n.id);
      const edge = isNewEdge ? this._makeEdge(n.id) : this.edgeEls.get(n.id);
      if (!parentId){
        Motion.fadeTo(edge.line, 0, { duration, easing });
        return;
      }
      const target = this._edgeTransform(posById.get(parentId), n);
      if (isNewEdge) edge.line.style.transform = Motion.stringify({ ...target, scaleX: 0.001 });
      Motion.moveTo(edge.line, target, { duration, easing });
      Motion.fadeTo(edge.line, 1, { duration, easing });
    });
  }
}

/* ============================================================
   DEMO 3: Big-O intuition — a growth race across five polynomial
   classes, then a reveal of exponential time recalibrating the
   whole chart. Heights are fixed to a per-phase max so every bar
   visibly grows across steps, rather than each step re-normalizing
   to its own max (which would pin the leading class at 100% forever
   and hide the race).
   ============================================================ */
function bigOSteps(){
  const CLASSES = [
    { id: 'const', label: 'O(1)', color: 'var(--cyan)', fn: () => 1 },
    { id: 'log', label: 'O(log n)', color: 'var(--success)', fn: (n) => Math.max(1, Math.log2(n)) },
    { id: 'linear', label: 'O(n)', color: 'var(--text)', fn: (n) => n },
    { id: 'nlogn', label: 'O(n log n)', color: 'var(--amber)', fn: (n) => Math.max(1, n * Math.log2(n)) },
    { id: 'quad', label: 'O(n²)', color: 'var(--danger)', fn: (n) => n * n },
  ];
  const EXP = { id: 'exp', label: 'O(2ⁿ)', color: 'var(--exp-color)', fn: (n) => Math.pow(2, n) };

  const PHASE1_MAX = 32 * 32;         // quadratic at n=32
  const PHASE2_MAX = Math.pow(2, 40); // exponential at n=40

  const steps = [];
  const snap = (activeClasses, n, max, caption) => {
    const logMax = Math.log10(max + 1);
    const bars = activeClasses.map(c => {
      const value = c.fn(n);
      return { id: c.id, label: c.label, color: c.color, value, heightFrac: Math.log10(value + 1) / logMax };
    });
    steps.push({ bars, caption });
  };

  const ns = [1, 2, 4, 8, 16, 32];
  const captions1 = [
    `At n=1, every approach costs about the same — the differences haven't shown up yet.`,
    `n doubles to 2. Constant time didn't notice; everything else nudged up a little.`,
    `n=4. O(n²) is now visibly ahead of linear — each doubling of n roughly quadruples its cost.`,
    `n=8. Notice O(log n): it only just ticked up, even though n itself doubled again.`,
    `n=16. The gap between O(n) and O(n²) keeps widening — quadratic cost compounds with every doubling.`,
    `n=32. The ranking is settled: constant < logarithmic < linear < linearithmic < quadratic.`,
  ];
  ns.forEach((n, i) => snap(CLASSES, n, PHASE1_MAX, captions1[i]));

  snap(CLASSES.concat([EXP]), 32, PHASE2_MAX,
    `Same n=32 — but exponential time was off the chart this whole time. Watch every other bar shrink to make room.`);

  snap(CLASSES.concat([EXP]), 40, PHASE2_MAX,
    `Just 8 more values of n, and O(2ⁿ) has already left every polynomial curve for dust — this is why exponential algorithms become unusable almost immediately.`);

  return steps;
}

/* ============================================================
   DEMO 4: Arrays & memory layout — direct address access, then an
   insertion that forces an O(n) shift. The reserved 6th slot starts
   as a dashed "ghost" placeholder (ArrayBarsRenderer's hidden/reveal
   support) — its real value and height are set at construction, just
   visually withheld until the shift delivers it into the open gap.
   ============================================================ */
function arraysMemorySteps(){
  const values = [
    { id: 'a0', value: 44 }, { id: 'a1', value: 50 }, { id: 'a2', value: 56 },
    { id: 'a3', value: 62 }, { id: 'a4', value: 68 }, { id: 'a5', value: 91, hidden: true },
  ];
  const order = values.map(v => v.id);
  const snap = (extra) => Object.assign({ order, compare: [], swap: [], sorted: [], dim: [], reveal: [], caption: '' }, extra);

  const steps = [];
  steps.push(snap({ caption: `An array is a block of contiguous memory — each slot sits right after the last, so its address is predictable.` }));
  steps.push(snap({ compare: [4], caption: `To read arr[4], the computer computes address = base + 4 × stride and jumps straight there — no scanning required.` }));
  steps.push(snap({ compare: [4], caption: `That's one multiply and one add, no matter how big the array is — this is why array access is O(1).` }));
  steps.push(snap({ caption: `Now insert 91 at index 2 — but index 2 is already occupied, so everything from there on has to shift right first.` }));
  steps.push({
    order: ['a0', 'a1', 'a5', 'a2', 'a3', 'a4'],
    compare: [], swap: [2, 3, 4, 5], sorted: [], dim: [], reveal: [],
    caption: `Shift each element one slot right, starting from the end, so nothing gets overwritten along the way.`,
  });
  steps.push({
    order: ['a0', 'a1', 'a5', 'a2', 'a3', 'a4'],
    compare: [], swap: [], sorted: [2], dim: [], reveal: ['a5'],
    caption: `With the gap open, the new value settles in — but that shift was O(n) in the worst case, since every later element had to move.`,
  });
  return { steps, values };
}

/* ============================================================
   DEMO 5: Linear vs. binary search on the same sorted array —
   one continuous timeline, two acts. `dim` fades out eliminated
   indices so the shrinking search space is visible, not just
   described.
   ============================================================ */
function linearBinarySearchSteps(){
  const nums = [12, 18, 25, 31, 40, 47, 53, 68];
  const target = 47;
  const targetIndex = nums.indexOf(target);
  const values = nums.map((value, i) => ({ id: 's' + i, value }));
  const order = values.map(v => v.id);
  const snap = (extra) => Object.assign({ order, compare: [], swap: [], sorted: [], dim: [], caption: '' }, extra);

  const steps = [];
  steps.push(snap({ caption: `8 sorted values. Target: ${target}. Linear search checks every cell from the start — no shortcuts, no assumptions about order.` }));
  for (let i = 0; i < targetIndex; i++){
    steps.push(snap({ compare: [i], caption: `Index ${i} is ${nums[i]} — not ${target}. Nothing here to exploit, so just move to the next cell.` }));
  }
  steps.push(snap({ sorted: [targetIndex], caption: `Index ${targetIndex} is ${target} — found! That took ${targetIndex + 1} comparisons, checking every cell along the way.` }));
  steps.push(snap({ caption: `Same array, same target — but it's sorted. That fact alone lets us skip most of it.` }));

  let low = 0, high = nums.length - 1;
  const outside = () => {
    const idx = [];
    for (let i = 0; i < nums.length; i++) if (i < low || i > high) idx.push(i);
    return idx;
  };
  while (low <= high){
    const mid = Math.floor((low + high) / 2);
    if (nums[mid] === target){
      steps.push(snap({ dim: outside(), sorted: [mid], caption: `Middle of the remaining range is index ${mid} — and it's ${target}. Found it.` }));
      break;
    } else if (nums[mid] < target){
      steps.push(snap({ compare: [mid], dim: outside(), caption: `Middle is index ${mid} (${nums[mid]}). ${target} is bigger, so it can't be in the left half — eliminate indices ${low}–${mid}.` }));
      low = mid + 1;
    } else {
      steps.push(snap({ compare: [mid], dim: outside(), caption: `Middle is index ${mid} (${nums[mid]}). ${target} is smaller, so it can't be in the right half — eliminate indices ${mid}–${high}.` }));
      high = mid - 1;
    }
  }
  return { steps, values };
}

/* ============================================================
   DEMO 6: Two pointers — Two Sum on a sorted array. No positions
   ever change (values are already in their final order); only the
   highlighted left/right indices move, which is why this reuses
   compare/swap purely as "two distinctly colored positions" rather
   than their bubble-sort meaning.
   ============================================================ */
function twoPointerSteps(){
  const nums = [11, 15, 20, 27, 33, 41, 46, 52];
  const target = 68;
  const values = nums.map((value, i) => ({ id: 'p' + i, value }));
  const order = values.map(v => v.id);
  const snap = (extra) => Object.assign({ order, compare: [], swap: [], sorted: [], dim: [], caption: '' }, extra);

  const steps = [];
  steps.push(snap({ caption: `8 sorted values, target sum ${target}. Two pointers start at opposite ends — the sorted order tells us which way to move next.` }));

  let left = 0, right = nums.length - 1;
  while (left < right){
    const sum = nums[left] + nums[right];
    if (sum === target){
      steps.push(snap({ sorted: [left, right], caption: `${nums[left]} + ${nums[right]} = ${sum} — match! Two pointers, each moving at most n times, found it with no nested loop.` }));
      break;
    } else if (sum < target){
      steps.push(snap({ compare: [left], swap: [right], caption: `${nums[left]} + ${nums[right]} = ${sum}. Too small — the only way to raise the sum is to move the LEFT pointer right, toward bigger values.` }));
      left++;
    } else {
      steps.push(snap({ compare: [left], swap: [right], caption: `${nums[left]} + ${nums[right]} = ${sum}. Too big — move the RIGHT pointer left, toward smaller values.` }));
      right--;
    }
  }
  return { steps, values };
}

/* ============================================================
   DEMO 7: Linked lists — singly-linked traversal, then doubly-
   linked back-traversal, then Floyd's cycle detection on a fresh
   "lollipop" shaped list (straight tail + a loop). The cycle act
   swaps in an entirely new node/edge set — the old ones simply
   aren't in the next step's `nodes` list, so TreeGraphRenderer's
   existing "not present -> fade and remove" cleanup handles the
   teardown for free, same mechanism as a future BST-delete lesson.
   ============================================================ */
function computeLinearListLayout(ids, { hGap = 84, marginX = 60, y = 110 } = {}){
  const positions = new Map();
  ids.forEach((id, i) => positions.set(id, { x: marginX + i * hGap, y }));
  return positions;
}

function computeLollipopLayout(tailIds, loopIds, { hGap = 80, marginX = 60, y = 160, loopRadius = 66 } = {}){
  const positions = new Map();
  tailIds.forEach((id, i) => positions.set(id, { x: marginX + i * hGap, y }));
  const tailEndX = marginX + (tailIds.length - 1) * hGap;
  const centerX = tailEndX + hGap + loopRadius;
  const n = loopIds.length;
  loopIds.forEach((id, i) => {
    const angle = Math.PI + (i / n) * 2 * Math.PI; // start at the leftmost point, sweep around
    positions.set(id, { x: centerX + loopRadius * Math.cos(angle), y: y + loopRadius * Math.sin(angle) });
  });
  return positions;
}

function snapshotList(idsInOrder, positions, values, extra){
  const nodes = idsInOrder.map(id => ({ id, value: values.get(id), x: positions.get(id).x, y: positions.get(id).y }));
  const parents = new Map();
  idsInOrder.forEach((id, i) => parents.set(id, i === 0 ? null : idsInOrder[i - 1]));
  return Object.assign({
    nodes, parents, comparing: null, path: [], newNode: null, pointers: [], prevOf: new Map(), caption: '',
  }, extra);
}

function linkedListSteps(){
  const vals = [8, 15, 3, 22, 6].map((v, i) => ['n' + i, v]);
  const ids = vals.map(v => v[0]);
  const values = new Map(vals);
  const pos = computeLinearListLayout(ids);
  const steps = [];

  steps.push(snapshotList(ids, pos, values, {
    pointers: [{ id: 'ptr-cur', label: 'cur', atNodeId: ids[0], color: 'var(--cyan)' }],
    caption: `A linked list isn't stored together in memory — each node just knows where the NEXT one lives.`,
  }));
  for (let i = 1; i < ids.length; i++){
    steps.push(snapshotList(ids, pos, values, {
      pointers: [{ id: 'ptr-cur', label: 'cur', atNodeId: ids[i], color: 'var(--cyan)' }],
      caption: i === ids.length - 1
        ? `Node ${i}'s next is null — end of the list. Reaching any node costs up to O(n), one link at a time — there's no jumping ahead.`
        : `Follow node ${i - 1}'s \`next\` pointer to reach node ${i} — there's no way to jump directly to it, unlike an array.`,
    }));
  }

  // doubly-linked: fade in prev-links, then walk backward from the tail
  const prevOf = new Map();
  for (let i = 1; i < ids.length; i++) prevOf.set(ids[i], ids[i - 1]);
  steps.push(snapshotList(ids, pos, values, {
    prevOf,
    pointers: [{ id: 'ptr-cur', label: 'cur', atNodeId: ids[ids.length - 1], color: 'var(--cyan)' }],
    caption: `A doubly linked list adds a \`prev\` pointer to every node — more memory per node, but now the list can be walked backward too.`,
  }));
  for (let i = ids.length - 2; i >= ids.length - 3 && i >= 0; i--){
    steps.push(snapshotList(ids, pos, values, {
      prevOf,
      pointers: [{ id: 'ptr-cur', label: 'cur', atNodeId: ids[i], color: 'var(--cyan)' }],
      caption: `Follow \`prev\` to step backward to node ${i} — something a singly linked list can't do at all without restarting from the head.`,
    }));
  }

  // Floyd's cycle detection on a fresh lollipop-shaped list.
  const cVals = [9, 4, 17, 2, 30, 11, 5].map((v, i) => ['c' + i, v]);
  const cIds = cVals.map(v => v[0]);
  const cValues = new Map(cVals);
  const tail = cIds.slice(0, 3);
  const loop = cIds.slice(3);
  const cPos = computeLollipopLayout(tail, loop);
  const cOrder = tail.concat(loop);

  // "next" chain: tail walks forward, last loop node wraps to the first loop node.
  const nextIndex = (i) => (i === cOrder.length - 1 ? tail.length : i + 1);
  const idxOf = new Map(cOrder.map((id, i) => [id, i]));

  const cycleSnap = (extraFields) => {
    const parents = new Map();
    cOrder.forEach((id, i) => {
      const isLoopStart = i === tail.length;
      parents.set(id, isLoopStart ? cOrder[cOrder.length - 1] : (i === 0 ? null : cOrder[i - 1]));
    });
    const nodes = cOrder.map(id => ({ id, value: cValues.get(id), x: cPos.get(id).x, y: cPos.get(id).y }));
    return Object.assign({ nodes, parents, comparing: null, path: [], newNode: null, pointers: [], prevOf: new Map(), caption: '' }, extraFields);
  };

  steps.push(cycleSnap({
    caption: `Now a different list — one with a bug: the last node loops back instead of ending. A plain traversal here would run forever.`,
  }));

  let slow = 0, fast = 0;
  steps.push(cycleSnap({
    pointers: [
      { id: 'ptr-slow', label: 'slow', atNodeId: cOrder[slow], color: 'var(--cyan)' },
      { id: 'ptr-fast', label: 'fast', atNodeId: cOrder[fast], color: 'var(--amber)' },
    ],
    caption: `Two pointers start together at the head. Each step, \`slow\` moves one node forward; \`fast\` moves two.`,
  }));

  let stepNum = 1;
  while (true){
    slow = nextIndex(slow);
    fast = nextIndex(nextIndex(fast));
    const met = slow === fast;
    steps.push(cycleSnap({
      comparing: met ? cOrder[slow] : null,
      pointers: [
        { id: 'ptr-slow', label: 'slow', atNodeId: cOrder[slow], color: 'var(--cyan)' },
        { id: 'ptr-fast', label: 'fast', atNodeId: cOrder[fast], color: 'var(--amber)' },
      ],
      caption: met
        ? `Step ${stepNum}: slow and fast land on the SAME node — that's only possible if there's a cycle. If the list ended, fast would have hit null first.`
        : `Step ${stepNum}: slow -> node ${idxOf.get(cOrder[slow])}, fast -> node ${idxOf.get(cOrder[fast])}.`,
    }));
    if (met) break;
    stepNum++;
  }

  return steps;
}

/* ============================================================
   DEMO 8 & 9: Stacks, and Queues/Deques — both reuse
   ArrayBarsRenderer's ghost/reveal/conceal mechanism. Every slot's
   bar geometry is fixed at construction (uniform height, since the
   values here aren't meant to be compared by magnitude); push/pop
   just toggle a slot between hidden and shown, and reveal can carry
   a NEW label so the same physical slot can be reused for a
   different value after a pop — exactly like a real array-backed
   stack/queue reuses its backing storage.
   ============================================================ */
function stackSteps(){
  const slots = [50, 50, 50].map((v, i) => ({ id: 'st' + i, value: v, hidden: true }));
  const order = slots.map(s => s.id);
  const snap = (extra) => Object.assign({ order, compare: [], swap: [], sorted: [], dim: [], reveal: [], conceal: [], caption: '' }, extra);

  const steps = [];
  steps.push(snap({ caption: `A stack only lets you touch one end — the top. Push adds there; pop removes from there. Nothing else is reachable directly.` }));

  steps.push(snap({ reveal: [{ id: 'st0', value: 15 }], compare: [0], caption: `Push 15 — it becomes the top.` }));
  steps.push(snap({ reveal: [{ id: 'st1', value: 8 }], compare: [1], caption: `Push 8 — now it's the top. 15 is still there, just not reachable until 8 is gone.` }));
  steps.push(snap({ reveal: [{ id: 'st2', value: 23 }], compare: [2], caption: `Push 23 — the top shifts again to the most recent value.` }));
  steps.push(snap({ conceal: ['st2'], caption: `Pop removes 23 — whatever was pushed LAST comes off FIRST. That's LIFO.` }));
  steps.push(snap({ reveal: [{ id: 'st2', value: 4 }], compare: [1], caption: `Push 4 onto the new top — reusing the same slot 23 just vacated.` }));
  steps.push(snap({ conceal: ['st2'], caption: `Pop removes 4.` }));
  steps.push(snap({ conceal: ['st1'], caption: `Pop removes 8 — we're back down to just 15.` }));
  steps.push(snap({ reveal: [{ id: 'st1', value: 19 }], compare: [1], caption: `Push 19 — LIFO in action: the order things come out is always the reverse of the order they went in.` }));

  return steps;
}

function queueDequeSteps(){
  const CAP = 4;
  const slots = [0, 1, 2, 3].map(i => ({ id: 'q' + i, value: 50, hidden: true }));
  const order = slots.map(s => s.id);
  const snap = (extra) => Object.assign({ order, compare: [], swap: [], sorted: [], dim: [], reveal: [], conceal: [], caption: '' }, extra);
  const slotId = (i) => 'q' + (((i % CAP) + CAP) % CAP);

  const steps = [];
  steps.push(snap({ caption: `A queue only grows at the back and shrinks at the front — first in, first out. An array-backed queue reuses freed slots in a circle instead of growing forever.` }));

  let front = 0, back = 0;
  const enqueue = (label, value) => {
    steps.push(snap({ reveal: [{ id: slotId(back), value }], compare: [((back % CAP) + CAP) % CAP], caption: label }));
    back++;
  };
  const dequeue = (label) => {
    steps.push(snap({ conceal: [slotId(front)], caption: label }));
    front++;
  };

  enqueue(`Enqueue A at the back (slot 0).`, 'A');
  enqueue(`Enqueue B — back moves to slot 1.`, 'B');
  enqueue(`Enqueue C — slot 2.`, 'C');
  dequeue(`Dequeue removes from the FRONT — A leaves, regardless of what's been pushed since. Slot 0 is now free.`);
  enqueue(`Enqueue D fills slot 3 — full from 0 to 3 at first glance, but slot 0 is actually free.`, 'D');
  enqueue(`Enqueue E wraps back around to slot 0 — that's the point of a CIRCULAR buffer: reuse freed space instead of shifting everyone or growing forever.`, 'E');
  dequeue(`Dequeue B.`);
  dequeue(`Dequeue C.`);

  // deque: operate at both ends
  front--; // addFront inserts one before the current front
  steps.push(snap({ reveal: [{ id: slotId(front), value: 'Z' }], compare: [((front % CAP) + CAP) % CAP], caption: `A deque allows the SAME operations at BOTH ends. addFront(Z) inserts before the current front — slot 2.` }));
  back--; // removeBack pops the most recent back insertion
  steps.push(snap({ conceal: [slotId(back)], caption: `removeBack() pops E off the tail end instead of the front — deques give you both stack and queue behavior at once.` }));

  return steps;
}

/* ============================================================
   DEMO 10: Hash table with separate chaining. Buckets are a static
   backdrop (drawn once by HashTableRenderer); each inserted key
   becomes a node whose parent is either nothing (first in its
   bucket) or the previous entry in that bucket's chain — collision
   chains are just very short linked lists hanging off a bucket.
   ============================================================ */
function computeHashLayout(bucketCount, chains, { hGap = 92, marginX = 56, marginY = 74, vGap = 58 } = {}){
  const positions = new Map();
  for (let b = 0; b < bucketCount; b++){
    (chains.get(b) || []).forEach((id, depth) => {
      positions.set(id, { x: marginX + b * hGap, y: marginY + depth * vGap });
    });
  }
  return positions;
}

function snapshotHash(bucketCount, chains, valueById, extra){
  const positions = computeHashLayout(bucketCount, chains);
  const nodes = [];
  const parents = new Map();
  chains.forEach((items, b) => {
    items.forEach((id, depth) => {
      const p = positions.get(id);
      nodes.push({ id, value: valueById.get(id), x: p.x, y: p.y });
      parents.set(id, depth === 0 ? null : items[depth - 1]);
    });
  });
  return Object.assign({ nodes, parents, comparing: null, path: [], newNode: null, caption: '' }, extra);
}

function hashTableSteps(){
  const bucketCount = 6;
  const keys = [12, 25, 7, 18, 31, 4];
  const chains = new Map();
  for (let b = 0; b < bucketCount; b++) chains.set(b, []);
  const valueById = new Map();
  let uid = 0;
  const cloneChains = () => { const c = new Map(); chains.forEach((arr, b) => c.set(b, arr.slice())); return c; };

  const steps = [];
  steps.push(snapshotHash(bucketCount, cloneChains(), valueById, {
    caption: `A hash table has ${bucketCount} buckets. Inserting a key means computing hash(key) % ${bucketCount} to pick a bucket.`,
  }));

  keys.forEach(key => {
    const bucket = key % bucketCount;
    const id = 'h' + (uid++);
    valueById.set(id, key);

    steps.push(snapshotHash(bucketCount, cloneChains(), valueById, { caption: `hash(${key}) = ${key} % ${bucketCount} = ${bucket}.` }));

    const existing = chains.get(bucket);
    const collided = existing.length > 0;
    const prevInChain = collided ? existing[existing.length - 1] : null;
    existing.push(id);

    steps.push(snapshotHash(bucketCount, cloneChains(), valueById, {
      comparing: id, newNode: id, path: collided ? [prevInChain, id] : [id],
      caption: collided
        ? `Bucket ${bucket} already holds ${existing.slice(0, -1).map(i => valueById.get(i)).join(', ')} — chain ${key} onto the end.`
        : `Bucket ${bucket} is empty — ${key} goes straight in.`,
    }));
  });

  let longestBucket = 0, longestLen = 0;
  chains.forEach((arr, b) => { if (arr.length > longestLen){ longestLen = arr.length; longestBucket = b; } });
  const chain = chains.get(longestBucket);
  const lastKey = valueById.get(chain[chain.length - 1]);
  steps.push(snapshotHash(bucketCount, cloneChains(), valueById, {
    caption: `Looking up ${lastKey}: hash lands on bucket ${longestBucket}, but now we have to walk its chain to find the right key.`,
  }));
  chain.forEach((id, i) => {
    const isLast = i === chain.length - 1;
    steps.push(snapshotHash(bucketCount, cloneChains(), valueById, {
      comparing: id, path: chain.slice(0, i + 1),
      caption: isLast
        ? `${valueById.get(id)} — found, after ${chain.length} comparisons instead of 1.`
        : `${valueById.get(id)} isn't ${lastKey} — follow the chain to the next item.`,
    }));
  });

  return steps;
}

/* ============================================================
   DEMO 11: Bubble sort vs. insertion sort, side by side. Both run
   on the same values (separate id namespaces so the two
   ArrayBarsRenderer instances don't share element pools), on one
   shared timeline via SplitRenderer. The shorter algorithm's
   timeline is padded with its own final "Sorted." step so both
   sides stay in lockstep with a single scrubber.
   ============================================================ */
function insertionSortSteps(items){
  const arr = items.slice();
  const n = arr.length;
  const steps = [];
  let sortedIdxs = n > 0 ? [0] : [];

  const snap = (extra) => Object.assign({
    order: arr.map(x => x.id), compare: [], swap: [], sorted: sortedIdxs.slice(), caption: '',
  }, extra);

  steps.push(snap({ caption: `Insertion sort builds a sorted prefix one element at a time, inserting each new value where it belongs.` }));

  for (let i = 1; i < n; i++){
    let j = i;
    steps.push(snap({ compare: [j], caption: `Take ${arr[j].value} and find where it belongs among the sorted values to its left.` }));
    while (j > 0 && arr[j - 1].value > arr[j].value){
      steps.push(snap({ swap: [j - 1, j], caption: `${arr[j - 1].value} > ${arr[j].value} — shift it right and keep moving left.` }));
      const tmp = arr[j - 1]; arr[j - 1] = arr[j]; arr[j] = tmp;
      j--;
    }
    sortedIdxs = Array.from({ length: i + 1 }, (_, k) => k);
    steps.push(snap({ sorted: sortedIdxs, caption: `${arr[j].value} is in place — the first ${i + 1} values are sorted.` }));
  }
  steps.push(snap({ sorted: Array.from({ length: n }, (_, k) => k), caption: 'Sorted.' }));
  return steps;
}

function bubbleInsertionCompareSteps(){
  const nums = generateValues(8).map(v => v.value);
  const bubbleItems = nums.map((value, i) => ({ id: 'bl' + i, value }));
  const insertItems = nums.map((value, i) => ({ id: 'il' + i, value }));

  const bubbleTimeline = bubbleSortSteps(bubbleItems);
  const insertTimeline = insertionSortSteps(insertItems);
  const total = Math.max(bubbleTimeline.length, insertTimeline.length);

  const pad = (timeline) => {
    const out = timeline.slice();
    const last = timeline[timeline.length - 1];
    while (out.length < total) out.push(last);
    return out;
  };
  const bPadded = pad(bubbleTimeline);
  const iPadded = pad(insertTimeline);

  const steps = [];
  for (let k = 0; k < total; k++){
    let caption;
    if (k === 0){
      caption = `Same 8 values, two strategies. Watch which one finishes with fewer comparisons.`;
    } else if (k === total - 1){
      const faster = insertTimeline.length < bubbleTimeline.length ? 'insertion' : (bubbleTimeline.length < insertTimeline.length ? 'bubble' : null);
      caption = `Bubble sort: ${bubbleTimeline.length - 1} steps. Insertion sort: ${insertTimeline.length - 1} steps.` +
        (faster === 'insertion' ? ` Insertion wins here — it can stop scanning early once it finds the right spot, instead of always re-scanning the whole row.`
          : faster === 'bubble' ? ` Bubble wins here, though that's unusual — it needs the early-exit swapped-flag to avoid full O(n²) passes.`
          : ` They tied on this input.`);
    } else {
      caption = `Bubble: ${bPadded[k].caption}  ·  Insertion: ${iPadded[k].caption}`;
    }
    steps.push({ left: bPadded[k], right: iPadded[k], caption });
  }
  return { steps, bubbleItems, insertItems };
}

/* ============================================================
   DEMO 12: Merge sort's recursion tree — split top-down to single
   elements, then merge bottom-up. `computeMergeTreeLayout` exploits
   the fact that a merge-sort recursion tree is always a COMPLETE
   binary tree of known depth: evenly spacing each level's nodes
   across the same fixed width automatically centers every parent
   over its two children (provably, for a complete binary tree),
   so no separate centering pass is needed the way the BST layout
   requires.
   ============================================================ */
function computeMergeTreeLayout(depth, { width = 620, vGap = 68, marginY = 40 } = {}){
  const positions = new Map();
  for (let d = 0; d <= depth; d++){
    const count = Math.pow(2, d);
    for (let i = 0; i < count; i++){
      positions.set(`${d}-${i}`, { x: width * (i + 0.5) / count, y: marginY + d * vGap });
    }
  }
  return positions;
}

function mergeSortSteps(){
  const nums = generateValues(8).map(v => v.value);
  const depth = Math.round(Math.log2(nums.length));
  const positions = computeMergeTreeLayout(depth);

  const nodeValues = new Map();
  (function assign(d, i, arr){
    nodeValues.set(`${d}-${i}`, arr.slice());
    if (arr.length > 1){
      const mid = Math.ceil(arr.length / 2);
      assign(d + 1, i * 2, arr.slice(0, mid));
      assign(d + 1, i * 2 + 1, arr.slice(mid));
    }
  })(0, 0, nums);

  const activeIds = new Set();
  const steps = [];
  const snap = (extra) => {
    const nodes = [];
    activeIds.forEach(id => {
      const p = positions.get(id);
      nodes.push({ id, label: '[' + nodeValues.get(id).join(', ') + ']', x: p.x, y: p.y });
    });
    // A tree-parent reference is only meaningful if that parent is ALSO
    // currently rendered — during bottom-up merging a node's real parent
    // usually doesn't exist yet (it's created later, when ITS merge runs),
    // so an unconditional reference here would hand the renderer a
    // position for a node that isn't in this step's `nodes` at all.
    const parents = new Map();
    activeIds.forEach(id => {
      const [d, i] = id.split('-').map(Number);
      const parentId = d > 0 ? `${d - 1}-${Math.floor(i / 2)}` : null;
      if (parentId && activeIds.has(parentId)) parents.set(id, parentId);
    });
    return Object.assign({ nodes, parents, comparing: null, path: [], newNode: null, caption: '' }, extra);
  };

  activeIds.add('0-0');
  steps.push(snap({ caption: `Merge sort splits the array in half, recursively, until every piece is a single element (trivially "sorted").` }));
  for (let d = 1; d <= depth; d++){
    for (let i = 0; i < Math.pow(2, d); i++) activeIds.add(`${d}-${i}`);
    if (d === depth){
      // The intermediate levels have served their purpose (showing the divide).
      // Drop them now so each parent re-enters fresh, as a genuinely new node,
      // once its merge actually computes its sorted content — otherwise the
      // renderer would silently reuse the stale pre-merge placeholder instead
      // of refreshing it.
      for (let dd = 0; dd < depth; dd++) for (let ii = 0; ii < Math.pow(2, dd); ii++) activeIds.delete(`${dd}-${ii}`);
    }
    steps.push(snap({ caption: d === depth ? `Down to single elements — nothing left to split.` : `Split again: each half becomes two quarters.` }));
  }

  (function mergeLevel(d){
    if (d < 0) return;
    const count = Math.pow(2, d);
    for (let i = 0; i < count; i++){
      const parentId = `${d}-${i}`;
      const leftId = `${d + 1}-${i * 2}`, rightId = `${d + 1}-${i * 2 + 1}`;
      const left = nodeValues.get(leftId).slice(), right = nodeValues.get(rightId).slice();

      steps.push(snap({ path: [leftId, rightId], caption: `Merge [${left.join(', ')}] and [${right.join(', ')}] — compare their fronts and take the smaller each time.` }));

      const merged = [];
      let li = 0, ri = 0;
      while (li < left.length && ri < right.length){
        if (left[li] <= right[ri]){
          steps.push(snap({ comparing: leftId, path: [rightId], caption: `${left[li]} ≤ ${right[ri]} — take ${left[li]} from the left.` }));
          merged.push(left[li++]);
        } else {
          steps.push(snap({ comparing: rightId, path: [leftId], caption: `${right[ri]} < ${left[li]} — take ${right[ri]} from the right.` }));
          merged.push(right[ri++]);
        }
      }
      while (li < left.length) merged.push(left[li++]);
      while (ri < right.length) merged.push(right[ri++]);

      nodeValues.set(parentId, merged);
      activeIds.delete(leftId);
      activeIds.delete(rightId);
      activeIds.add(parentId);
      steps.push(snap({ newNode: parentId, caption: `[${merged.join(', ')}] is now sorted and takes the place of its two halves.` }));
    }
    mergeLevel(d - 1);
  })(depth - 1);

  steps.push(snap({ caption: 'Sorted.' }));
  return steps;
}

/* ============================================================
   DEMO 13: Quick sort — Lomuto partitioning. Reuses
   ArrayBarsRenderer exactly as bubble sort does: `dim` fades out
   whatever's outside the current [low, high] range so the shrinking
   recursive scope is visible, not just described.
   ============================================================ */
function quickSortSteps(items){
  const arr = items.slice();
  const steps = [];
  const sortedIdxs = new Set();

  const outside = (low, high) => {
    const idx = [];
    for (let k = 0; k < arr.length; k++) if (k < low || k > high) idx.push(k);
    return idx;
  };
  const snap = (low, high, extra) => Object.assign({
    order: arr.map(x => x.id), compare: [], swap: [], sorted: Array.from(sortedIdxs), dim: outside(low, high), caption: '',
  }, extra);

  steps.push(snap(0, arr.length - 1, { caption: `Quick sort picks a pivot, then partitions the array so everything smaller ends up on its left and everything bigger on its right.` }));

  (function quicksort(low, high){
    if (low > high) return;
    if (low === high){ sortedIdxs.add(low); return; }

    const pivotVal = arr[high].value;
    steps.push(snap(low, high, { compare: [high], caption: `Pivot: ${pivotVal} (the last element of this range).` }));

    let i = low - 1;
    for (let j = low; j < high; j++){
      steps.push(snap(low, high, { compare: [j, high], caption: `Compare ${arr[j].value} to the pivot (${pivotVal}).` }));
      if (arr[j].value <= pivotVal){
        i++;
        if (i !== j){
          steps.push(snap(low, high, { swap: [i, j], caption: `${arr[j].value} ≤ ${pivotVal} — swap it into the "smaller" region.` }));
          const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
      }
    }
    i++;
    if (i !== high){
      steps.push(snap(low, high, { swap: [i, high], caption: `Swap the pivot into position ${i} — everything left of it is smaller, everything right is bigger.` }));
      const tmp = arr[i]; arr[i] = arr[high]; arr[high] = tmp;
    }
    sortedIdxs.add(i);
    steps.push(snap(low, high, { sorted: Array.from(sortedIdxs), caption: `${arr[i].value} is now in its FINAL sorted position. Recurse on each side of it.` }));

    quicksort(low, i - 1);
    quicksort(i + 1, high);
  })(0, arr.length - 1);

  steps.push(Object.assign(snap(0, arr.length - 1, {}), { dim: [], sorted: arr.map((_, k) => k), caption: 'Sorted.' }));
  return steps;
}

/* Bottom-up merge sort producing ArrayBarsRenderer-compatible steps.
   Used by race mode so any lesson can pit merge sort against another algo. */
function mergeSortBarsSteps(items){
  const arr = items.slice();
  const n = arr.length;
  const steps = [];

  const snap = (extra) => Object.assign({
    order: arr.map(x => x.id), compare: [], swap: [], sorted: [], dim: [], caption: '',
  }, extra);

  steps.push(snap({ caption: 'Merge sort: divide into halves, merge back in sorted order.' }));

  for (let width = 1; width < n; width *= 2){
    for (let lo = 0; lo < n; lo += 2 * width){
      const mid = Math.min(lo + width, n);
      const hi  = Math.min(lo + 2 * width, n);
      if (mid >= hi) continue;
      const left  = arr.slice(lo, mid);
      const right = arr.slice(mid, hi);
      let i = 0, j = 0, k = lo;
      while (i < left.length && j < right.length){
        steps.push(snap({ compare: [lo + i, mid + j], caption: `Compare ${left[i].value} vs ${right[j].value}.` }));
        if (left[i].value <= right[j].value) arr[k++] = left[i++];
        else                                  arr[k++] = right[j++];
      }
      while (i < left.length)  arr[k++] = left[i++];
      while (j < right.length) arr[k++] = right[j++];
      steps.push(snap({ caption: `Merged [${lo}–${hi - 1}].` }));
    }
  }
  steps.push(snap({ sorted: arr.map((_, k) => k), caption: 'Sorted.' }));
  return steps;
}

/* ============================================================
   DEMO 14: Heap sort — build a max-heap, then repeatedly extract
   the root. Reuses TreeGraphRenderer exactly as the BST lesson
   does: node identity follows VALUE (via a stable id), so a swap
   glides two values across the tree via FLIP, same vocabulary as
   an AVL rotation. `computeHeapLayout` positions by the standard
   heap array-index formula (depth = floor(log2(i+1))).
   ============================================================ */
function computeHeapLayout(n, { width = 620, vGap = 72, marginY = 40 } = {}){
  const positions = new Map();
  for (let i = 0; i < n; i++){
    const depth = Math.floor(Math.log2(i + 1));
    const levelStart = Math.pow(2, depth) - 1;
    const countAtLevel = Math.pow(2, depth);
    positions.set(i, { x: width * (i - levelStart + 0.5) / countAtLevel, y: marginY + depth * vGap });
  }
  return positions;
}

function heapSortSteps(){
  const items = generateValues(7);
  const valueOf = new Map(items.map(x => [x.id, x.value]));
  const order = items.map(x => x.id);
  let activeSize = order.length;

  const steps = [];
  const snap = (extra) => {
    const positions = computeHeapLayout(activeSize);
    const activeOrder = order.slice(0, activeSize);
    const nodes = activeOrder.map((id, i) => {
      const p = positions.get(i);
      return { id, value: valueOf.get(id), x: p.x, y: p.y };
    });
    const parents = new Map();
    activeOrder.forEach((id, i) => { if (i > 0) parents.set(id, activeOrder[Math.floor((i - 1) / 2)]); });
    return Object.assign({ nodes, parents, comparing: null, path: [], newNode: null, caption: '' }, extra);
  };

  steps.push(snap({ caption: `A binary heap is a complete tree where every parent is ≥ both children (a max-heap). This array isn't heap-ordered yet.` }));

  function siftDown(i){
    while (true){
      const l = 2 * i + 1, r = 2 * i + 2;
      let largest = i;
      if (l < activeSize && valueOf.get(order[l]) > valueOf.get(order[largest])) largest = l;
      if (r < activeSize && valueOf.get(order[r]) > valueOf.get(order[largest])) largest = r;

      const kids = [];
      if (l < activeSize) kids.push(order[l]);
      if (r < activeSize) kids.push(order[r]);
      steps.push(snap({ comparing: order[i], path: kids, caption: `Compare ${valueOf.get(order[i])} against its children — the larger value should sit on top.` }));

      if (largest === i) break;
      const a = order[i], b = order[largest];
      steps.push(snap({ comparing: b, path: [a], caption: `${valueOf.get(b)} > ${valueOf.get(a)} — swap; the bigger value rises toward the root.` }));
      order[i] = b; order[largest] = a;
      i = largest;
    }
  }

  for (let i = Math.floor(activeSize / 2) - 1; i >= 0; i--) siftDown(i);
  steps.push(snap({ caption: `Now it's a valid max-heap — the largest value always sits at the root.` }));

  while (activeSize > 1){
    const rootId = order[0], lastId = order[activeSize - 1];
    steps.push(snap({ comparing: rootId, path: [lastId], caption: `The root (${valueOf.get(rootId)}) is the largest remaining value — swap it to the end of the heap.` }));
    order[0] = lastId; order[activeSize - 1] = rootId;
    activeSize--;
    steps.push(snap({ caption: `${valueOf.get(rootId)} is now in its final sorted position. Shrink the heap and restore the max-heap property.` }));
    siftDown(0);
  }
  steps.push(snap({ caption: 'Sorted.' }));
  return steps;
}

/* ============================================================
   DEMO: AVL rotations — all four canonical imbalance shapes, each
   fixed to the same balanced 3-node result. Every act builds a
   brand-new tiny tree with fresh ids, so the previous act's nodes
   are simply absent from the next snapshot — same fade-out/fade-in
   lifecycle the linked-list lesson's act transitions already rely on.
   ============================================================ */
function avlRotationSteps(){
  const steps = [];
  const build = (values) => {
    let root = null;
    values.forEach(v => { root = insertPlainBST(root, v); });
    return root;
  };

  let root = build([30, 20, 10]);
  steps.push(snapshotTree(root, { caption: `Case 1 — Left-Left: three values inserted in decreasing order form a left-leaning chain. That's an AVL violation.` }));
  root = rotateRight(root, root, steps);
  steps.push(snapshotTree(root, { caption: `One right-rotation fixes it — balanced in a single step.` }));

  root = build([10, 20, 30]);
  steps.push(snapshotTree(root, { caption: `Case 2 — Right-Right: the mirror image. Increasing order forms a right-leaning chain.` }));
  root = rotateLeft(root, root, steps);
  steps.push(snapshotTree(root, { caption: `One left-rotation fixes it.` }));

  root = build([30, 10, 20]);
  steps.push(snapshotTree(root, { caption: `Case 3 — Left-Right: the left child is itself right-heavy — a "zigzag" shape. A single rotation won't fix this.` }));
  root = rotateLeft(root, root.left, steps);
  steps.push(snapshotTree(root, { caption: `First, rotate LEFT at the left child — that converts the zigzag into a plain Left-Left case.` }));
  root = rotateRight(root, root, steps);
  steps.push(snapshotTree(root, { caption: `Now rotate RIGHT at the root, exactly as in case 1 — balanced.` }));

  root = build([10, 30, 20]);
  steps.push(snapshotTree(root, { caption: `Case 4 — Right-Left: the mirror of case 3. The right child is itself left-heavy.` }));
  root = rotateRight(root, root.right, steps);
  steps.push(snapshotTree(root, { caption: `First, rotate RIGHT at the right child — converts it to a plain Right-Right case.` }));
  root = rotateLeft(root, root, steps);
  steps.push(snapshotTree(root, { caption: `Now rotate LEFT at the root, exactly as in case 2 — balanced. All four imbalance shapes reduce to these two fixes.` }));

  return steps;
}

/* ============================================================
   RENDERER: call stack — a plain HTML (not SVG) vertical list of
   frame chips. `column-reverse` means the FIRST DOM slot renders
   at the bottom (the root call) and later slots stack visually
   above it, matching how a real call stack is drawn. Motion's
   fadeTo works identically on HTML elements as SVG ones — nothing
   about it is SVG-specific.
   ============================================================ */
class CallStackRenderer{
  constructor({ maxDepth = 6 } = {}){
    this.maxDepth = maxDepth;
    this.frameEls = [];
  }

  mount(container){
    const wrap = document.createElement('div');
    wrap.className = 'callstack';
    for (let i = 0; i < this.maxDepth; i++){
      const frame = document.createElement('div');
      frame.className = 'callstack__frame';
      frame.style.opacity = 0;
      wrap.appendChild(frame);
      this.frameEls.push(frame);
    }
    container.appendChild(wrap);
  }

  renderStep(step, { duration, easing }){
    const frames = step.frames || [];
    this.frameEls.forEach((el, i) => {
      if (i < frames.length){
        el.textContent = frames[i];
        el.classList.toggle('is-active', i === frames.length - 1);
        Motion.fadeTo(el, 1, { duration, easing });
      } else {
        el.classList.remove('is-active');
        Motion.fadeTo(el, 0, { duration, easing });
      }
    });
  }
}

/* ============================================================
   DEMO: inorder traversal, tree + call stack side by side via
   SplitRenderer — the same composition lesson 11 (bubble vs.
   insertion) uses, just pairing a tree renderer with a totally
   different (HTML, not SVG) renderer instead of two of the same kind.
   ============================================================ */
function traversalSteps(){
  const values = [50, 30, 70, 20, 40, 60, 80];
  let root = null;
  values.forEach(v => { root = insertPlainBST(root, v); });

  const steps = [];
  const visitedIds = [];
  const callStack = [];

  const snap = (extra) => {
    const tree = snapshotTree(root, { path: visitedIds.slice() });
    return {
      left: Object.assign(tree, extra.tree || {}),
      right: { frames: callStack.slice() },
      caption: extra.caption || '',
    };
  };

  steps.push(snap({ caption: `Inorder traversal visits the left subtree, then the node itself, then the right subtree — for a BST, that always produces values in sorted order.` }));

  (function inorder(node){
    if (!node) return;
    callStack.push(`inorder(${node.value})`);
    steps.push(snap({ tree: { comparing: node.id }, caption: `Call inorder(${node.value}) — push a new stack frame.` }));

    if (node.left){
      steps.push(snap({ tree: { comparing: node.id }, caption: `${node.value} has a left child — recurse there first.` }));
      inorder(node.left);
    }

    visitedIds.push(node.id);
    steps.push(snap({ tree: { comparing: node.id }, caption: `Left side done — visit ${node.value} now (append it to the output).` }));

    if (node.right){
      steps.push(snap({ tree: { comparing: node.id }, caption: `Now recurse into ${node.value}'s right subtree.` }));
      inorder(node.right);
    }

    callStack.pop();
    steps.push(snap({ caption: `${node.value} is fully done — pop its frame and return to the caller.` }));
  })(root);

  steps.push(snap({ caption: `Done — inorder traversal of a BST always yields sorted order, straight out of the recursion's shape.` }));
  return steps;
}

/* ============================================================
   RENDERER: trie (extends the tree renderer). Nodes can have any
   number of children, so the layout is the tidy-tree centering
   idea generalized from "average of two children" to "midpoint of
   min/max child x" — still just a post-order pass. Adds one thing
   TreeGraphRenderer doesn't have: a label ON each edge (the
   character consumed along it), and a "word end" marker class.
   ============================================================ */
function computeTrieLayout(root, { hGap = 60, vGap = 66, marginX = 40, marginY = 40 } = {}){
  const slot = new Map();
  let counter = 0;
  (function firstPass(node, depth){
    const kids = Object.values(node.children);
    if (kids.length === 0){
      slot.set(node.id, { x: counter++, y: depth });
      return;
    }
    kids.forEach(c => firstPass(c, depth + 1));
    const xs = kids.map(c => slot.get(c.id).x);
    slot.set(node.id, { x: (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2, y: depth });
  })(root, 0);

  const positions = new Map();
  slot.forEach((s, id) => positions.set(id, { x: marginX + s.x * hGap, y: marginY + s.y * vGap }));
  return positions;
}

class TrieRenderer extends TreeGraphRenderer{
  mount(container){
    super.mount(container);
    const NS = 'http://www.w3.org/2000/svg';
    this.edgeLabelLayer = document.createElementNS(NS, 'g');
    this.svg.appendChild(this.edgeLabelLayer);
    this.edgeLabelEls = new Map();
  }

  renderStep(step, opts){
    super.renderStep(step, opts);
    this._renderEdgeLabels(step, opts);
    const wordEnd = new Set(step.wordEnd || []);
    this.nodeEls.forEach((rec, id) => rec.circle.classList.toggle('is-word-end', wordEnd.has(id)));
  }

  _renderEdgeLabels(step, { duration, easing }){
    const nodes = step.nodes || [];
    const posById = new Map(nodes.map(n => [n.id, n]));
    const parents = step.parents || new Map();
    const chars = step.chars || new Map();

    const activeIds = new Set();
    parents.forEach((parentId, id) => { if (parentId && posById.has(parentId) && posById.has(id)) activeIds.add(id); });

    this.edgeLabelEls.forEach((rec, id) => {
      if (activeIds.has(id)) return;
      Motion.fadeTo(rec.text, 0, { duration, easing });
      this.edgeLabelEls.delete(id);
      setTimeout(() => rec.text.remove(), duration + 30);
    });

    activeIds.forEach(id => {
      const parentId = parents.get(id);
      const a = posById.get(parentId), b = posById.get(id);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const isNew = !this.edgeLabelEls.has(id);
      if (isNew){
        const NS = 'http://www.w3.org/2000/svg';
        const text = document.createElementNS(NS, 'text');
        text.classList.add('trie-edge-label');
        text.textContent = chars.get(id) || '';
        text.style.opacity = 0;
        this.edgeLabelLayer.appendChild(text);
        text.style.transform = Motion.stringify(mid);
        this.edgeLabelEls.set(id, { text });
      }
      const rec = this.edgeLabelEls.get(id);
      Motion.moveTo(rec.text, mid, { duration, easing });
      Motion.fadeTo(rec.text, 1, { duration, easing });
    });
  }
}

function trieSteps(){
  const words = ['cat', 'car', 'card', 'dog', 'do'];
  let uid = 0;
  const makeNode = (char) => ({ id: 'tr' + (uid++), char, isEnd: false, children: {} });
  const root = makeNode('');
  const wordEndIds = new Set();
  const steps = [];

  const snap = (extra) => {
    const positions = computeTrieLayout(root);
    const nodes = [];
    const parents = new Map();
    const chars = new Map();
    (function walk(node, parentId){
      const pos = positions.get(node.id);
      nodes.push({ id: node.id, value: node.char, x: pos.x, y: pos.y });
      if (parentId){ parents.set(node.id, parentId); chars.set(node.id, node.char); }
      Object.values(node.children).forEach(c => walk(c, node.id));
    })(root, null);
    return Object.assign({
      nodes, parents, chars, comparing: null, path: [], newNode: null, wordEnd: Array.from(wordEndIds), caption: '',
    }, extra);
  };

  steps.push(snap({ caption: `A trie stores strings character by character — shared prefixes share the same path, branching only where words differ.` }));

  words.forEach(word => {
    let node = root;
    const path = [root.id];
    for (let i = 0; i < word.length; i++){
      const ch = word[i];
      if (node.children[ch]){
        node = node.children[ch];
        path.push(node.id);
        steps.push(snap({ comparing: node.id, path: path.slice(), caption: `"${ch}" already has a path here — reuse it. This is the shared-prefix savings.` }));
      } else {
        const child = makeNode(ch);
        node.children[ch] = child;
        node = child;
        path.push(node.id);
        steps.push(snap({ comparing: node.id, newNode: node.id, path: path.slice(), caption: `No "${ch}" here yet — create a new node.` }));
      }
    }
    node.isEnd = true;
    wordEndIds.add(node.id);
    steps.push(snap({ comparing: node.id, wordEnd: Array.from(wordEndIds), caption: `"${word}" is complete — mark this node as a word end.` }));
  });

  steps.push(snap({ caption: `${words.length} words inserted, sharing structure wherever their prefixes overlap.` }));

  function searchDemo(query, isPrefixCheck){
    let node = root;
    const path = [root.id];
    let found = true;
    for (let i = 0; i < query.length; i++){
      const ch = query[i];
      if (!node.children[ch]){ found = false; break; }
      node = node.children[ch];
      path.push(node.id);
      steps.push(snap({ comparing: node.id, path: path.slice(), caption: `Follow "${ch}"${i === query.length - 1 ? ' — that\'s the whole query.' : '.'}` }));
    }
    if (!found){
      steps.push(snap({ caption: `No path for "${query}" — it isn't in the trie, as a word or even a prefix.` }));
    } else if (isPrefixCheck){
      steps.push(snap({ path: path.slice(), caption: `"${query}" is a valid PREFIX — ${node.isEnd ? 'and it also happens to be a complete word.' : 'but not a complete word by itself.'}` }));
    } else {
      steps.push(snap({ path: path.slice(), caption: node.isEnd ? `"${query}" is a complete stored word.` : `"${query}" exists as a prefix, but isn't itself a stored word.` }));
    }
  }

  searchDemo('car', false);
  searchDemo('ca', true);

  return steps;
}

/* ============================================================
   RENDERER: general graph. Unlike the tree renderer, a node here
   can have any number of edges — so edges are an explicit list
   ({id, from, to}), not derived from a parent map. Everything else
   (FLIP lifecycle, Motion, Pulse) is the same vocabulary as every
   other renderer. Arrowheads reuse the independently-transformed
   triangle trick from LinkedListRenderer (never SVG markers — see
   that renderer's comment for why markers break under scaleX).
   Edge weight labels reuse the midpoint-label trick from
   TrieRenderer. `directed` and per-edge `.w` are both optional, so
   the same class serves an undirected unweighted graph (BFS/DFS),
   an undirected weighted graph (Dijkstra), and a directed DAG
   (topological sort).
   ============================================================ */
class GraphRenderer{
  constructor({ width = 640, height = 420, nodeRadius = 20, directed = false } = {}){
    this.width = width;
    this.height = height;
    this.nodeRadius = nodeRadius;
    this.directed = directed;
    this.nodeEls = new Map();
    this.edgeEls = new Map();
    this.arrowEls = new Map();
    this.weightEls = new Map();
    // Drag state
    this._drag = null;        // { id, ox, oy } offset at drag start
    this._posOverrides = new Map(); // id -> {x, y} override positions from drag
    this._lastStep = null;    // cached latest step for drag re-render
    this._dragRaf = null;
    this._didDrag = false;    // suppress inspect on pointerup-without-move
  }

  mount(container){
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${this.width} ${this.height}`);
    svg.classList.add('viz-svg');
    this.edgeLayer = document.createElementNS(NS, 'g');
    this.arrowLayer = document.createElementNS(NS, 'g');
    this.weightLayer = document.createElementNS(NS, 'g');
    this.nodeLayer = document.createElementNS(NS, 'g');
    svg.appendChild(this.edgeLayer);
    svg.appendChild(this.arrowLayer);
    svg.appendChild(this.weightLayer);
    svg.appendChild(this.nodeLayer);
    container.appendChild(svg);
    this.svg = svg;

    // Global pointer handlers for drag (attached to window so drag keeps working
    // if the pointer leaves the SVG during a fast move)
    this._onMove = (e) => this._moveDrag(e);
    this._onUp   = ()  => this._endDrag();
    window.addEventListener('pointermove', this._onMove);
    window.addEventListener('pointerup',   this._onUp);
  }

  // Convert a client-space pointer position to SVG viewBox coordinates.
  _svgPt(e){
    const rect = this.svg.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (this.width / rect.width),
      y: (e.clientY - rect.top)  * (this.height / rect.height),
    };
  }

  _startDrag(e, id){
    e.preventDefault();
    this._didDrag = false;
    const pt = this._svgPt(e);
    const cur = this._posOverrides.get(id) || (this._lastStep && this._lastStep.nodes.find(n => n.id === id)) || { x: 0, y: 0 };
    this._drag = { id, ox: cur.x - pt.x, oy: cur.y - pt.y };
    this.svg.classList.add('is-dragging');
  }

  _moveDrag(e){
    if (!this._drag) return;
    this._didDrag = true;
    const pt = this._svgPt(e);
    const x = Math.max(this.nodeRadius, Math.min(this.width  - this.nodeRadius, pt.x + this._drag.ox));
    const y = Math.max(this.nodeRadius, Math.min(this.height - this.nodeRadius, pt.y + this._drag.oy));
    this._posOverrides.set(this._drag.id, { x, y });

    cancelAnimationFrame(this._dragRaf);
    this._dragRaf = requestAnimationFrame(() => this._applyDrag());
  }

  _applyDrag(){
    if (!this._drag || !this._lastStep) return;
    const id = this._drag.id;
    const pos = this._posOverrides.get(id);

    // Move the dragged node instantly (no animation — it's tracking the pointer).
    const rec = this.nodeEls.get(id);
    if (rec) rec.g.style.transform = Motion.stringify({ x: pos.x, y: pos.y });

    // Build effective position map (base step + all overrides).
    const posById = new Map(this._lastStep.nodes.map(n => [n.id, n]));
    this._posOverrides.forEach((p, nid) => {
      const base = posById.get(nid);
      if (base) posById.set(nid, { ...base, ...p });
    });

    // Spring-follow edges connected to the dragged node.
    const SPRING = { duration: 80, easing: EASE.spring };
    this._lastStep.edges && this._lastStep.edges.forEach(e => {
      if (e.from !== id && e.to !== id) return;
      const a = posById.get(e.from), b = posById.get(e.to);
      if (!a || !b) return;
      const t = this._edgeTransform(a, b);
      const line = this.edgeEls.get(e.id);
      if (line) Motion.moveTo(line, t, SPRING);
      if (this.directed){
        const rad = t.angle * Math.PI / 180;
        const tip = { x: t.x + t.scaleX * Math.cos(rad), y: t.y + t.scaleX * Math.sin(rad), angle: t.angle };
        const tri = this.arrowEls.get(e.id);
        if (tri) Motion.moveTo(tri, tip, SPRING);
      }
      if (e.w != null){
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const wt = this.weightEls.get(e.id);
        if (wt) Motion.moveTo(wt, mid, SPRING);
      }
    });
  }

  _endDrag(){
    if (!this._drag) return;
    this._drag = null;
    this.svg.classList.remove('is-dragging');
  }

  _edgeTransform(fromPos, toPos){
    const dx = toPos.x - fromPos.x, dy = toPos.y - fromPos.y;
    const dist = Math.hypot(dx, dy) || 1;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const r = this.nodeRadius;
    return {
      x: fromPos.x + (r / dist) * dx,
      y: fromPos.y + (r / dist) * dy,
      angle,
      scaleX: Math.max(dist - 2 * r, 0),
      scaleY: 1,
    };
  }

  _makeNode(id, label){
    const NS = 'http://www.w3.org/2000/svg';
    const g = document.createElementNS(NS, 'g');
    g.classList.add('gnode');
    g.style.opacity = 0;
    const pulse = document.createElementNS(NS, 'g');
    pulse.classList.add('gnode-pulse');
    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('r', this.nodeRadius);
    circle.classList.add('gnode-circle');
    const text = document.createElementNS(NS, 'text');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dy', '0.32em');
    text.classList.add('gnode-label');
    text.textContent = label;
