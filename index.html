<style>

/* ============================================================
   1. TOKENS — palette, fonts, easing curves, spacing + type
      scale. JS reads the --ease-* vars at runtime for WAAPI.
   ============================================================ */
:root{
  --bg: #0a0e14;
  --panel: #12161f;
  --panel-raised: #161b26;
  --hairline: #1c2430;
  --hairline-strong: #29344333;
  --text: #e8e6e1;
  --text-dim: #8b93a1;
  --amber: #ff9f1c;
  --cyan: #4fd1c5;
  --success: #7ee787;
  --danger: #ef4444;

  --exp-color: #ff3d9a;

  --compare-color: var(--amber);
  --swap-color: var(--danger);
  --sorted-color: var(--success);

  --font-display: 'Rajdhani', sans-serif;
  --font-body: 'Source Serif 4', Georgia, serif;
  --font-mono: 'IBM Plex Mono', 'Consolas', monospace;

  /* Named easing set — no linear, no default ease anywhere. */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out-quart:cubic-bezier(0.25, 1, 0.5, 1);

  /* Spacing rhythm — 4px base, used everywhere instead of ad-hoc px. */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  /* Type scale — ~1.25 ratio off a 16px base. */
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-md: 1.125rem;
  --text-lg: 1.375rem;
  --text-xl: 1.75rem;
  --text-2xl: 2.25rem;
}

/* ============================================================
   2. RESET + BASE
   ============================================================ */
*, *::before, *::after{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--hairline) 1px, transparent 1px),
    linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--text-base);
}

/* radial vignette so panels read as the brightest thing on screen */
body::before{
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 20%, transparent 0%, transparent 45%, rgba(5,7,11,0.5) 100%);
  z-index: 1;
}

/* ============================================================
   3. APP SHELL — sidebar, main, mobile drawer
   ============================================================ */
.shell{ display: flex; align-items: flex-start; min-height: 100vh; position: relative; }

.sidebar{
  flex: 0 0 288px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  background: var(--panel);
  border-right: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  z-index: 20;
}

.sidebar__header{
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-5) var(--space-4) var(--space-4);
  border-bottom: 1px solid var(--hairline);
}

.sidebar__title{
  flex: 1;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--text-md);
  letter-spacing: 0.01em;
  line-height: 1.2;
}
.sidebar__title small{
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.14em;
  color: var(--cyan);
  text-transform: uppercase;
  margin-top: 2px;
}

.palette-hint{
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-dim);
  background: var(--panel-raised);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 150ms var(--ease-out-quart), color 150ms var(--ease-out-quart);
}
.palette-hint:hover{ border-color: var(--amber); color: var(--amber); }

.progress-ring circle{ fill: none; stroke-width: 3; }
.progress-ring__track{ stroke: var(--hairline-strong); }
.progress-ring__fill{
  stroke: var(--success);
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: center;
  transition: stroke-dashoffset 300ms var(--ease-out-quart);
}

.sidebar__nav{ flex: 1; overflow-y: auto; padding: var(--space-3) 0 var(--space-6); }

.nav-part__header{
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
}
.nav-part__header:hover{ color: var(--text); }
.nav-part__chevron{ display: inline-flex; transition: transform 180ms var(--ease-out-quart); }
.nav-part.is-collapsed .nav-part__chevron{ transform: rotate(-90deg); }
.nav-part.is-collapsed .nav-part__list{ display: none; }

.nav-part__list{ list-style: none; margin: 0; padding: 0 0 var(--space-2); }

.nav-link{
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4) var(--space-2) var(--space-6);
  color: var(--text-dim);
  text-decoration: none;
  font-size: var(--text-sm);
  border-left: 2px solid transparent;
}
.nav-link:hover{ color: var(--text); background: var(--panel-raised); }
.nav-link.is-active{ color: var(--amber); border-left-color: var(--amber); background: var(--panel-raised); }
.nav-link__dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--hairline-strong); flex-shrink: 0; }
.nav-link.is-complete .nav-link__dot{ background: var(--success); }
.nav-link.is-stub{ opacity: 0.5; }

.hamburger{
  display: none;
  position: fixed;
  top: var(--space-4);
  left: var(--space-4);
  z-index: 30;
  width: 40px;
  height: 40px;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  border: 1px solid var(--hairline-strong);
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
}

.scrim{
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(5,7,11,0.6);
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms var(--ease-out-quart);
  z-index: 15;
}
.scrim.is-open{ opacity: 1; pointer-events: auto; }

.main{ flex: 1; min-width: 0; padding: var(--space-6) var(--space-7) var(--space-8); position: relative; z-index: 2; }

/* ============================================================
   4. LESSON HEADER + CONTENT GRID
   ============================================================ */
.lesson-header{ max-width: 920px; margin-bottom: var(--space-6); }
.lesson-header__part{
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--cyan);
}
.lesson-header h1{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--text-2xl);
  letter-spacing: 0.01em;
  margin: var(--space-2) 0 var(--space-3);
}
.lesson-header p{
  color: var(--text-dim);
  font-size: var(--text-md);
  max-width: 62ch;
  margin: 0 0 var(--space-4);
}

.mark-complete{
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text);
  background: var(--panel-raised);
  border: 1px solid var(--hairline-strong);
  border-radius: 4px;
  padding: var(--space-2) var(--space-4);
  cursor: pointer;
  transition: border-color 150ms var(--ease-out-quart), color 150ms var(--ease-out-quart);
}
.mark-complete:hover{ border-color: var(--success); }
.mark-complete.is-complete{ color: var(--success); border-color: var(--success); }

.content{
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  grid-template-areas: "canvas code" "meta code";
  gap: var(--space-6);
  align-items: start;
}
.content__canvas{ grid-area: canvas; max-width: 760px; }
.content__meta{ grid-area: meta; max-width: 760px; }
.content__code{ grid-area: code; }

/* ============================================================
   5. PANEL (instrument-bezel frame around the SVG canvas)
   ============================================================ */
.panel{
  position: relative;
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  padding: 28px 24px 20px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.03) inset,
    0 24px 48px -24px rgba(0,0,0,0.6);
}

.panel__ticks span{
  position: absolute;
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--amber);
  opacity: 0.55;
}
.panel__ticks span:nth-child(1){ top: -1px; left: -1px; border-right: none; border-bottom: none; }
.panel__ticks span:nth-child(2){ top: -1px; right: -1px; border-left: none; border-bottom: none; }
.panel__ticks span:nth-child(3){ bottom: -1px; left: -1px; border-right: none; border-top: none; }
.panel__ticks span:nth-child(4){ bottom: -1px; right: -1px; border-left: none; border-top: none; }

.viz-mount{ width: 100%; }
.viz-mount svg{ width: 100%; height: auto; display: block; }

/* -- array bars -- */
.bar{ will-change: transform; transform-box: fill-box; }
.bar-fill{ fill: var(--panel-raised); stroke: var(--hairline-strong); stroke-width: 1; }
.bar-fill--ghost{ fill: none; stroke: var(--hairline-strong); stroke-dasharray: 4 3; }
.bar-overlay{ will-change: opacity; pointer-events: none; }
.bar-label{ font-family: var(--font-mono); font-size: 13px; fill: var(--text-dim); }
.bar-address{ font-family: var(--font-mono); font-size: 10px; fill: var(--text-dim); opacity: 0.75; }

/* -- growth bars (Big-O) -- */
.growth-bar{ will-change: transform, opacity; }
.growth-bar__fill{ transform-box: fill-box; transform-origin: 50% 100%; will-change: transform; }
.growth-bar__value{ will-change: transform, opacity; transform-box: fill-box; }
.growth-bar__value text{ font-family: var(--font-mono); font-size: 11px; fill: var(--text); text-anchor: middle; }
.growth-bar__label{ font-family: var(--font-mono); font-size: 12px; text-anchor: middle; }

/* -- tree nodes + edges -- */
.tedge{
  stroke: var(--hairline-strong);
  stroke-width: 2;
  will-change: transform, opacity;
  transform-box: fill-box;
  transform-origin: 0% 50%;
}
.tedge.is-path{ stroke: var(--cyan); stroke-width: 2.5; }

.tnode{ will-change: transform, opacity; transform-box: fill-box; }
.tnode-pulse{ transform-box: fill-box; will-change: transform; }

.tnode-circle{
  fill: var(--panel-raised);
  stroke: var(--hairline-strong);
  stroke-width: 1.5;
  transition: fill 150ms var(--ease-out-quart), stroke 150ms var(--ease-out-quart);
}
.tnode-circle.is-path{ fill: rgba(79, 209, 197, 0.16); stroke: var(--cyan); }
.tnode-circle.is-comparing{ fill: rgba(255, 159, 28, 0.2); stroke: var(--amber); stroke-width: 2; }
.tnode-circle.is-new{ stroke: var(--success); }

.tnode-label{ font-family: var(--font-mono); font-size: 14px; fill: var(--text); pointer-events: none; }

/* -- linked list arrows + pointer tags -- */
.tedge--arrow-fwd{ stroke: var(--cyan); }
.tedge--back{ stroke: var(--amber); stroke-dasharray: 3 3; }
.ll-arrowhead{ will-change: transform, opacity; }
.ptr-tag{ will-change: transform, opacity; transform-box: fill-box; }
.ptr-tag__bg{ fill: var(--panel); stroke: var(--hairline-strong); stroke-width: 1; }
.ptr-tag__label{ font-family: var(--font-mono); font-size: 10px; fill: var(--text); text-anchor: middle; }

/* -- hash table buckets -- */
.hash-bucket-cell{ fill: var(--panel-raised); stroke: var(--hairline-strong); stroke-width: 1; }
.hash-bucket-label{ font-family: var(--font-mono); font-size: 11px; fill: var(--text-dim); text-anchor: middle; }

/* -- split view (two renderers, one shared timeline) -- */
.split-viz{ display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
.split-viz__col{ display: flex; flex-direction: column; }
.split-viz__label{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: var(--space-2);
}

/* -- merge-tree chip nodes -- */
.mtnode{ will-change: transform, opacity; transform-box: fill-box; }
.mtnode-rect{
  fill: var(--panel-raised);
  stroke: var(--hairline-strong);
  stroke-width: 1.5;
  transition: fill 150ms var(--ease-out-quart), stroke 150ms var(--ease-out-quart);
}
.mtnode-rect.is-path{ fill: rgba(79, 209, 197, 0.16); stroke: var(--cyan); }
.mtnode-rect.is-comparing{ fill: rgba(255, 159, 28, 0.2); stroke: var(--amber); stroke-width: 2; }
.mtnode-rect.is-new{ stroke: var(--success); }
.mtnode-label{ font-family: var(--font-mono); font-size: 11.5px; fill: var(--text); pointer-events: none; }

@media (max-width: 700px){
  .split-viz{ grid-template-columns: 1fr; }
}

/* -- call stack (HTML, not SVG) -- */
.callstack{
  display: flex;
  flex-direction: column-reverse;
  gap: var(--space-2);
  min-height: 260px;
  padding: var(--space-2);
}
.callstack__frame{
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  background: var(--panel-raised);
  border: 1px solid var(--hairline-strong);
  border-radius: 4px;
  padding: var(--space-2) var(--space-3);
  will-change: opacity;
}
.callstack__frame.is-active{ color: var(--text); border-color: var(--amber); background: rgba(255, 159, 28, 0.12); }

/* -- trie edge labels + word-end marker -- */
.trie-edge-label{
  font-family: var(--font-mono);
  font-size: 12px;
  fill: var(--amber);
  text-anchor: middle;
  will-change: transform, opacity;
  transform-box: fill-box;
}
.tnode-circle.is-word-end{ stroke-width: 3; }

/* -- general graph (nodes/edges/arrows/weights) -- */
.gnode{ will-change: transform, opacity; transform-box: fill-box; }
.gnode-pulse{ transform-box: fill-box; will-change: transform; }
.gnode-circle{
  fill: var(--panel-raised);
  stroke: var(--hairline-strong);
  stroke-width: 1.5;
  transition: fill 150ms var(--ease-out-quart), stroke 150ms var(--ease-out-quart);
}
.gnode-circle.is-frontier{ fill: rgba(79, 209, 197, 0.16); stroke: var(--cyan); }
.gnode-circle.is-comparing{ fill: rgba(255, 159, 28, 0.2); stroke: var(--amber); stroke-width: 2; }
.gnode-circle.is-visited{ fill: rgba(126, 231, 135, 0.14); stroke: var(--success); }
.gnode-label{ font-family: var(--font-mono); font-size: 14px; fill: var(--text); pointer-events: none; }

.gedge{
  stroke: var(--hairline-strong);
  stroke-width: 2;
  will-change: transform, opacity;
  transform-box: fill-box;
  transform-origin: 0% 50%;
}
.gedge-arrow{ fill: var(--hairline-strong); will-change: transform, opacity; }
.gedge-weight{
  font-family: var(--font-mono);
  font-size: 11px;
  fill: var(--amber);
  text-anchor: middle;
  will-change: transform, opacity;
  transform-box: fill-box;
}

/* -- adjacency-list panel (HTML) -- */
.adjlist{ display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-2); }
.adjlist__row{
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  background: var(--panel-raised);
  border: 1px solid var(--hairline-strong);
  border-radius: 4px;
  padding: var(--space-2) var(--space-3);
  will-change: opacity;
}
.adjlist__row.is-active{ color: var(--text); border-color: var(--cyan); }

/* -- Dijkstra panel (HTML) -- */
.dijkstra-panel{ display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-2); }
.dijkstra-panel__title{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: var(--space-2);
}
.dijkstra-table{ display: flex; flex-direction: column; gap: 4px; }
.dijkstra-row{
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  background: var(--panel-raised);
  border: 1px solid var(--hairline-strong);
  border-radius: 4px;
  padding: 5px var(--space-3);
}
.dijkstra-row.is-settled{ color: var(--success); border-color: var(--success); }
.dijkstra-row.is-active{ color: var(--text); border-color: var(--amber); }
.dijkstra-pq{ display: flex; flex-direction: column; gap: 4px; }
.dijkstra-pq__item{
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  background: var(--panel-raised);
  border: 1px solid var(--hairline-strong);
  border-radius: 4px;
  padding: 5px var(--space-3);
}
.dijkstra-pq__item.is-active{ color: var(--text); border-color: var(--amber); background: rgba(255, 159, 28, 0.12); }

/* -- DP grid -- */
.grid-header{ font-family: var(--font-mono); font-size: 12px; fill: var(--text-dim); }
.grid-cell-outer{ will-change: transform; }
.grid-cell-pop{ transform-box: fill-box; will-change: transform; }
.grid-cell-pulse{ transform-box: fill-box; will-change: transform; }
.grid-cell{
  fill: var(--panel-raised);
  stroke: var(--hairline-strong);
  stroke-width: 1.5;
  transition: fill 150ms var(--ease-out-quart), stroke 150ms var(--ease-out-quart);
}
.grid-cell--empty{ fill: none; stroke: var(--hairline-strong); stroke-dasharray: 4 3; }
.grid-cell.is-dep{ stroke: var(--cyan); fill: rgba(79, 209, 197, 0.14); }
.grid-cell.is-computing{ stroke: var(--amber); stroke-width: 2; fill: rgba(255, 159, 28, 0.2); }
.grid-cell-value{ font-family: var(--font-mono); font-size: 15px; fill: var(--text); pointer-events: none; }

.caption{
  will-change: opacity;
  margin: 0 0 var(--space-4);
  min-height: 22px;
  font-family: var(--font-mono);
  font-size: 13.5px;
  color: var(--text);
}
.caption::before{ content: "› "; color: var(--cyan); }

/* ============================================================
   6. TRANSPORT BAR
   ============================================================ */
.transport{
  margin-top: var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  padding: var(--space-3) var(--space-4);
}

.transport__btn{
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--text);
  background: var(--panel-raised);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  width: 36px;
  height: 32px;
  cursor: pointer;
  transition: border-color 150ms var(--ease-out-quart), color 150ms var(--ease-out-quart);
}
.transport__btn:hover{ border-color: var(--amber); color: var(--amber); }
.transport__btn--primary{ color: var(--amber); border-color: var(--hairline-strong); }

.transport input[type="range"]{ flex: 1; accent-color: var(--amber); cursor: pointer; }

.transport__counter{
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-dim);
  min-width: 56px;
  text-align: right;
}

.transport__speed{
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.transport__speed select{
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text);
  background: var(--panel-raised);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 4px 6px;
}

/* ============================================================
   7. COMPLEXITY TABLE
   ============================================================ */
.complexity-table{
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: var(--text-sm);
}
.complexity-table th, .complexity-table td{
  border: 1px solid var(--hairline);
  padding: var(--space-2) var(--space-3);
  text-align: center;
}
.complexity-table thead th{
  color: var(--text-dim);
  font-weight: 400;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.08em;
}
.complexity-table tbody th{ text-align: left; color: var(--text-dim); font-weight: 400; }

.note{
  margin-top: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-left: 2px solid var(--hairline-strong);
  background: var(--panel-raised);
  border-radius: 0 4px 4px 0;
}
.note__label{
  margin: 0 0 var(--space-1);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.note__body{ margin: 0; font-size: var(--text-sm); color: var(--text); line-height: 1.5; }
.note--use{ border-left-color: var(--cyan); }
.note--use .note__label{ color: var(--cyan); }
.note--gotcha{ border-left-color: var(--amber); }
.note--gotcha .note__label{ color: var(--amber); }

/* ============================================================
   8. CODE PANEL + syntax token colors
   ============================================================ */
.code-panel{
  background: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  overflow: hidden;
  position: sticky;
  top: var(--space-6);
}
.code-panel__tabs{ display: flex; border-bottom: 1px solid var(--hairline); }
.code-tab{
  flex: 1;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: var(--space-3) var(--space-2);
  cursor: pointer;
}
.code-tab:hover{ color: var(--text); }
.code-tab.is-active{ color: var(--amber); border-bottom-color: var(--amber); }

.code-panel__pre{ margin: 0; padding: var(--space-4); overflow: auto; max-height: 560px; }
.code-panel__code{ font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; color: var(--text); white-space: pre; }

.tok-comment{ color: var(--text-dim); font-style: italic; }
.tok-string{ color: var(--success); }
.tok-number{ color: var(--cyan); }
.tok-keyword{ color: var(--amber); }
.tok-preproc{ color: var(--danger); }

/* ============================================================
   9. STUB LESSON PLACEHOLDER
   ============================================================ */
.stub{
  padding: var(--space-8) var(--space-6);
  border: 1px dashed var(--hairline-strong);
  border-radius: 6px;
  text-align: center;
  color: var(--text-dim);
  max-width: 760px;
}
.stub__kicker{
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--cyan);
  margin: 0 0 var(--space-3);
}
.stub h2{ font-family: var(--font-display); color: var(--text); font-size: var(--text-xl); margin: 0 0 var(--space-2); }
.stub p{ margin: 0; }

/* ============================================================
   10. COMMAND PALETTE
   ============================================================ */
.palette{
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  justify-content: center;
  padding-top: 12vh;
  opacity: 0;
  pointer-events: none;
  transition: opacity 160ms var(--ease-out-quart);
}
.palette.is-open{ opacity: 1; pointer-events: auto; }
.palette__backdrop{ position: absolute; inset: 0; background: rgba(5,7,11,0.72); }
.palette__panel{
  position: relative;
  width: min(560px, 90vw);
  max-height: 60vh;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--hairline-strong);
  border-radius: 8px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  transform: translateY(-8px) scale(0.98);
  transition: transform 200ms var(--ease-spring);
  overflow: hidden;
}
.palette.is-open .palette__panel{ transform: translateY(0) scale(1); }
.palette__input{
  border: none;
  border-bottom: 1px solid var(--hairline);
  background: none;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: var(--text-md);
  padding: var(--space-4);
  outline: none;
}
.palette__input::placeholder{ color: var(--text-dim); }
.palette__results{ list-style: none; margin: 0; padding: var(--space-2) 0; overflow-y: auto; }
.palette__item{ display: flex; gap: var(--space-3); align-items: baseline; padding: var(--space-2) var(--space-4); cursor: pointer; font-size: var(--text-sm); }
.palette__item-part{ font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; min-width: 110px; }
.palette__item.is-selected{ background: var(--panel-raised); color: var(--amber); }
.palette__empty{ padding: var(--space-4); color: var(--text-dim); font-size: var(--text-sm); text-align: center; }

/* ============================================================
   11. RESPONSIVE + REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  .transport__btn, .mark-complete, .palette-hint{ transition: none; }
  .tnode-circle{ transition: none; }
  .sidebar, .scrim, .palette, .palette__panel, .nav-part__chevron, .progress-ring__fill{ transition: none; }
}

@media (max-width: 960px){
  .hamburger{ display: flex; }
  .sidebar{
    position: fixed;
    top: 0;
    left: 0;
    width: 288px;
    transform: translateX(-100%);
    transition: transform 420ms var(--ease-spring);
  }
  .sidebar.is-open{ transform: translateX(0); }
  .scrim{ display: block; }
  .main{ padding: calc(var(--space-8) + 8px) var(--space-4) var(--space-8); }
  .content{ grid-template-columns: 1fr; grid-template-areas: "canvas" "meta" "code"; }
  .code-panel{ position: static; }
}

@media (max-width: 560px){
  .lesson-header h1{ font-size: var(--text-xl); }
  .transport{ flex-wrap: wrap; }
  .transport input[type="range"]{ order: 3; flex-basis: 100%; }
}

/* ============================================================
   12. INPUT BAR — editable controls above each visualization
   ============================================================ */
.input-bar{
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
  font-family: var(--font-mono);
}
.input-bar__label{
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  white-space: nowrap;
  flex-shrink: 0;
}
.input-bar__field{
  font-size: var(--text-sm);
  color: var(--text);
  background: var(--panel-raised);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 5px 10px;
  flex: 1;
  min-width: 140px;
  max-width: 340px;
}
.input-bar__field:focus{ outline: none; border-color: var(--amber); }
.input-bar__field.is-invalid{
  border-color: var(--danger);
  animation: shake 220ms var(--ease-out-expo);
}
.input-bar__btn{
  font-size: var(--text-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--panel-raised);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 5px 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 150ms var(--ease-out-quart), color 150ms var(--ease-out-quart);
}
.input-bar__btn:hover{ border-color: var(--amber); color: var(--amber); }
.input-bar__btn.is-race{ margin-left: auto; }
.input-bar__btn.is-race:hover{ border-color: var(--cyan); color: var(--cyan); }

@keyframes shake{
  0%,100%{ transform: translateX(0); }
  25%{ transform: translateX(-5px); }
  75%{ transform: translateX(5px); }
}

/* ============================================================
   13. INSPECT TOOLTIP — click-to-inspect floating overlay
   ============================================================ */
.inspect-tip{
  position: fixed;
  z-index: 60;
  background: var(--panel);
  border: 1px solid var(--hairline-strong);
  border-radius: 6px;
  padding: var(--space-2) var(--space-3);
  pointer-events: none;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.7;
  color: var(--text);
  box-shadow: 0 8px 24px -8px rgba(0,0,0,0.6);
  max-width: 200px;
  opacity: 0;
  transition: opacity 100ms var(--ease-out-quart);
  white-space: nowrap;
}
.inspect-tip.is-visible{ opacity: 1; }
.inspect-tip__header{
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 2px;
}
.inspect-tip__key{ color: var(--text-dim); }

/* ============================================================
   14. RACE MODE OVERLAY
   ============================================================ */
.race-overlay{
  position: fixed;
  inset: 0;
  z-index: 90;
  background: var(--bg);
  background-image:
    linear-gradient(var(--hairline) 1px, transparent 1px),
    linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
  background-size: 32px 32px;
  overflow: hidden;
  display: none;
  flex-direction: column;
  gap: var(--space-4);
  padding: var(--space-5);
}
.race-overlay.is-open{ display: flex; }
.race-header{
  display: flex;
  align-items: center;
  gap: var(--space-4);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.race-header__title{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--text-xl);
  letter-spacing: 0.01em;
}
.race-config{
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.race-config label{ display: flex; align-items: center; gap: var(--space-2); }
.race-config select{
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text);
  background: var(--panel-raised);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 4px 8px;
  text-transform: none;
}
.race-body{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-5);
  flex: 1;
  min-height: 0;
}
.race-col__label{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: var(--space-2);
}
.race-col .panel{ height: calc(100% - 24px); }
.race-col .viz-mount{ height: 100%; }
.race-col .viz-mount svg{ height: 100%; }
.race-viz svg{ width: 100%; height: 100%; display: block; }
.race-footer{ flex-shrink: 0; }
.race-footer .transport{ margin: 0; }
.race-caption{ font-family: var(--font-mono); font-size: 13px; color: var(--text); min-height: 20px; margin-bottom: var(--space-3); }
.race-caption::before{ content: "› "; color: var(--cyan); }

/* Race mode dynamic elements */
.race-title{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--text-xl);
  letter-spacing: 0.01em;
  flex: 1;
}
.race-close{
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 1px solid var(--hairline); border-radius: 6px;
  color: var(--text-dim); font-size: 18px; cursor: pointer;
  transition: color 150ms, border-color 150ms;
}
.race-close:hover{ color: var(--text); border-color: var(--hairline-strong); }

.race-selectors{
  display: flex; align-items: center; gap: var(--space-3); flex-shrink: 0;
  flex-wrap: wrap; font-family: var(--font-mono); font-size: var(--text-xs);
}
.race-sel-group{ display: flex; align-items: center; gap: var(--space-2); }
.race-sel-label{ color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.race-sel{
  font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text);
  background: var(--panel-raised); border: 1px solid var(--hairline);
  border-radius: 4px; padding: 4px 8px;
}
.race-rebuild-btn{
  font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text);
  background: var(--panel-raised); border: 1px solid var(--hairline); border-radius: 4px;
  padding: 5px 12px; cursor: pointer; transition: border-color 150ms;
}
.race-rebuild-btn:hover{ border-color: var(--amber); }

.race-col{
  display: flex; flex-direction: column; gap: var(--space-2); min-height: 0;
}
.race-col-label{
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--cyan); text-align: center;
}
.race-viz{
  flex: 1; min-height: 0; background: var(--panel); border-radius: 6px;
  border: 1px solid var(--hairline); overflow: hidden; position: relative;
}
.race-viz svg{ width: 100%; height: 100%; display: block; }
.race-col-counter{
  font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);
  text-align: center; letter-spacing: 0.04em;
}
.race-col-counter.is-done{ color: var(--success); }

.race-transport{
  flex-shrink: 0; display: flex; align-items: center;
  justify-content: center; gap: var(--space-3);
}
.race-btn{
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  background: var(--panel-raised); border: 1px solid var(--hairline);
  border-radius: 8px; color: var(--text); cursor: pointer;
  transition: border-color 150ms, background 150ms;
}
.race-btn:hover{ border-color: var(--hairline-strong); }
.race-btn--primary{ background: var(--amber); border-color: var(--amber); color: #000; width: 44px; height: 44px; }
.race-btn--primary:hover{ background: var(--amber-dim, #ca8a04); border-color: var(--amber-dim, #ca8a04); }

/* Draggable graph nodes */
.gnode{ cursor: grab; }
.is-dragging .gnode{ cursor: grabbing; }

/* Screen-reader only caption fed from aria-live */
.viz-caption-sr{
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

/* ============================================================
   15. MICRO-INTERACTIONS — active/focus states, motion polish
   ============================================================ */

/* Unified :focus-visible ring — replaces browser defaults everywhere */
:focus-visible{
  outline: 2px solid var(--amber);
  outline-offset: 2px;
  border-radius: 3px;
}
/* Suppress focus ring on mouse/touch (only show for keyboard) */
:focus:not(:focus-visible){ outline: none; }

/* Transport buttons: active press sink + scale */
.transport__btn{
  transition:
    border-color 150ms var(--ease-out-quart),
    color        150ms var(--ease-out-quart),
    transform    100ms var(--ease-out-quart),
    box-shadow   150ms var(--ease-out-quart);
}
.transport__btn:hover{
  border-color: var(--amber);
  color: var(--amber);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 14%, transparent);
}
.transport__btn:active{ transform: scale(0.93); }
.transport__btn--primary:hover{
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 22%, transparent);
}

/* Scrubber thumb — subtle glow on hover */
.transport input[type="range"]{
  transition: none;
}
.transport input[type="range"]:hover{ accent-color: var(--amber); }

/* Input bar buttons */
.input-bar__btn{
  transition:
    border-color 150ms var(--ease-out-quart),
    color        150ms var(--ease-out-quart),
    transform    80ms  var(--ease-out-quart),
    box-shadow   150ms var(--ease-out-quart);
}
.input-bar__btn:active{ transform: scale(0.94); }
.input-bar__btn:hover{
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 14%, transparent);
}
.input-bar__btn.is-race:hover{
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 16%, transparent);
}

/* Mark-complete */
.mark-complete{
  transition:
    border-color 150ms var(--ease-out-quart),
    color        150ms var(--ease-out-quart),
    transform    80ms  var(--ease-out-quart),
    box-shadow   150ms var(--ease-out-quart);
}
.mark-complete:active{ transform: scale(0.95); }
.mark-complete:hover{
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 16%, transparent);
}

/* Nav links */
.nav-link{ transition: color 120ms, background 120ms, border-left-color 120ms; }

/* Race buttons */
.race-btn{
  transition:
    border-color 150ms var(--ease-out-quart),
    background   150ms var(--ease-out-quart),
    transform    80ms  var(--ease-out-quart),
    box-shadow   150ms var(--ease-out-quart);
}
.race-btn:hover{ box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 16%, transparent); }
.race-btn:active{ transform: scale(0.92); }
.race-btn--primary:active{ transform: scale(0.94); }

/* Speed/algo selects */
.transport__speed select,
.race-sel{
  transition: border-color 150ms var(--ease-out-quart);
  cursor: pointer;
}
.transport__speed select:hover,
.race-sel:hover{ border-color: var(--amber); }

/* Theme toggle button */
.theme-toggle{
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0;
  background: none;
  border: 1px solid var(--hairline);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  flex-shrink: 0;
  transition:
    color        150ms var(--ease-out-quart),
    border-color 150ms var(--ease-out-quart),
    transform    80ms  var(--ease-out-quart);
}
.theme-toggle:hover{ color: var(--text); border-color: var(--hairline-strong); }
.theme-toggle:active{ transform: scale(0.9) rotate(20deg); }

/* Sound toggle */
.sound-toggle{
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0;
  background: none;
  border: 1px solid var(--hairline);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  flex-shrink: 0;
  transition:
    color        150ms var(--ease-out-quart),
    border-color 150ms var(--ease-out-quart),
    transform    80ms  var(--ease-out-quart);
}
.sound-toggle:hover{ color: var(--text); border-color: var(--hairline-strong); }
.sound-toggle:active{ transform: scale(0.9); }
.sound-toggle.is-on{ color: var(--cyan); border-color: var(--cyan); }

/* ============================================================
   16. LIGHT THEME — single custom-property swap
   ============================================================ */
[data-theme="light"]{
  --bg: #f4f1eb;
  --panel: #ffffff;
  --panel-raised: #f7f5f0;
  --hairline: #d9d4c8;
  --hairline-strong: #c8c1b0;
  --text: #1a1a1a;
  --text-dim: #666055;
  --amber: #c47c00;
  --cyan: #0f7c72;
  --success: #1a7f37;
  --danger: #b91c1c;
  --exp-color: #b5006e;
  --compare-color: var(--amber);
  --swap-color: var(--danger);
  --sorted-color: var(--success);
}

[data-theme="light"] body{
  background-image:
    linear-gradient(var(--hairline) 1px, transparent 1px),
    linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
}

[data-theme="light"] body::before{
  background: radial-gradient(ellipse at 50% 20%, transparent 0%, transparent 45%, rgba(220,210,190,0.4) 100%);
}

/* ============================================================
   17. PRINT — snapshot current step, hide chrome
   ============================================================ */
@media print{
  .hamburger, .scrim, .sidebar, .transport, .input-bar,
  .race-overlay, .palette, .inspect-tip,
  .mark-complete, .code-panel, .content__code,
  .sound-toggle, .theme-toggle{ display: none !important; }

  body{
    background: #fff !important;
    background-image: none !important;
    color: #000 !important;
  }
  body::before{ display: none; }

  .shell{ display: block; }
  .main{ padding: 1cm; }

  .lesson-header h1{ font-size: 22pt; }
  .lesson-header p{ color: #444; }

  .panel{
    border: 1px solid #ccc;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .content{ display: block; }
  .content__canvas{ max-width: 100%; }
  .content__meta{ max-width: 100%; margin-top: 16pt; }

  /* Freeze SVG animations at current frame */
  svg *{ animation: none !important; transition: none !important; }

  .panel__ticks{ display: none; }
}

/* ============================================================
   18. 375px MOBILE — canvas stays fully usable
   ============================================================ */
@media (max-width: 400px){
  .main{ padding: calc(var(--space-8) + 4px) var(--space-3) var(--space-6); }

  .lesson-header h1{ font-size: var(--text-lg); }
  .lesson-header p{ font-size: var(--text-sm); }

  /* Panel: reduce internal padding, let SVG fill the width */
  .panel{ border-radius: 4px; }
  .viz-mount svg{ height: auto; min-height: 180px; }

  /* Transport: wrap aggressively, make buttons touch-friendly */
  .transport{
    flex-wrap: wrap;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
  }
  .transport__btn{ width: 40px; height: 36px; font-size: 14px; }
  .transport__btn--primary{ width: 44px; }
  .transport input[type="range"]{ order: 5; flex-basis: 100%; margin: 0; }
  .transport__counter{ order: 4; }
  .transport__speed{ order: 3; margin-left: auto; }

  /* Input bar: stack vertically */
  .input-bar{ flex-direction: column; align-items: flex-start; gap: var(--space-2); }
  .input-bar__field{ max-width: 100%; width: 100%; }
  .input-bar__btn.is-race{ margin-left: 0; }

  /* Sidebar header: tighten */
  .sidebar__header{ padding: var(--space-4) var(--space-3); }

  /* Race overlay: single column on very small screens */
  .race-body{ grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .race-selectors{ flex-direction: column; align-items: flex-start; }
}

<script>
"use strict";

/* ============================================================
   ENGINE CORE
   Structure-agnostic timeline player. A "renderer" is any object
   exposing:
     mount(container)                 — build persistent DOM once
     renderStep(step, {duration,easing}) — transition to a step
   The Visualizer only manages timeline position, playback speed,
   captions, and event fan-out. It knows nothing about bars,
   nodes, or grids — that's the renderer's job.
   ============================================================ */

function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

const EASE = {
  expo:  cssVar('--ease-out-expo'),
  spring: cssVar('--ease-spring'),
  quart: cssVar('--ease-out-quart'),
};

const BASE_DURATION = 480; // ms, position/transform transitions, at 1x speed
const BASE_HOLD = 420;     // ms, extra pause per step during autoplay, at 1x speed

/* ---- Motion: the FLIP primitive ----------------------------
   Reads an element's CURRENT rendered transform/opacity (which
   may be mid-flight from a previous, still-running animation)
   *before* cancelling anything, then animates from that live
   value to the new target. This is what makes interrupted
   scrubbing continuous instead of jumpy: every new transition
   starts from wherever the element actually is, not from
   whatever was last commanded.

   The transform is a full 2D affine: translate + rotate + scale.
   Rotation matters once edges need to swivel to point at a moving
   child (a rigid translate/uniform-scale pair, as bars use, can't
   express that) — so `_read` does a real decomposition of the
   live matrix instead of assuming the diagonal is the whole story,
   and `moveTo` corrects the rotation to take the shortest angular
   path rather than spinning the long way around.

   Only `transform` and `opacity` are ever animated — never
   top/left/width/height — so nothing here triggers layout.
---------------------------------------------------------------*/
const Motion = {
  _mq: matchMedia('(prefers-reduced-motion: reduce)'),
  get reduced(){ return this._mq.matches; },

  stringify(t){
    const x = t.x || 0, y = t.y || 0, angle = t.angle || 0;
    const sx = t.scaleX == null ? 1 : t.scaleX;
    const sy = t.scaleY == null ? 1 : t.scaleY;
    return `translate(${x}px, ${y}px) rotate(${angle}deg) scale(${sx}, ${sy})`;
  },

  _read(el){
    const cs = getComputedStyle(el).transform;
    if (!cs || cs === 'none') return { x: 0, y: 0, angle: 0, scaleX: 1, scaleY: 1 };
    const m = new DOMMatrixReadOnly(cs);
    const scaleX = Math.hypot(m.a, m.b) || 1;
    const det = m.a * m.d - m.b * m.c;
    const scaleY = det / scaleX;
    const angle = Math.atan2(m.b, m.a) * 180 / Math.PI;
    return { x: m.e, y: m.f, angle, scaleX, scaleY };
  },

  // `fromHint` is an optional pre-read transform object — pass it from a
  // batch-read phase to avoid interleaved read/write style recalculations.
  moveTo(el, target, { duration, easing } = {}, fromHint){
    const t = { x: 0, y: 0, angle: 0, scaleX: 1, scaleY: 1, ...target };
    const toStr = this.stringify(t);

    if (this.reduced){
      el.__moveAnim && el.__moveAnim.cancel();
      el.style.transform = toStr;
      return;
    }

    const from = fromHint || this._read(el); // capture live value BEFORE cancelling
    el.__moveAnim && el.__moveAnim.cancel();
    el.style.transform = toStr;

    // Shortest-path angle correction: reframe the FROM angle so the
    // animated delta never exceeds 180deg, whichever direction that is.
    const rawDiff = t.angle - from.angle;
    const shortest = ((rawDiff + 180) % 360 + 360) % 360 - 180;
    const fromAngle = t.angle - shortest;

    const fromStr = this.stringify({ ...from, angle: fromAngle });
    if (fromStr === toStr) return;
    el.__moveAnim = el.animate(
      [{ transform: fromStr }, { transform: toStr }],
      { duration, easing, fill: 'both' }
    );
  },

  // Returns a promise that always settles once this specific fade is
  // "done" — immediately, if it turned out to be a no-op (already at the
  // target value), otherwise when the animation finishes or is itself
  // later superseded. Callers that need to sequence after a fade (the
  // caption crossfade below) can await this directly instead of reaching
  // into `__fadeAnim`, which may be a stale, idle animation left over
  // from an earlier no-op call — idle animations never spontaneously
  // resolve their `.finished` promise, so chaining onto one hangs forever.
  fadeTo(el, value, { duration, easing } = {}, fromOpacity){
    if (this.reduced){
      el.__fadeAnim && el.__fadeAnim.cancel();
      el.style.opacity = value;
      return Promise.resolve();
    }
    const cs = getComputedStyle(el).opacity;
    const from = fromOpacity != null ? fromOpacity : (cs === '' ? 1 : parseFloat(cs));
    el.__fadeAnim && el.__fadeAnim.cancel();
    el.style.opacity = value;
    if (from === value) return Promise.resolve();
    el.__fadeAnim = el.animate(
      [{ opacity: from }, { opacity: value }],
      { duration, easing, fill: 'both' }
    );
    return el.__fadeAnim.finished.catch(() => {});
  },
};

/* ---- Pulse: a persistent "active" loop, independent of Motion ----
   A comparison highlight needs to breathe for as long as a step is
   on screen, not just transition once — that's a different animation
   lifecycle than FLIP's one-shot state changes. It lives on its own
   inner element so it never fights a Motion.moveTo position tween
   running on the same node's outer transform.
-------------------------------------------------------------------*/
const Pulse = {
  start(el){
    if (Motion.reduced){
      el.classList.add('is-pulsing-static');
      return;
    }
    el.classList.remove('is-pulsing-static');
    if (el.__pulseAnim) return;
    el.__pulseAnim = el.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.14)' }, { transform: 'scale(1)' }],
      { duration: 900, easing: EASE.spring, iterations: Infinity }
    );
  },
  stop(el){
    el.classList.remove('is-pulsing-static');
    if (el.__pulseAnim){
      el.__pulseAnim.cancel();
      el.__pulseAnim = null;
      el.style.transform = '';
    }
  },
};

/* ---- InspectTooltip: click any rendered element for details -
   Callers do `InspectTooltip.show(clientX, clientY, 'Bar', {index:0, value:44})`
   on the element's click event. The tip auto-hides when the user
   clicks anywhere outside the viz or after a 2.5 s timeout.
--------------------------------------------------------------- */
const InspectTooltip = {
  _el: null,
  _timer: null,

  init(){
    const el = document.createElement('div');
    el.className = 'inspect-tip';
    el.id = 'inspect-tip';
    document.body.appendChild(el);
    this._el = el;
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.viz-mount, .race-body, .inspect-tip')) this.hide();
    });
  },

  show(clientX, clientY, type, fields){
    clearTimeout(this._timer);
    const el = this._el;
    if (!el) return;
    const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    el.innerHTML =
      `<div class="inspect-tip__header">${esc(type)}</div>` +
      Object.entries(fields).map(([k, v]) =>
        `<div><span class="inspect-tip__key">${esc(k)}: </span>${esc(String(v))}</div>`
      ).join('');
    // Clamp to viewport so the tip never clips an edge.
    const pad = 10;
    el.style.left = Math.min(clientX + 14, window.innerWidth - 210 - pad) + 'px';
    el.style.top = Math.min(clientY + 14, window.innerHeight - 120 - pad) + 'px';
    el.classList.add('is-visible');
    this._timer = setTimeout(() => this.hide(), 2500);
  },

  hide(){
    clearTimeout(this._timer);
    if (this._el) this._el.classList.remove('is-visible');
  },
};

/* ---- TickSound: synthesized step click, off by default ----- */
const TickSound = {
  _ctx: null,
  enabled: false,

  _getCtx(){
    if (!this._ctx){
      try { this._ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
    }
    return this._ctx;
  },

  tick(type = 'step'){
    if (!this.enabled) return;
    const ctx = this._getCtx();
    if (!ctx) return;
    // Resume context if suspended (browser autoplay policy)
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime;
    // Tiny triangle wave burst: low-pitched for swap, mid for compare, high for step
    const freq = type === 'swap' ? 280 : type === 'compare' ? 420 : 660;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.5, t + 0.06);
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    osc.start(t);
    osc.stop(t + 0.065);
  },
};

/* ---- RaceMode: side-by-side algorithm comparator ----------- */
const RACE_ALGOS = {
  'Bubble Sort':    (items) => bubbleSortSteps(items.map((v, i) => ({ id: 'rb' + i, value: v }))),
  'Insertion Sort': (items) => insertionSortSteps(items.map((v, i) => ({ id: 'ri' + i, value: v }))),
  'Quick Sort':     (items) => quickSortSteps(items.map((v, i) => ({ id: 'rq' + i, value: v }))),
  'Merge Sort':     (items) => mergeSortBarsSteps(items.map((v, i) => ({ id: 'rm' + i, value: v }))),
};

const RaceMode = {
  _el: null,
  _engines: [],
  _playing: false,

  init(){
    const el = document.createElement('div');
    el.className = 'race-overlay';
    el.id = 'race-overlay';
    el.innerHTML = `
      <div class="race-header">
        <span class="race-title">Algorithm Race</span>
        <button class="race-close" aria-label="Close race">&times;</button>
      </div>
      <div class="race-selectors">
        <div class="race-sel-group">
          <label class="race-sel-label">Left algorithm</label>
          <select class="race-sel js-left-algo">${Object.keys(RACE_ALGOS).map(n => `<option>${escapeHtml(n)}</option>`).join('')}</select>
        </div>
        <div class="race-sel-group">
          <label class="race-sel-label">Right algorithm</label>
          <select class="race-sel js-right-algo">${Object.keys(RACE_ALGOS).map((n, i) => `<option${i === 1 ? ' selected' : ''}>${escapeHtml(n)}</option>`).join('')}</select>
        </div>
        <button class="race-rebuild-btn js-race-rebuild">Rebuild</button>
      </div>
      <div class="race-body">
        <div class="race-col">
          <div class="race-col-label js-left-label">Bubble Sort</div>
          <div class="race-viz js-left-viz"></div>
          <div class="race-col-counter js-left-counter"></div>
        </div>
        <div class="race-col">
          <div class="race-col-label js-right-label">Insertion Sort</div>
          <div class="race-viz js-right-viz"></div>
          <div class="race-col-counter js-right-counter"></div>
        </div>
      </div>
      <div class="race-transport">
        <button class="race-btn js-race-back" aria-label="Step back">&#10216;</button>
        <button class="race-btn race-btn--primary js-race-play" aria-label="Play">&#9654;</button>
        <button class="race-btn js-race-fwd" aria-label="Step forward">&#10217;</button>
      </div>`;
    document.body.appendChild(el);
    this._el = el;

    el.querySelector('.race-close').addEventListener('click', () => this.close());
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this._el.classList.contains('is-open')) this.close(); });

    const btnPlay = el.querySelector('.js-race-play');
    const btnBack = el.querySelector('.js-race-back');
    const btnFwd  = el.querySelector('.js-race-fwd');

    btnPlay.addEventListener('click', () => {
      if (this._playing) this._pauseAll(); else this._playAll();
    });
    btnBack.addEventListener('click', () => { this._pauseAll(); this._engines.forEach(e => e.stepBack()); });
    btnFwd.addEventListener('click',  () => { this._pauseAll(); this._engines.forEach(e => e.stepForward()); });

    el.querySelector('.js-race-rebuild').addEventListener('click', () => {
      const leftName  = el.querySelector('.js-left-algo').value;
      const rightName = el.querySelector('.js-right-algo').value;
      this._build(leftName, rightName, this._items);
    });
  },

  open(items){
    this._items = items;
    const el = this._el;
    const leftName  = el.querySelector('.js-left-algo').value;
    const rightName = el.querySelector('.js-right-algo').value;
    this._build(leftName, rightName, items);
    el.classList.add('is-open');
  },

  close(){
    this._pauseAll();
    this._engines.forEach(e => e.pause());
    this._engines = [];
    const el = this._el;
    el.classList.remove('is-open');
    el.querySelector('.js-left-viz').innerHTML = '';
    el.querySelector('.js-right-viz').innerHTML = '';
  },

  _build(leftName, rightName, items){
    this._pauseAll();
    this._engines.forEach(e => e.pause());
    this._engines = [];

    const el = this._el;
    el.querySelector('.js-left-label').textContent  = leftName;
    el.querySelector('.js-right-label').textContent = rightName;

    const sides = [
      { name: leftName,  vizEl: el.querySelector('.js-left-viz'),  counterEl: el.querySelector('.js-left-counter')  },
      { name: rightName, vizEl: el.querySelector('.js-right-viz'), counterEl: el.querySelector('.js-right-counter') },
    ];

    sides.forEach(({ name, vizEl, counterEl }) => {
      vizEl.innerHTML = '';
      const stepsForAlgo = RACE_ALGOS[name];
      if (!stepsForAlgo) return;
      const timeline = stepsForAlgo(items);
      // Reconstruct items array: IDs come from timeline[0].order (stable creation order),
      // values come from items[] (array of numbers) at the same index.
      const sortedItems = timeline[0].order.map((id, i) => ({ id, value: items[i] }));
      const engine = new Visualizer({
        container: vizEl,
        renderer: new ArrayBarsRenderer({ values: sortedItems }),
        timeline,
        captionEl: null,
        speed: 1,
      });
      engine.on('change', ({ index }) => {
        counterEl.textContent = `Step ${index + 1} / ${engine.length}`;
        if (index === engine.length - 1){
          counterEl.textContent += ' ✓ Done';
          counterEl.classList.add('is-done');
        } else {
          counterEl.classList.remove('is-done');
        }
      });
      counterEl.textContent = `Step 1 / ${engine.length}`;
      this._engines.push(engine);
    });

    const btnPlay = el.querySelector('.js-race-play');
    btnPlay.innerHTML = '&#9654;';
    btnPlay.setAttribute('aria-label', 'Play');
    this._playing = false;
  },

  _playAll(){
    this._playing = true;
    const btnPlay = this._el.querySelector('.js-race-play');
    btnPlay.innerHTML = '&#10074;&#10074;';
    btnPlay.setAttribute('aria-label', 'Pause');
    const engines = this._engines.slice(); // snapshot, safe in listeners
    engines.forEach(e => {
      e.play();
      // When an engine auto-pauses (end of timeline), check if all are done.
      e.on('pause', () => {
        if (!this._playing) return;
        const allDone = engines.every(eng => eng.atEnd);
        if (allDone) this._pauseAll();
      });
    });
  },

  _pauseAll(){
    this._playing = false;
    const btnPlay = this._el.querySelector('.js-race-play');
    if (btnPlay){ btnPlay.innerHTML = '&#9654;'; btnPlay.setAttribute('aria-label', 'Play'); }
    this._engines.forEach(e => e.pause());
  },
};

/* ---- Visualizer: timeline + playback ------------------------ */
class Visualizer{
  constructor({ container, renderer, timeline = [], captionEl, speed = 1 }){
    this.renderer = renderer;
    this.timeline = timeline;
    this.index = 0;
    this.speed = speed;
    this.playing = false;
    this.captionEl = captionEl;
    this._timer = null;
    this._pendingIndex = 0;
    this._seekScheduled = false;
    this._listeners = {};

    this._captionGen = 0;
    this.renderer.mount(container);
    // Renderers that lazily create elements inside renderStep (tree nodes,
    // growth bars) draw nothing in mount() itself — without this, the very
    // first step wouldn't appear until the first play/step/seek call. This
    // renders step 0 instantly (duration 0) rather than animating "birth"
    // transforms in, so a first paint never looks like elements flying in
    // from nowhere. ArrayBarsRenderer's mount() already matches step 0, so
    // this is a harmless no-op there — but a real fix for renderers that don't.
    this._render(true);
  }

  get length(){ return this.timeline.length; }
  get atEnd(){ return this.index >= this.length - 1; }
  get atStart(){ return this.index <= 0; }

  setSpeed(x){ this.speed = x; }

  _durations(){
    return { duration: BASE_DURATION / this.speed, easing: EASE.expo };
  }

  _render(instant){
    const step = this.timeline[this.index];
    if (!step) return;
    const durations = instant ? { duration: 0, easing: EASE.expo } : this._durations();
    this.renderer.renderStep(step, durations);
    this._setCaption(step.caption, instant);
    this._emit('change', { index: this.index, step });
    if (!instant){
      const type = step.swap && step.swap.length ? 'swap' : step.compare && step.compare.length ? 'compare' : 'step';
      TickSound.tick(type);
    }
  }

  // A generation counter, checked when the fade-out settles: whichever
  // _setCaption call is *last* by then wins, so a burst of rapid steps
  // never leaves a stale caption's text-swap racing in after a newer one.
  _setCaption(text, instant){
    if (!this.captionEl) return;
    const gen = ++this._captionGen;
    if (instant || Motion.reduced){ this.captionEl.textContent = text || ''; return; }
    Motion.fadeTo(this.captionEl, 0, { duration: 120, easing: EASE.quart }).then(() => {
      if (gen !== this._captionGen) return; // a newer caption already superseded this one
      this.captionEl.textContent = text || '';
      Motion.fadeTo(this.captionEl, 1, { duration: 180, easing: EASE.quart });
    });
  }

  // Scrubbing is throttled to one seek per animation frame: fast
  // drags collapse to their latest value instead of queuing every
  // intermediate step, and Motion's live-read means each re-target
  // still animates smoothly from wherever elements currently are.
  seek(i){
    this._pendingIndex = Math.max(0, Math.min(this.length - 1, Math.round(i)));
    if (this._seekScheduled) return;
    this._seekScheduled = true;
    requestAnimationFrame(() => {
      this._seekScheduled = false;
      this.index = this._pendingIndex;
      this._render();
    });
  }

  stepForward(){
    if (this.atEnd){ this.pause(); return; }
    this.index++;
    this._render();
  }

  stepBack(){
    if (this.atStart) return;
    this.index--;
    this._render();
  }

  play(){
    if (this.playing || this.length === 0) return;
    if (this.atEnd){ this.index = 0; this._render(); }
    this.playing = true;
    this._emit('play');
    this._tick();
  }

  pause(){
    if (!this.playing) return;
    this.playing = false;
    clearTimeout(this._timer);
    this._emit('pause');
  }

  _tick(){
    const { duration } = this._durations();
    const delay = duration + BASE_HOLD / this.speed;
    this._timer = setTimeout(() => {
      if (!this.playing) return;
      if (this.atEnd){ this.pause(); return; }
      this.stepForward();
      this._tick();
    }, delay);
  }

  on(evt, fn){ (this._listeners[evt] = this._listeners[evt] || []).push(fn); }
  _emit(evt, data){ (this._listeners[evt] || []).forEach(fn => fn(data)); }
}

/* ============================================================
   RENDERER: array-of-bars
   ============================================================ */
class ArrayBarsRenderer{
  constructor({ values, width = 640, height = 320, gap = 16, address = null }){
    this.values = values;
    this.width = width;
    this.height = height;
    this.gap = gap;
    this.address = address; // { base, stride } -> shows "base + i*stride" style labels below each bar
    this.max = Math.max.apply(null, values.map(v => v.value));
    this.els = new Map(); // id -> { g, rect, overlay, label }
  }

  mount(container){
    const n = this.values.length;
    this.slotWidth = this.width / n;
    this.barWidth = this.slotWidth - this.gap;
    this.baseline = this.height - 40;
    this.usableHeight = this.height - 70;

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${this.width} ${this.height}`);
    svg.classList.add('viz-svg');
    container.appendChild(svg);

    this.values.forEach((item, i) => {
      const barH = (item.value / this.max) * this.usableHeight;

      const g = document.createElementNS(NS, 'g');
      g.classList.add('bar');

      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', 0);
      rect.setAttribute('y', this.baseline - barH);
      rect.setAttribute('width', this.barWidth);
      rect.setAttribute('height', barH);
      rect.setAttribute('rx', 4);
      rect.classList.add('bar-fill');
      if (item.hidden) rect.classList.add('bar-fill--ghost');

      const overlay = rect.cloneNode();
      overlay.classList.remove('bar-fill--ghost');
      overlay.classList.add('bar-overlay');
      overlay.style.opacity = 0;

      const label = document.createElementNS(NS, 'text');
      label.setAttribute('x', this.barWidth / 2);
      label.setAttribute('y', this.baseline - barH - 10);
      label.setAttribute('text-anchor', 'middle');
      label.classList.add('bar-label');
      label.textContent = item.hidden ? '' : item.value;

      g.appendChild(rect);
      g.appendChild(overlay);
      g.appendChild(label);
      svg.appendChild(g);

      g.style.transform = `translate(${i * this.slotWidth}px, 0px)`;
      const rec = { g, rect, overlay, label, value: item.value, hidden: !!item.hidden, state: 'default', index: i };
      this.els.set(item.id, rec);

      // Click-to-inspect: show index, value, and current comparison state.
      g.addEventListener('click', (e) => {
        if (rec.hidden) return;
        InspectTooltip.show(e.clientX, e.clientY, 'Array Bar', {
          index: rec.index,
          value: rec.value,
          state: rec.state,
        });
        e.stopPropagation();
      });
    });

    // Address labels belong to physical SLOTS, not values — a shifted
    // element carries its value to a new slot, but the slot's address
    // never moves, so these are static and never touched by Motion.
    if (this.address){
      const { base, stride } = this.address;
      for (let i = 0; i < n; i++){
        const addr = document.createElementNS(NS, 'text');
        addr.setAttribute('x', i * this.slotWidth + this.barWidth / 2);
        addr.setAttribute('y', this.baseline + 18);
        addr.setAttribute('text-anchor', 'middle');
        addr.classList.add('bar-address');
        addr.textContent = '@' + (base + i * stride);
        svg.appendChild(addr);
      }
    }
  }

  renderStep(step, { duration, easing }){
    const order = step.order;
    const compare = step.compare || [];
    const swap = step.swap || [];
    const sorted = step.sorted || [];
    const dim = step.dim || [];
    const conceal = step.conceal || [];

    // reveal entries are either a plain id (show the value baked in at
    // construction) or {id, value} (show a NEW value — this is what lets
    // a stack/queue slot be popped then reused for a different push
    // without needing to recompute bar geometry, since height stays fixed
    // and only the label text changes).
    const revealMap = new Map();
    (step.reveal || []).forEach(r => {
      if (typeof r === 'string') revealMap.set(r, undefined);
      else revealMap.set(r.id, r.value);
    });

    // Batch-read phase: capture all live transforms/opacities before any writes.
    // Interleaving getComputedStyle with style mutations forces repeated style
    // recalculations; separating reads from writes keeps each step at one recalc.
    const fromT = new Map(), fromO = new Map();
    order.forEach(id => {
      const el = this.els.get(id);
      fromT.set(id, Motion._read(el.g));
      fromO.set(id, parseFloat(getComputedStyle(el.g).opacity) || 1);
    });

    order.forEach((id, i) => {
      const el = this.els.get(id);

      el.index = i; // keep index fresh for inspect tooltip
      if (el.hidden && revealMap.has(id)){
        const overrideValue = revealMap.get(id);
        el.rect.classList.remove('bar-fill--ghost');
        el.label.textContent = overrideValue != null ? overrideValue : el.value;
        el.hidden = false;
      }
      if (!el.hidden && conceal.indexOf(id) !== -1){
        el.rect.classList.add('bar-fill--ghost');
        el.label.textContent = '';
        el.hidden = true;
      }

      Motion.moveTo(el.g, { x: i * this.slotWidth, y: 0 }, { duration, easing }, fromT.get(id));
      Motion.fadeTo(el.g, dim.indexOf(i) !== -1 ? 0.3 : 1, { duration: Math.min(duration, 220), easing: EASE.quart }, fromO.get(id));

      let color = null;
      if (swap.indexOf(i) !== -1) color = 'var(--swap-color)';
      else if (compare.indexOf(i) !== -1) color = 'var(--compare-color)';
      else if (sorted.indexOf(i) !== -1) color = 'var(--sorted-color)';

      if (color){
        el.overlay.style.fill = color;
        Motion.fadeTo(el.overlay, 1, { duration: Math.min(duration, 240), easing: EASE.spring });
      } else {
        Motion.fadeTo(el.overlay, 0, { duration: Math.min(duration, 200), easing: EASE.quart });
      }

      // Keep state for inspect tooltip
      el.state = swap.indexOf(i) !== -1 ? 'swap'
        : compare.indexOf(i) !== -1 ? 'compare'
        : sorted.indexOf(i) !== -1 ? 'sorted'
        : dim.indexOf(i) !== -1 ? 'dimmed'
        : 'default';
    });
  }
}

/* ============================================================
   RENDERER: growth bars (Big-O)
   Bars stay in fixed horizontal slots for their whole life — only
   their height (scaleY, anchored at the baseline) and value label
   change per step. A bar can also *appear* mid-timeline (the
   exponential-time reveal), entering the same way tree nodes do:
   born at zero scale, then FLIPped up to its real height. Because
   the height is always "current value's log10 as a fraction of
   this step's fixed max", recalibrating that max between steps
   (e.g. once O(2^n) enters the race) makes every other bar visibly
   shrink in relative terms — that recalibration IS the lesson.
   ============================================================ */
class GrowthBarsRenderer{
  constructor({ width = 640, height = 340, gap = 20 } = {}){
    this.width = width;
    this.height = height;
    this.gap = gap;
    this.baseline = height - 46;
    this.usableHeight = height - 90;
    this.els = new Map(); // id -> { g, fill, valueGroup, valueText }
  }

  mount(container){
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${this.width} ${this.height}`);
    svg.classList.add('viz-svg');
    container.appendChild(svg);
    this.svg = svg;
  }

  _formatOps(v){
    if (v < 1000) return String(Math.round(v));
    return new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 }).format(v);
  }

  renderStep(step, { duration, easing }){
    const bars = step.bars || [];
    const n = bars.length;
    this.slotWidth = this.width / Math.max(n, 6);
    this.barWidth = this.slotWidth - this.gap;

    bars.forEach((b, i) => {
      const isNew = !this.els.has(b.id);
      const x = i * this.slotWidth;
      const topY = this.baseline - b.heightFrac * this.usableHeight - 10;

      if (isNew){
        const NS = 'http://www.w3.org/2000/svg';
        const g = document.createElementNS(NS, 'g');
        g.classList.add('growth-bar');
        g.style.opacity = 0;
        g.style.transform = `translate(${x}px, 0px)`;

        const fill = document.createElementNS(NS, 'rect');
        fill.setAttribute('x', 0);
        fill.setAttribute('y', this.baseline - this.usableHeight);
        fill.setAttribute('width', this.barWidth);
        fill.setAttribute('height', this.usableHeight);
        fill.setAttribute('rx', 4);
        fill.classList.add('growth-bar__fill');
        fill.style.fill = b.color;
        fill.style.transform = Motion.stringify({ scaleY: 0.001 });

        const valueGroup = document.createElementNS(NS, 'g');
        valueGroup.classList.add('growth-bar__value');
        const valueText = document.createElementNS(NS, 'text');
        valueText.setAttribute('x', this.barWidth / 2);
        valueGroup.appendChild(valueText);

        const label = document.createElementNS(NS, 'text');
        label.setAttribute('x', this.barWidth / 2);
        label.setAttribute('y', this.baseline + 20);
        label.classList.add('growth-bar__label');
        label.style.fill = b.color;
        label.textContent = b.label;

        g.appendChild(fill);
        g.appendChild(valueGroup);
        g.appendChild(label);
        this.svg.appendChild(g);

        this.els.set(b.id, { g, fill, valueGroup, valueText });
      }

      const el = this.els.get(b.id);
      Motion.moveTo(el.fill, { scaleY: Math.max(b.heightFrac, 0.001) }, { duration, easing });
      Motion.moveTo(el.valueGroup, { x: 0, y: topY }, { duration, easing });
      Motion.fadeTo(el.g, 1, { duration, easing });
      el.valueText.textContent = this._formatOps(b.value);
    });
  }
}

/* ============================================================
   RENDERER: node-graph (binary tree)
   The hard case: node identity persists across structural
   mutation (insert, rotation), so a node/edge already on screen
   is always FLIP-moved to its recomputed position rather than
   destroyed and recreated. Edges are unit segments stretched and
   rotated into place via the same transform+opacity vocabulary —
   a rotation "morphs" an edge because it's just a new angle and
   length for an element that already exists, not a new element.
   ============================================================ */
class TreeGraphRenderer{
  constructor({ width = 600, height = 420, nodeRadius = 19 } = {}){
    this.width = width;
    this.height = height;
    this.nodeRadius = nodeRadius;
    this.nodeEls = new Map(); // id -> { g, pulse, circle, label }
    this.edgeEls = new Map(); // id (= child id) -> { line }
  }

  mount(container){
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${this.width} ${this.height}`);
    svg.classList.add('viz-svg');

    this.edgeLayer = document.createElementNS(NS, 'g');
    this.nodeLayer = document.createElementNS(NS, 'g');
    svg.appendChild(this.edgeLayer);
    svg.appendChild(this.nodeLayer);
    container.appendChild(svg);
    this.svg = svg;
  }

  _edgeTransform(parentPos, childPos){
    const dx = childPos.x - parentPos.x, dy = childPos.y - parentPos.y;
    const dist = Math.hypot(dx, dy) || 1;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const r = this.nodeRadius;
    return {
      x: parentPos.x + (r / dist) * dx,
      y: parentPos.y + (r / dist) * dy,
      angle,
      scaleX: Math.max(dist - 2 * r, 0),
      scaleY: 1,
    };
  }

  _makeNode(id, value){
    const NS = 'http://www.w3.org/2000/svg';
    const g = document.createElementNS(NS, 'g');
    g.classList.add('tnode');
    g.style.opacity = 0;

    const pulse = document.createElementNS(NS, 'g');
    pulse.classList.add('tnode-pulse');

    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('r', this.nodeRadius);
    circle.classList.add('tnode-circle');

    const label = document.createElementNS(NS, 'text');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('dy', '0.32em');
    label.classList.add('tnode-label');
    label.textContent = value;

    pulse.appendChild(circle);
    pulse.appendChild(label);
    g.appendChild(pulse);
    this.nodeLayer.appendChild(g);

    const rec = { g, pulse, circle, label, _state: 'default' };
    this.nodeEls.set(id, rec);

    g.addEventListener('click', (e) => {
      InspectTooltip.show(e.clientX, e.clientY, 'Tree Node', {
        id,
        value,
        state: rec._state,
      });
      e.stopPropagation();
    });

    return rec;
  }

  _makeEdge(id){
    const NS = 'http://www.w3.org/2000/svg';
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', 0); line.setAttribute('y1', 0);
    line.setAttribute('x2', 1); line.setAttribute('y2', 0);
    line.classList.add('tedge');
    line.style.opacity = 0;
    this.edgeLayer.appendChild(line);
    const rec = { line };
    this.edgeEls.set(id, rec);
    return rec;
  }

  renderStep(step, { duration, easing }){
    const nodes = step.nodes || [];
    const parents = step.parents || new Map();
    const comparing = step.comparing;
    const path = step.path || [];
    const newNode = step.newNode;

    const presentIds = new Set(nodes.map(n => n.id));
    const posById = new Map(nodes.map(n => [n.id, n]));

    // Retire anything no longer in the tree (future-proofs delete lessons).
    this.nodeEls.forEach((rec, id) => {
      if (presentIds.has(id)) return;
      Motion.fadeTo(rec.g, 0, { duration, easing });
      Pulse.stop(rec.pulse);
      this.nodeEls.delete(id);
      setTimeout(() => rec.g.remove(), duration + 30);
    });
    this.edgeEls.forEach((rec, id) => {
      if (presentIds.has(id)) return;
      Motion.fadeTo(rec.line, 0, { duration, easing });
      this.edgeEls.delete(id);
      setTimeout(() => rec.line.remove(), duration + 30);
    });

    nodes.forEach(n => {
      const parentId = parents.get(n.id);
      const isNewNode = !this.nodeEls.has(n.id);

      let entryPos = n;
      if (isNewNode && parentId && posById.has(parentId)) entryPos = posById.get(parentId);
      const rec = isNewNode ? this._makeNode(n.id, n.value) : this.nodeEls.get(n.id);

      if (isNewNode) rec.g.style.transform = Motion.stringify({ x: entryPos.x, y: entryPos.y });
      Motion.moveTo(rec.g, { x: n.x, y: n.y }, { duration, easing });
      Motion.fadeTo(rec.g, 1, { duration, easing });

      const isComparing = comparing === n.id;
      rec.circle.classList.toggle('is-comparing', isComparing);
      rec.circle.classList.toggle('is-path', !isComparing && path.indexOf(n.id) !== -1);
      rec.circle.classList.toggle('is-new', n.id === newNode);
      if (isComparing) Pulse.start(rec.pulse); else Pulse.stop(rec.pulse);
      rec._state = isComparing ? 'comparing' : path.indexOf(n.id) !== -1 ? 'path' : n.id === newNode ? 'new' : 'default';
    });

    nodes.forEach(n => {
      const parentId = parents.get(n.id);
      const isNewEdge = !this.edgeEls.has(n.id);
      const edge = isNewEdge ? this._makeEdge(n.id) : this.edgeEls.get(n.id);

      if (!parentId){
        Motion.fadeTo(edge.line, 0, { duration, easing });
        return;
      }
      const target = this._edgeTransform(posById.get(parentId), n);
      if (isNewEdge){
        // Appear already correctly angled/placed, at zero length, then grow —
        // no flight-in from the SVG origin, no rotation-during-birth artifact.
        edge.line.style.transform = Motion.stringify({ ...target, scaleX: 0.001 });
      }
      Motion.moveTo(edge.line, target, { duration, easing });
      Motion.fadeTo(edge.line, 1, { duration, easing });

      const traversedChildren = path.slice(1);
      edge.line.classList.toggle('is-path', traversedChildren.indexOf(n.id) !== -1);
    });
  }
}

/* ============================================================
   DEMO 1: bubble sort on 8 bars
   ============================================================ */
function bubbleSortSteps(items){
  const arr = items.slice();
  const n = arr.length;
  const steps = [];
  let sortedIdxs = [];

  const snap = (extra) => Object.assign({
    order: arr.map(x => x.id),
    compare: [],
    swap: [],
    sorted: sortedIdxs.slice(),
    caption: '',
  }, extra);

  steps.push(snap({ caption: `${n} unsorted values. Bubble sort walks the row, swapping neighbors that are out of order.` }));

  for (let i = 0; i < n - 1; i++){
    let swappedAny = false;
    for (let j = 0; j < n - 1 - i; j++){
      const a = arr[j].value, b = arr[j + 1].value;
      steps.push(snap({ compare: [j, j + 1], caption: `Compare ${a} and ${b}.` }));
      if (a > b){
        const tmp = arr[j]; arr[j] = arr[j + 1]; arr[j + 1] = tmp;
        swappedAny = true;
        steps.push(snap({ swap: [j, j + 1], caption: `${a} > ${b} — swap.` }));
      }
    }
    sortedIdxs = sortedIdxs.concat([n - 1 - i]);
    steps.push(snap({ sorted: sortedIdxs, caption: `${arr[n - 1 - i].value} settles into position ${n - i}.` }));
    if (!swappedAny) break;
  }
  for (let k = 0; k < n; k++) if (sortedIdxs.indexOf(k) === -1) sortedIdxs = sortedIdxs.concat([k]);
  steps.push(snap({ sorted: sortedIdxs, caption: 'Sorted.' }));

  return steps;
}

function generateValues(n){
  const nums = new Set();
  while (nums.size < n) nums.add(15 + Math.floor(Math.random() * 85));
  return Array.from(nums).map((value, i) => ({ id: 'b' + i, value }));
}

/* ============================================================
   DEMO 2: BST insert of 8 values + one AVL right-rotation
   The tree is a real, mutable node structure. Positions are never
   stored on the model — computeTidyLayout derives x/y fresh from
   the current shape on every single step, so "recalculated per
   step" isn't a renderer trick, it's the only source of truth.
   ============================================================ */
let __nodeUid = 0;
function makeTreeNode(value){ return { id: 'tn' + (__nodeUid++), value, left: null, right: null }; }

function findByValue(node, value){
  if (!node) return null;
  if (node.value === value) return node;
  return value < node.value ? findByValue(node.left, value) : findByValue(node.right, value);
}

function findParentOf(root, childId){
  if (!root) return null;
  if ((root.left && root.left.id === childId) || (root.right && root.right.id === childId)) return root;
  return findParentOf(root.left, childId) || findParentOf(root.right, childId);
}

// Plain (unstepped) insert — used to quickly build a starting shape for a
// demo (e.g. a deliberately imbalanced tree) without emitting timeline steps.
function insertPlainBST(root, value){
  if (!root) return makeTreeNode(value);
  if (value < root.value) root.left = insertPlainBST(root.left, value);
  else root.right = insertPlainBST(root.right, value);
  return root;
}

// Two-pass binary-tree tidy layout: pass 1 assigns each node an
// in-order slot (leaves and internal nodes alike get a unique,
// order-preserving x); pass 2 walks bottom-up and re-centers every
// internal node over its children (mean of two, or flush above one),
// which is what actually makes it read as "tidy" rather than just
// "non-overlapping."
function computeTidyLayout(root, opts){
  const hGap = (opts && opts.hGap) || 66;
  const vGap = (opts && opts.vGap) || 78;
  const marginX = (opts && opts.marginX) || 50;
  const marginY = (opts && opts.marginY) || 42;

  const slot = new Map(); // id -> {x, y}
  let counter = 0;

  (function firstPass(node, depth){
    if (!node) return;
    firstPass(node.left, depth + 1);
    slot.set(node.id, { x: counter++, y: depth });
    firstPass(node.right, depth + 1);
  })(root, 0);

  (function secondPass(node){
